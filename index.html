    function ensureSupabaseClient() {
      if (!supabaseClient && window.supabase && typeof window.supabase.createClient === 'function') {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function waitForSupabaseClient(maxWaitMs = 4000) {
      if (ensureSupabaseClient()) return supabaseClient;
      const startTs = Date.now();
      while (Date.now() - startTs < maxWaitMs) {
        await new Promise(resolve => setTimeout(resolve, 100));
        if (ensureSupabaseClient()) return supabaseClient;
      }
      return ensureSupabaseClient();
    }

    function parseUsernameAndCode(rawUsername, explicitCode) {
      const raw = String(rawUsername || '').trim();
      if (explicitCode) {
        return {
          access_code: String(explicitCode).trim().toUpperCase(),
          telegram_username: raw.includes('|') ? raw.split('|')[1].trim().replace(/^@/, '') : (raw.toUpperCase().startsWith('STEP-') ? '' : raw.replace(/^@/, ''))
        };
      }
      if (raw.includes('|')) {
        const [codePart, tgPart] = raw.split('|');
        return {
          access_code: (codePart || '').trim().toUpperCase(),
          telegram_username: (tgPart || '').trim().replace(/^@/, '')
        };
      }
      if (raw.toUpperCase().startsWith('STEP-')) {
        return {
          access_code: raw.toUpperCase(),
          telegram_username: ''
        };
      }
      return {
        access_code: '',
        telegram_username: raw.replace(/^@/, '')
      };
    }

    function buildEncodedUsername(accessCode, tgUsername) {
      const cleanCode = String(accessCode || '').trim().toUpperCase();
      const cleanTg = String(tgUsername || '').trim().replace(/^@/, '');
      if (cleanCode && cleanTg) return `${cleanCode}|${cleanTg}`;
      if (cleanCode) return cleanCode;
      return cleanTg;
    }

    function toValidNumericIdOrNull(rawId) {
      if (rawId === null || rawId === undefined || rawId === '') return null;
      const str = String(rawId).trim();
      if (str.startsWith('step-') || str.startsWith('bk-') || str.startsWith('w-')) return null;
      const num = Number(str);
      return Number.isInteger(num) && num > 0 ? num : null;
    }

            duration: Number(s.duration) || 60,
            is_open: Boolean(s.is_open),

        const totalSessions = Math.max(0, Number(st.subscription.total_sessions ?? st.subscription.total ?? 0));

    function syncSupabaseStateToLocalApp(user, sub, bookings, preferredStudentId = null, profileMeta = null) {
      if (typeof appData === 'undefined' || !appData || !Array.isArray(appData.students)) return;
      if (!user || !user.id) return;
      if (user.role === 'coach' || user.role === 'trainer') return;

      let student = null;
      if (preferredStudentId) {
        student = appData.students.find(s => String(s.id) === String(preferredStudentId) || String(s.supabase_id) === String(preferredStudentId) || (s.access_code && String(s.access_code).toUpperCase() === String(preferredStudentId).toUpperCase()));
      }
      if (!student) {
        student = appData.students.find(s => String(s.id) === String(user.id) || String(s.supabase_id) === String(user.id));
      }
      if (!student) return;

      const oldId = student.id;
      const newId = user.id;

      if (oldId !== newId) {
        student.id = newId;
        student.supabase_id = newId;
        if (appData.current_student_id === oldId) {
          appData.current_student_id = newId;
        }
        if (appData.schedule_slots) {
          Object.keys(appData.schedule_slots).forEach(dateKey => {
            (appData.schedule_slots[dateKey] || []).forEach(slot => {
              if (String(slot.booked_by) === String(oldId)) {
                slot.booked_by = newId;
              }
            });
          });
        }
      } else {
        student.supabase_id = newId;
      }

      const fullName = `${user.first_name || ''} ${user.last_name || ''}`.trim() || (profileMeta && profileMeta.full_name) || user.name || '';
      if (fullName && !fullName.startsWith('Демо ')) {
        student.full_name = fullName;
      }

      const metaSub = (profileMeta && profileMeta.subscription) ? profileMeta.subscription : null;
      if (sub || metaSub) {
        if (sub) currentSubscription = sub;
        const metaTotal = metaSub ? Number(metaSub.total ?? metaSub.total_sessions) : NaN;
        const subTotal = sub ? Number(sub.total_sessions) : NaN;
        const total = Math.max(0, (!isNaN(metaTotal) && (metaTotal > 0 || !subTotal)) ? metaTotal : (Number(sub?.total_sessions ?? student.subscription?.total ?? 0) || 0));

        const metaUsed = metaSub ? Number(metaSub.used ?? metaSub.used_sessions) : NaN;
        const subUsed = sub ? Number(sub.used_sessions) : NaN;
        const used = Math.min(total, Math.max(0, (!isNaN(metaUsed) && (metaUsed > 0 || !subUsed)) ? metaUsed : (Number(sub?.used_sessions ?? student.subscription?.used ?? 0) || 0)));

        const remaining = Math.max(0, total - used);
        const dur = Number(profileMeta?.session_duration ?? sub?.session_duration_minutes ?? student.session_duration) || 60;
        const billDay = Math.min(28, Math.max(1, Number(metaSub?.payment_day ?? metaSub?.billing_day ?? sub?.billing_day ?? student.subscription?.payment_day) || 1));

        student.session_duration = dur;
        if (!student.subscription) student.subscription = {};
        if (sub && sub.id) student.subscription.id = sub.id;
        student.subscription.total = total;
        student.subscription.total_sessions = total;
        student.subscription.used = used;
        student.subscription.used_sessions = used;
        student.subscription.remaining = remaining;
        student.subscription.payment_day = billDay;
        student.subscription.billing_day = billDay;

        const resolvedSum = metaSub?.robokassa_sum ?? sub?.robokassa_sum ?? student.subscription.robokassa_sum ?? '0 ₽';
        const resolvedUrl = metaSub?.robokassa_url ?? sub?.robokassa_url ?? student.subscription.robokassa_url ?? '';
        student.subscription.robokassa_sum = resolvedSum;
        student.subscription.robokassa_url = resolvedUrl;
      }

      if (profileMeta) {
        if (profileMeta.freeze_details) {
          student.freeze_details = profileMeta.freeze_details;
          student.status = profileMeta.freeze_details.is_frozen ? 'frozen' : 'active';
        }
        if (profileMeta.medical_notes !== undefined) student.medical_notes = profileMeta.medical_notes;
        if (profileMeta.trainer_private_notes !== undefined) student.trainer_private_notes = profileMeta.trainer_private_notes;
        if (profileMeta.notification_settings) student.notification_settings = profileMeta.notification_settings;
        if (Array.isArray(profileMeta.workouts)) student.workouts = profileMeta.workouts;
        if (Array.isArray(profileMeta.anthropometry)) student.anthropometry = profileMeta.anthropometry.map(normalizeAnthropometryRecord);
        if (Array.isArray(profileMeta.checkups)) student.checkups = profileMeta.checkups;
        if (Array.isArray(profileMeta.inbody)) student.inbody = profileMeta.inbody.map(enrichInBodyRecord);
      }

      if (Array.isArray(bookings)) {
        const todayIso = formatISO(getTodayDateObj());
        const confirmed = bookings.filter(b => (!b.status || b.status === 'confirmed') && (!b.session_date || b.session_date >= todayIso));
        if (appData.schedule_slots) {
          Object.keys(appData.schedule_slots).forEach(dateKey => {
            (appData.schedule_slots[dateKey] || []).forEach(slot => {
              if (String(slot.booked_by) === String(student.id)) {
                slot.booked_by = null;
                slot.is_open = slot.baseline_closed ? false : Boolean(slot.is_open);
              }
            });
          });
        }

        student.active_bookings = confirmed.map(b => {
          const dur = Number(b.duration_minutes) || student.session_duration || 60;
          const dateStr = b.session_date;
          const timeStr = b.session_time;
          if (appData.schedule_slots && appData.schedule_slots[dateStr]) {
            const daySlots = appData.schedule_slots[dateStr];
            const startIdx = daySlots.findIndex(s => s.time === timeStr);
            const hoursNeeded = Math.ceil(dur / 60);
            if (startIdx !== -1) {
              for (let k = 0; k < hoursNeeded; k++) {
                if (daySlots[startIdx + k]) {
                  daySlots[startIdx + k].booked_by = student.id;
                }
              }
            }
          }
          return {
            id: b.id || ('bk-' + Date.now() + '-' + Math.random().toString(36).slice(2, 5)),
            date: dateStr,
            time: timeStr,
            duration: dur
          };
        });
        student.active_bookings.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
      }
    }

    async function syncAllStudentsFromSupabase() {
      await waitForSupabaseClient();
      if (!supabaseClient) {
        console.warn('syncAllStudentsFromSupabase: клиент Supabase не готов');
        return;
      }
      try {
        const [usersRes, subsRes, bksRes, reportsRes] = await Promise.allSettled([
          supabaseClient.from('users').select('*').eq('role', 'student'),
          supabaseClient.from('subscriptions').select('*').eq('status', 'active'),
          supabaseClient.from('bookings').select('*').eq('status', 'confirmed'),
          supabaseClient.from('student_reports').select('*').in('type', ['profile_meta', 'schedule_meta'])
        ]);

        const users = (usersRes.status === 'fulfilled' && usersRes.value && Array.isArray(usersRes.value.data)) ? usersRes.value.data : [];
        const subs = (subsRes.status === 'fulfilled' && subsRes.value && Array.isArray(subsRes.value.data)) ? subsRes.value.data : [];
        const bks = (bksRes.status === 'fulfilled' && bksRes.value && Array.isArray(bksRes.value.data)) ? bksRes.value.data : [];
        const reports = (reportsRes.status === 'fulfilled' && reportsRes.value && Array.isArray(reportsRes.value.data)) ? reportsRes.value.data : [];

        const scheduleReports = reports.filter(r => r.type === 'schedule_meta' && r.student_code === 'TRAINER_SCHEDULE');
        const scheduleReport = scheduleReports.length > 0 ? scheduleReports[scheduleReports.length - 1] : null;
        if (scheduleReport && scheduleReport.photo_file_id) {
          try {
            const parsedSchedule = JSON.parse(scheduleReport.photo_file_id);
            if (parsedSchedule && typeof parsedSchedule === 'object') {
              Object.keys(parsedSchedule).forEach(dateKey => {
                if (Array.isArray(parsedSchedule[dateKey])) {
                  appData.schedule_slots[dateKey] = parsedSchedule[dateKey].map(s => ({
                    time: s.time,
                    duration: Number(s.duration) || 60,
                    is_open: Boolean(s.is_open),
                    baseline_closed: s.baseline_closed !== undefined ? Boolean(s.baseline_closed) : !Boolean(s.is_open),
                    booked_by: null
                  }));
                }
              });
            }
          } catch (e) {}
        }

        if (appData.schedule_slots) {
          Object.keys(appData.schedule_slots).forEach(dateKey => {
            (appData.schedule_slots[dateKey] || []).forEach(slot => {
              slot.booked_by = null;
            });
          });
        }

        const subsMap = new Map();
        subs.forEach(s => {
          const prev = subsMap.get(s.student_id);
          if (!prev || Number(s.id) > Number(prev.id)) {
            subsMap.set(s.student_id, s);
          }
        });

        const todayIsoNow = formatISO(getTodayDateObj());
        const bksMap = new Map();
        bks.forEach(b => {
          if (b.session_date && b.session_date < todayIsoNow) return;
          if (!bksMap.has(b.student_id)) bksMap.set(b.student_id, []);
          bksMap.get(b.student_id).push(b);
        });

        const metaMap = new Map();
        const profileMetaRecords = [];
        reports.filter(r => r.type === 'profile_meta').forEach(r => {
          try {
            const parsed = JSON.parse(r.photo_file_id || '{}');
            const codeFromRow = String(r.student_code || parsed.access_code || '').trim().toUpperCase();
            const cleanCode = (codeFromRow && codeFromRow !== 'N/A') ? codeFromRow : '';
            if (cleanCode && !parsed.access_code) parsed.access_code = cleanCode;
            if (r.student_id) metaMap.set(String(r.student_id), parsed);
            if (cleanCode) metaMap.set(cleanCode, parsed);
            profileMetaRecords.push({
              report: r,
              meta: parsed,
              code: cleanCode,
              student_id: r.student_id
            });
          } catch (e) {}
        });

        const existingMap = new Map();
        (appData.students || []).forEach(s => {
          if (s.id) existingMap.set(String(s.id), s);
          if (s.access_code) existingMap.set(String(s.access_code).toUpperCase(), s);
        });

        const combinedCandidates = [...users];

        // Единый источник истины — строго данные из Supabase (users + student_reports)

        const deduplicatedUsers = [];
        const seenKeys = new Set();
        for (let i = combinedCandidates.length - 1; i >= 0; i--) {
          const u = combinedCandidates[i];
          const parsedInfo = parseUsernameAndCode(u.username, u.access_code);
          const metaForU = metaMap.get(String(u.id)) || (parsedInfo.access_code ? metaMap.get(parsedInfo.access_code) : null);
          const key = (parsedInfo.access_code || (metaForU && metaForU.access_code ? String(metaForU.access_code).toUpperCase() : String(u.id))).toUpperCase();
          if (!key || seenKeys.has(key)) continue;
          seenKeys.add(key);
          deduplicatedUsers.unshift(u);
        }

        const usedCodes = new Set();
        const freshStudents = [];

        deduplicatedUsers.forEach(u => {
          const parsedInfo = parseUsernameAndCode(u.username, u.access_code);
          const meta = metaMap.get(String(u.id)) || (parsedInfo.access_code ? metaMap.get(parsedInfo.access_code) : null) || {};
          const prevSt = existingMap.get(String(u.id)) || (parsedInfo.access_code ? existingMap.get(parsedInfo.access_code) : null) || null;

          const userFullName = meta.full_name || `${u.first_name || ''} ${u.last_name || ''}`.trim() || prevSt?.full_name || 'Атлет';
          const userSub = subsMap.get(u.id);
          const userBks = bksMap.get(u.id) || [];

          const metaSub = meta.subscription || null;
          const hasMetaTotal = metaSub && (metaSub.total !== undefined || metaSub.total_sessions !== undefined);
          const metaTotalVal = hasMetaTotal ? Number(metaSub.total ?? metaSub.total_sessions ?? 0) : NaN;
          const subTotalVal = userSub ? Number(userSub.total_sessions ?? 0) : NaN;
          const total = Math.max(0, (!isNaN(metaTotalVal) && (metaTotalVal > 0 || !subTotalVal))
            ? metaTotalVal
            : (!isNaN(subTotalVal) ? subTotalVal : (Number(prevSt?.subscription?.total ?? 0) || 0)));

          let remaining = Number(metaSub?.remaining ?? prevSt?.subscription?.remaining);
          if (isNaN(remaining)) {
            const usedVal = Number(userSub?.used_sessions ?? metaSub?.used ?? metaSub?.used_sessions ?? prevSt?.subscription?.used ?? 0);
            remaining = Math.max(0, total - usedVal);
          }
          if (remaining < 0) remaining = 0;
          if (total > 0 && remaining > total) remaining = total;

          const used = Math.max(0, total - remaining);
          const dur = Number(meta?.session_duration ?? userSub?.session_duration_minutes ?? prevSt?.session_duration) || 60;
          const billDay = Math.min(28, Math.max(1, Number(metaSub?.payment_day ?? metaSub?.billing_day ?? userSub?.billing_day ?? prevSt?.subscription?.payment_day) || 1));

          const rawSum = metaSub?.robokassa_sum ?? userSub?.robokassa_sum ?? prevSt?.subscription?.robokassa_sum ?? '0 ₽';
          const cleanSumStr = typeof rawSum === 'number'
            ? formatRublesFromNumber(rawSum)
            : (String(rawSum).includes('₽') ? String(rawSum) : formatRublesFromNumber(parseNumericRubles(rawSum)));
          const cleanUrlStr = metaSub?.robokassa_url ?? userSub?.robokassa_url ?? prevSt?.subscription?.robokassa_url ?? '';

          let code = parsedInfo.access_code || meta.access_code || prevSt?.access_code || '';
          if (!code || usedCodes.has(code)) {
            let num = 104;
            while (usedCodes.has(`STEP-${num}`)) num++;
            code = `STEP-${num}`;
          }
          usedCodes.add(code);

          const tgUsername = parsedInfo.telegram_username || u.telegram_username || meta.telegram_username || prevSt?.telegram_username || '';
          const parts = userFullName.split(/\s+/);
          const initials = ((parts[0] ? parts[0][0] : 'А') + (parts[1] ? parts[1][0] : 'Т')).toUpperCase();

          const mappedBookings = userBks.map(b => {
            const bDur = Number(b.duration_minutes) || dur;
            const dateStr = b.session_date;
            const timeStr = b.session_time;
            if (appData.schedule_slots && appData.schedule_slots[dateStr]) {
              const daySlots = appData.schedule_slots[dateStr];
              const startIdx = daySlots.findIndex(s => s.time === timeStr);
              const hoursNeeded = Math.ceil(bDur / 60);
              if (startIdx !== -1) {
                for (let k = 0; k < hoursNeeded; k++) {
                  if (daySlots[startIdx + k]) {
                    daySlots[startIdx + k].booked_by = u.id;
                  }
                }
              }
            }
            return {
              id: b.id,
              date: dateStr,
              time: timeStr,
              duration: bDur
            };
          }).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));

          const freezeDetails = u.freeze_details || meta.freeze_details || prevSt?.freeze_details || { is_frozen: false, from: '2026-11-01', to: '2026-11-15' };

          const resolvedPrice = Number(meta?.price ?? metaSub?.price ?? prevSt?.price ?? prevSt?.subscription?.price ?? parseNumericRubles(cleanSumStr)) || 0;
          freshStudents.push({
            id: u.id,
            supabase_id: u.id,
            telegram_id: u.telegram_id || null,
            access_code: code,
            telegram_username: tgUsername,
            full_name: userFullName,
            avatar: meta.avatar || prevSt?.avatar || initials,
            status: freezeDetails.is_frozen ? 'frozen' : 'active',
            freeze_details: freezeDetails,
            price: resolvedPrice,
            session_duration: dur,
            subscription: {
              id: userSub?.id || meta?.subscription?.id || prevSt?.subscription?.id || null,
              price: resolvedPrice,
              total: total,
              total_sessions: total,
              used: used,
              used_sessions: used,
              remaining: remaining,
              payment_day: billDay,
              billing_day: billDay,
              robokassa_sum: cleanSumStr,
              robokassa_url: cleanUrlStr
            },
            payment_history: Array.isArray(meta.payment_history) ? meta.payment_history : (Array.isArray(prevSt?.payment_history) ? prevSt.payment_history : []),
            medical_notes: u.medical_notes ?? meta.medical_notes ?? prevSt?.medical_notes ?? '',
            trainer_private_notes: u.trainer_private_notes ?? meta.trainer_private_notes ?? prevSt?.trainer_private_notes ?? '',
            notification_settings: u.notification_settings || meta.notification_settings || prevSt?.notification_settings || { workout_reminder: '2h', sunday_checkup: true, monthly_inbody_photos: true },
            workouts: Array.isArray(u.workouts) ? u.workouts : (Array.isArray(meta.workouts) ? meta.workouts : (Array.isArray(prevSt?.workouts) ? prevSt.workouts : [])),
            anthropometry: (Array.isArray(u.anthropometry) ? u.anthropometry : (Array.isArray(meta.anthropometry) ? meta.anthropometry : (Array.isArray(prevSt?.anthropometry) ? prevSt.anthropometry : []))).map(normalizeAnthropometryRecord),
            checkups: Array.isArray(u.checkups) ? u.checkups : (Array.isArray(meta.checkups) ? meta.checkups : (Array.isArray(prevSt?.checkups) ? prevSt.checkups : [])),
            inbody: (Array.isArray(u.inbody) ? u.inbody : (Array.isArray(meta.inbody) ? meta.inbody : (Array.isArray(prevSt?.inbody) ? prevSt.inbody : []))).map(enrichInBodyRecord),
            photo_reports: Array.isArray(u.photo_reports) && u.photo_reports.length > 0
              ? u.photo_reports
              : (Array.isArray(meta.photo_reports) && meta.photo_reports.length > 0
                  ? meta.photo_reports
                  : (Array.isArray(prevSt?.photo_reports) ? prevSt.photo_reports : [])),
            active_bookings: mappedBookings
          });
        });

        appData.students = freshStudents;
        migrateLoadedData();
        saveAppData();
        await autoProcessCompletedBookings();
        const savedCode = (typeof localStorage !== 'undefined' ? (localStorage.getItem('sv_access_code') || '') : '').trim().toUpperCase();
        const savedId = (typeof localStorage !== 'undefined' ? (localStorage.getItem('sv_student_id') || '') : '').trim();
        if (appData.current_role === 'student') {
          const matchedStudent = appData.students.find(s =>
            (savedCode && String(s.access_code || '').toUpperCase() === savedCode) ||
            (savedId && (String(s.id) === savedId || String(s.supabase_id) === savedId)) ||
            (appData.current_student_id && (String(s.id) === String(appData.current_student_id) || String(s.supabase_id) === String(appData.current_student_id)))
          );
          if (matchedStudent) {
            appData.current_student_id = matchedStudent.id;
            saveSessionToTelegramCloud('student', matchedStudent.id, matchedStudent.access_code);
          } else if (appData.students[0]) {
            appData.current_student_id = appData.students[0].id;
          }
        } else if (appData.current_student_id && !appData.students.some(s => String(s.id) === String(appData.current_student_id))) {
          const bySavedCode = savedCode ? appData.students.find(s => String(s.access_code || '').toUpperCase() === savedCode) : null;
          appData.current_student_id = bySavedCode ? bySavedCode.id : (appData.students[0] ? appData.students[0].id : null);
        }
        renderApp();
      } catch (err) {
        console.warn('Ошибка синхронизации студентов из Supabase:', err);
      }
    }

    async function getOrCreateSupabaseUser(role = 'student', options = {}) {
      const normalizedDbRole = (role === 'trainer' || role === 'coach') ? 'coach' : 'student';
      const preferredStudent = options.student || null;

      try {
        await waitForSupabaseClient();
        if (!supabaseClient) {
          throw new Error('Supabase SDK не инициализирован');
        }

        if (normalizedDbRole === 'coach') {
          await syncAllStudentsFromSupabase();
          return { user: currentUser, sub: null };
        }

        let user = null;
        if (preferredStudent && preferredStudent.id && !String(preferredStudent.id).startsWith('step-')) {
          const { data: byId } = await supabaseClient
            .from('users')
            .select('*')
            .eq('id', preferredStudent.id)
            .maybeSingle();
          if (byId) user = byId;
        }

        let resolvedProfileMeta = null;
        const codeUpper = (preferredStudent && preferredStudent.access_code)
          ? preferredStudent.access_code.trim().toUpperCase()
          : (options.accessCode ? String(options.accessCode).trim().toUpperCase() : '');

        if (!user && codeUpper) {
          const { data: byCodeList } = await supabaseClient
            .from('users')
            .select('*')
            .eq('role', 'student')
            .ilike('username', `${codeUpper}%`);
          if (Array.isArray(byCodeList) && byCodeList.length > 0) {
            user = byCodeList[byCodeList.length - 1];
          }
        }

        if (!user && codeUpper) {
          const { data: repByCode } = await supabaseClient
            .from('student_reports')
            .select('*')
            .eq('student_code', codeUpper)
            .eq('type', 'profile_meta')
            .order('id', { ascending: false })
            .limit(1);
          if (Array.isArray(repByCode) && repByCode.length > 0) {
            const rep = repByCode[0];
            try {
              resolvedProfileMeta = JSON.parse(rep.photo_file_id || '{}');
            } catch (e) {}
            if (rep.student_id) {
              const { data: byRepUserId } = await supabaseClient
                .from('users')
                .select('*')
                .eq('id', rep.student_id)
                .maybeSingle();
              if (byRepUserId) user = byRepUserId;
            }
          }
        }

        if (!user) {
          return { user: null, sub: null };
        }

        if (!resolvedProfileMeta) {
          const { data: metaRows } = await supabaseClient
            .from('student_reports')
            .select('*')
            .eq('student_id', user.id)
            .eq('type', 'profile_meta')
            .order('id', { ascending: false })
            .limit(1);
          if (Array.isArray(metaRows) && metaRows.length > 0) {
            try {
              resolvedProfileMeta = JSON.parse(metaRows[0].photo_file_id || '{}');
            } catch (e) {}
          }
        }

        const tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user;
        if (tgUser?.id && Number(user.telegram_id) !== Number(tgUser.id)) {
          await supabaseClient
            .from('users')
            .update({ telegram_id: Number(tgUser.id) })
            .eq('id', user.id);
          user.telegram_id = Number(tgUser.id);
        }

        let { data: subsList } = await supabaseClient
          .from('subscriptions')
          .select('*')
          .eq('student_id', user.id)
          .eq('status', 'active')
          .order('id', { ascending: false })
          .limit(1);

        let sub = (subsList && subsList.length > 0) ? subsList[0] : null;

        if (!sub) {
          try {
            const { data: newSub, error: subCreateErr } = await supabaseClient
              .from('subscriptions')
              .insert([{
                student_id: user.id,
                total_sessions: Number(resolvedProfileMeta?.subscription?.total ?? preferredStudent?.subscription?.total ?? 0) || 0,
                used_sessions: Number(resolvedProfileMeta?.subscription?.used ?? preferredStudent?.subscription?.used ?? 0) || 0,
                session_duration_minutes: Number(resolvedProfileMeta?.session_duration ?? preferredStudent?.session_duration) || 60,
                billing_day: Number(resolvedProfileMeta?.subscription?.payment_day ?? preferredStudent?.subscription?.payment_day) || 1,
                status: 'active'
              }])
              .select()
              .maybeSingle();

            if (!subCreateErr && newSub) sub = newSub;
          } catch (subInitErr) {
            console.warn('Предупреждение при инициализации subscriptions:', subInitErr);
          }
        }

        const { data: userBks } = await supabaseClient
          .from('bookings')
          .select('*')
          .eq('student_id', user.id)
          .eq('status', 'confirmed');

        currentUser = user;
        if (sub) currentSubscription = sub;

        syncSupabaseStateToLocalApp(user, sub, userBks || [], preferredStudent ? preferredStudent.id : user.id, resolvedProfileMeta);
        renderApp();

        return { user, sub };
      } catch (err) {
        console.error('Ошибка в getOrCreateSupabaseUser:', err);
        return { user: null, sub: null };
      }
    }

    const authenticateUser = getOrCreateSupabaseUser;

    async function bookSession(date, time) {
      try {
        await waitForSupabaseClient();
        if (!supabaseClient) {
          notifyUser('Ошибка связи с базой данных: клиент Supabase не загружен', 'error');
          return null;
        }

        const currentSt = typeof getCurrentStudent === 'function' ? getCurrentStudent() : null;
        let userId = (currentSt && (currentSt.supabase_id || currentSt.id)) || (currentUser && currentUser.id);

        if (!userId || String(userId).startsWith('step-')) {
          const authRes = await getOrCreateSupabaseUser('student', { autoEnter: true, student: currentSt });
          userId = authRes && authRes.user ? authRes.user.id : null;
        }

        if (!userId) {
          notifyUser('Не удалось определить профиль ученика в базе данных.', 'error');
          return null;
        }

        let { data: subsList, error: subError } = await supabaseClient
          .from('subscriptions')
          .select('*')
          .eq('student_id', userId)
          .eq('status', 'active')
          .order('id', { ascending: false })
          .limit(1);

        if (subError) throw subError;

        let sub = (subsList && subsList.length > 0) ? subsList[0] : null;

        if (!sub) {
          notifyUser('У вас пока нет активного пакета тренировок. Обратитесь к тренеру.', 'error');
          return null;
        }

        const totalSessions = Math.max(0, Number(sub.total_sessions) || 0);
        const usedSessions = Math.max(0, Number(sub.used_sessions) || 0);
        const remainingSessions = totalSessions - usedSessions;

        if (remainingSessions <= 0) {
          notifyUser('Закончились тренировки в абонементе! Обновите абонемент для записи.', 'error');
          return null;
        }

        const durationMinutes = Number(sub.session_duration_minutes) || (currentSt && currentSt.session_duration) || 60;

        const { data: insertedBookings, error: bookError } = await supabaseClient
          .from('bookings')
          .insert([{
            student_id: userId,
            session_date: date,
            session_time: time,
            duration_minutes: durationMinutes,
            status: 'confirmed'
          }])
          .select();

        if (bookError) throw bookError;
        const createdBooking = (insertedBookings && insertedBookings.length > 0) ? insertedBookings[0] : null;

        const newUsedSessions = usedSessions + 1;
        const { data: updatedSubs, error: updateError } = await supabaseClient
          .from('subscriptions')
          .update({ used_sessions: newUsedSessions })
          .eq('id', sub.id)
          .select();

        if (updateError) throw updateError;

        const updatedSub = (updatedSubs && updatedSubs.length > 0)
          ? updatedSubs[0]
          : { ...sub, used_sessions: newUsedSessions };

        currentSubscription = updatedSub;
        if (currentSt) {
          currentSt.subscription.used = newUsedSessions;
          currentSt.subscription.used_sessions = newUsedSessions;
          currentSt.subscription.remaining = Math.max(0, totalSessions - newUsedSessions);
          await persistStudentToSupabase(currentSt);
        }

        return {
          success: true,
          user: { id: userId },
          sub: updatedSub,
          booking: createdBooking || {
            id: 'bk-' + Date.now(),
            student_id: userId,
            session_date: date,
            session_time: time,
            duration_minutes: durationMinutes,
            status: 'confirmed'
          }
        };
      } catch (err) {
        console.error('Ошибка бронирования в Supabase:', err);
        notifyUser('Ошибка связи с базой данных: ' + (err.message || 'не удалось сохранить запись'), 'error');
        return null;
      }
    }

    function initTapToDismissKeyboard() {
      const isTextControl = (el) => {
        if (!el || !el.tagName) return false;
        const tag = el.tagName.toUpperCase();
        if (tag === 'TEXTAREA' || tag === 'SELECT') return true;
        if (tag === 'INPUT') {
          const type = (el.type || 'text').toLowerCase();
          return !['range', 'checkbox', 'radio', 'button', 'submit', 'file'].includes(type);
        }
        return false;
      };

      document.addEventListener('pointerdown', (e) => {
        const active = document.activeElement;
        if (active && isTextControl(active)) {
          if (!active.contains(e.target) && !isTextControl(e.target) && !e.target.closest('#modal-backdrop')) {
            active.blur();
          }
        }
      }, { passive: true });

      // touchmove не должен сбрасывать активный инпут, чтобы страница могла свободно скроллиться при вводе текста

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const active = document.activeElement;
          if (active && active.tagName && active.tagName.toUpperCase() === 'INPUT') {
            e.preventDefault();
            active.blur();
          }
        }
      });
    }

    function getTodayDateObj() {
      const now = new Date();
      return new Date(now.getFullYear(), now.getMonth(), now.getDate());
    }

    function formatISO(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function parseISO(isoStr) {
      const [y, m, d] = (isoStr || '2026-11-02').split('-').map(Number);
      return new Date(y, (m || 1) - 1, d || 1);
    }

    // П.7: Формат месяца полное название («Понедельник, 2 ноября»)
    function formatHumanDate(isoStr) {
      if (!isoStr) return '';
      const d = parseISO(isoStr);
      const dayName = RU_DAYS_FULL[d.getDay()];
      return `${dayName}, ${d.getDate()} ${RU_MONTHS_LONG[d.getMonth()]}`;
    }

    function formatShortRuDate(isoStr) {
      if (!isoStr) return '';
      const d = parseISO(isoStr);
      return `${d.getDate()} ${RU_MONTHS_SHORT[d.getMonth()]} ${d.getFullYear()}`;
    }

    function formatDotDate(isoStr) {
      if (!isoStr) return '';
      const [y, m, d] = isoStr.split('-');
      return `${d}.${m}.${y}`;
    }

    function getUpcomingDays(count = 10) {
      const base = getTodayDateObj();
      const list = [];
      for (let i = 0; i < count; i++) {

        d.setDate(base.getDate() + i);
        list.push({

          dayNum: d.getDate(),
          monthShort: RU_MONTHS_SHORT[d.getMonth()],
          isToday: i === 0

      return list;
    }

    function compressImageToBlobAndDataUrl(fileOrBlob, maxDim = 1280, quality = 0.75) {
      return new Promise((resolve, reject) => {
        if (!fileOrBlob || !(fileOrBlob instanceof Blob)) {
          reject(new Error('Некорректный файл изображения'));
          return;
        }
        const objectUrl = URL.createObjectURL(fileOrBlob);
        const img = new Image();
        img.onload = () => {
          URL.revokeObjectURL(objectUrl);
          let width = img.width || 1280;
          let height = img.height || 1280;
          if (width > maxDim || height > maxDim) {
            if (width >= height) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            } else {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          const dataUrl = canvas.toDataURL('image/jpeg', quality);
          canvas.toBlob((blob) => {
            if (blob) {
              resolve({ blob, dataUrl });
            } else {
              reject(new Error('Не удалось сжать изображение в JPEG Blob'));
            }
          }, 'image/jpeg', quality);
        };
        img.onerror = (err) => {
          URL.revokeObjectURL(objectUrl);
          reject(err);
        };
        img.src = objectUrl;
      });
    }

    async function compressVideoFile(file, onStatusText = null) {
      const THRESHOLD_BYTES = 45 * 1024 * 1024;
      if (!file || file.size <= THRESHOLD_BYTES) {
        return file;
      }

      if (typeof MediaRecorder === 'undefined') {
        return file;
      }

      if (typeof showToast === 'function') {
        showToast('Видео > 45 МБ: перекодируем...', 'info');
      }
      if (typeof onStatusText === 'function') {
        onStatusText('Сжатие 720p...');
      }

      return new Promise((resolve, reject) => {
        const videoUrl = URL.createObjectURL(file);
        const video = document.createElement('video');
        video.src = videoUrl;
        video.muted = true;
        video.playsInline = true;
        video.preload = 'auto';

        const cleanup = () => {
          try {
            video.pause();
            video.removeAttribute('src');
            video.load();
          } catch (e) {}
          URL.revokeObjectURL(videoUrl);
        };

        video.onerror = () => {
          cleanup();
          reject(new Error('Не удалось декодировать исходное видео для сжатия'));
        };

        video.onloadedmetadata = async () => {
          try {
            const srcW = video.videoWidth || 1280;
            const srcH = video.videoHeight || 720;
            const isPortrait = srcH > srcW;
            const maxLong = 960;
            const maxShort = 540;
            const curLong = isPortrait ? srcH : srcW;
            const curShort = isPortrait ? srcW : srcH;
            const scale = Math.min(1, maxLong / curLong, maxShort / curShort);

            const targetW = Math.max(2, Math.floor((srcW * scale) / 2) * 2);
            const targetH = Math.max(2, Math.floor((srcH * scale) / 2) * 2);

            const canvas = document.createElement('canvas');
            canvas.width = targetW;
            canvas.height = targetH;
            const ctx = canvas.getContext('2d');

            const FPS = 30;
            const stream = canvas.captureStream(FPS);

            try {
              const vidStream = video.captureStream ? video.captureStream() : (video.mozCaptureStream ? video.mozCaptureStream() : null);
              if (vidStream && vidStream.getAudioTracks().length > 0) {
                vidStream.getAudioTracks().forEach(track => stream.addTrack(track));
              }
            } catch (audioErr) {}

            const candidateMimeTypes = [
              'video/mp4;codecs=avc1',
              'video/mp4',
              'video/webm;codecs=vp9,opus',
              'video/webm;codecs=vp8,opus',
              'video/webm'
            ];
            let selectedMime = '';
            for (const mime of candidateMimeTypes) {
              if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(mime)) {
                selectedMime = mime;
                break;
              }
            }

            const recorderOptions = {
              videoBitsPerSecond: 950000
            };
            if (selectedMime) {
              recorderOptions.mimeType = selectedMime;
            }

            const chunks = [];
            const recorder = new MediaRecorder(stream, recorderOptions);

            recorder.ondataavailable = (ev) => {
              if (ev.data && ev.data.size > 0) {
                chunks.push(ev.data);
              }
            };

            recorder.onerror = (ev) => {
              cleanup();
              reject(ev.error || new Error('Ошибка перекодирования видео MediaRecorder'));
            };

            recorder.onstop = () => {
              cleanup();
              const outType = selectedMime || 'video/webm';
              const ext = outType.includes('mp4') ? 'mp4' : 'webm';
              const compressedBlob = new Blob(chunks, { type: outType });
              const outFile = new File([compressedBlob], `workout_720p.${ext}`, { type: outType });
              resolve(outFile);
            };

            let animId = null;
            const renderFrame = () => {
              if (!video.paused && !video.ended) {
                ctx.drawImage(video, 0, 0, targetW, targetH);
                if (typeof onStatusText === 'function' && video.duration > 0) {
                  const pct = Math.min(99, Math.round((video.currentTime / video.duration) * 100));
                  onStatusText(`Сжатие ${pct}%`);
                }
                animId = requestAnimationFrame(renderFrame);
              }
            };

            video.onended = () => {
              if (animId) cancelAnimationFrame(animId);
              if (recorder.state === 'recording') {
                recorder.stop();
              }
            };

            recorder.start(250);
            await video.play();
            video.playbackRate = 2.0;
            renderFrame();
          } catch (err) {
            cleanup();
            reject(err);
          }
        };
      });
    }

    async function autoProcessCompletedBookings() {
      const todayIso = formatISO(getTodayDateObj());
      const expiredBookingIds = [];
      let changed = false;

      (appData.students || []).forEach(st => {
        if (!Array.isArray(st.active_bookings)) st.active_bookings = [];
        const remainingBookings = [];
        st.active_bookings.forEach(bk => {
          if (bk.date && bk.date < todayIso) {
            releaseBookingEntryFromSchedule(st, bk);
            if (bk.id && !String(bk.id).startsWith('bk-')) {
              expiredBookingIds.push(bk.id);
            }
            changed = true;
          } else {
            remainingBookings.push(bk);
          }
        });
        st.active_bookings = remainingBookings;
      });

      ensureSupabaseClient();
      if (supabaseClient) {
        try {
          if (expiredBookingIds.length > 0) {
            await supabaseClient
              .from('bookings')
              .update({ status: 'completed' })
              .in('id', expiredBookingIds);
          }
          await supabaseClient
            .from('bookings')
            .update({ status: 'completed' })
            .lt('session_date', todayIso)
            .eq('status', 'confirmed');
        } catch (err) {
          console.warn('Не удалось архивировать прошедшие бронирования в Supabase:', err);
        }
      }

      if (changed) {
        await persistScheduleSlotsToSupabase();
        saveAppData();
      }
    }

    // П.2: Персональный пул упражнений ТЕКУЩЕГО подопечного, отсортированный по частоте выполнения
    function getStudentPersonalExercisePool(student) {
      if (!student || !Array.isArray(student.workouts)) return [];
      const freqMap = new Map();
      student.workouts.forEach(w => {
        (w.exercises || []).forEach(ex => {
          const name = (ex.name || '').trim();
          if (name) {
            freqMap.set(name, (freqMap.get(name) || 0) + 1);
          }
        });
      });
      return Array.from(freqMap.entries())
        .sort((a, b) => b[1] - a[1])
        .map(entry => entry[0]);
    }

          sessionStorage.setItem('sv_access_code', String(accessCode || ''));

      }
      try {
        const cs = window.Telegram?.WebApp?.CloudStorage;
        if (cs && typeof cs.setItem === 'function') {
          cs.setItem('sv_role', String(role || ''), () => {});
          cs.setItem('sv_student_id', String(studentId || ''), () => {});
          cs.setItem('sv_access_code', String(accessCode || ''), () => {});

    async function restoreSessionFromTelegram() {
      try {
        let sessionCandidate = null;
        try {
          if (typeof localStorage !== 'undefined') {
            const lsRole = localStorage.getItem('sv_role');
            const lsStudentId = localStorage.getItem('sv_student_id');
            const lsAccessCode = localStorage.getItem('sv_access_code');
            if (lsRole === 'trainer' || lsRole === 'student') {
              sessionCandidate = {
                sv_role: lsRole,
                sv_student_id: lsStudentId || '',
                sv_access_code: (lsAccessCode || '').trim().toUpperCase()
              };
              if (lsRole === 'trainer') {
                appData.current_role = 'trainer';
              } else if (lsRole === 'student') {
                appData.current_role = 'student';
                appData.current_student_id = sessionCandidate.sv_student_id || sessionCandidate.sv_access_code || null;
              }
            }
          }
        } catch (lsReadErr) {}

        if (!sessionCandidate) {
          try {
            if (typeof sessionStorage !== 'undefined') {
              const ssRole = sessionStorage.getItem('sv_role');
              const ssStudentId = sessionStorage.getItem('sv_student_id');
              const ssAccessCode = sessionStorage.getItem('sv_access_code');
              if (ssRole === 'trainer' || ssRole === 'student') {
                sessionCandidate = {
                  sv_role: ssRole,
                  sv_student_id: ssStudentId || '',
                  sv_access_code: (ssAccessCode || '').trim().toUpperCase()
                };
              }
            }
          } catch (ssReadErr) {}
        }

        const cs = window.Telegram?.WebApp?.CloudStorage;
        if (!sessionCandidate && cs && typeof cs.getItems === 'function') {
          const stored = await new Promise(resolve => {
            let settled = false;
            const timer = setTimeout(() => {
              if (!settled) {
                settled = true;
                resolve(null);
              }
            }, 250);
            try {
              cs.getItems(['sv_role', 'sv_student_id', 'sv_access_code'], (err, values) => {
                if (!settled) {
                  settled = true;
                  clearTimeout(timer);
                  resolve(err ? null : (values || null));
                }
              });
            } catch (e) {
              if (!settled) {
                settled = true;
                clearTimeout(timer);
                resolve(null);
              }
            }
          });
          if (stored && stored.sv_role) {
            sessionCandidate = stored;
          }
        }

        if (sessionCandidate && sessionCandidate.sv_role) {
          if (sessionCandidate.sv_role === 'trainer') {
            appData.current_role = 'trainer';
            saveSessionToTelegramCloud('trainer', '', '');
            return true;
          }
          if (sessionCandidate.sv_role === 'student') {
            const targetCode = String(sessionCandidate.sv_access_code || '').trim().toUpperCase();
            const targetId = String(sessionCandidate.sv_student_id || '').trim();
            appData.current_role = 'student';
            appData.current_student_id = targetId || targetCode || null;
            saveSessionToTelegramCloud('student', targetId, targetCode);
            return true;
          }
        }

        const tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user;
        if (tgUser) {
          const tgUsername = String(tgUser.username || '').trim().replace(/^@/, '').toLowerCase();
          const trainerUsername = String(appData?.trainer_profile?.telegram_username || '').trim().replace(/^@/, '').toLowerCase();
          if (tgUsername && trainerUsername && tgUsername === trainerUsername) {
            appData.current_role = 'trainer';
            saveSessionToTelegramCloud('trainer', '', '');
            return true;
          }

          const matchedStudent = (appData.students || []).find(s =>
            (tgUser.id && Number(s.telegram_id) === Number(tgUser.id)) ||
            (tgUsername && String(s.telegram_username || '').trim().replace(/^@/, '').toLowerCase() === tgUsername)
          );
          if (matchedStudent) {
            appData.current_role = 'student';
            appData.current_student_id = matchedStudent.id;
            saveSessionToTelegramCloud('student', matchedStudent.id, matchedStudent.access_code);
            getOrCreateSupabaseUser('student', { autoEnter: true, student: matchedStudent }).catch(e => console.warn(e));
            return true;
          }
        }
      } catch (err) {
        console.warn('Не удалось автоматически восстановить сессию:', err);
      }
      return false;
    }

    // П.4: Фильтрация прошедших часов на сегодня + часовой буфер (lead time)
    function computeFittableSlotsForStudent(isoDate, durationMinutes) {
      const daySlots = (appData.schedule_slots && appData.schedule_slots[isoDate]) || [];
      const hoursNeeded = Math.ceil(durationMinutes / 60);
      const availableStarts = [];

      const todayIso = formatISO(getTodayDateObj());
      const isToday = isoDate === todayIso;
      const nowHour = new Date().getHours();
      const minAllowedHourToday = nowHour + 1; // slotHour <= nowHour отсекается + 1 час lead time буфер => строго slotHour > nowHour + 1 (или >= nowHour + 2)

      for (let i = 0; i <= daySlots.length - hoursNeeded; i++) {
        const startHour = parseInt(daySlots[i].time.split(':')[0], 10);
        if (isToday && startHour <= minAllowedHourToday) {
          continue;
        }
        let fitsAll = true;
        for (let k = 0; k < hoursNeeded; k++) {
          const s = daySlots[i + k];
          if (!s || !s.is_open || s.booked_by !== null) {
            fitsAll = false;
            break;
          }
        }
        if (fitsAll) {
          const endTotalMins = startHour * 60 + durationMinutes;
          const endH = String(Math.floor(endTotalMins / 60)).padStart(2, '0');
          const endM = String(endTotalMins % 60).padStart(2, '0');
          availableStarts.push({
            startTime: daySlots[i].time,
            endTime: `${endH}:${endM}`,
            duration: durationMinutes,
            hoursSpan: hoursNeeded
          });
        }
      }
      return availableStarts;
    }

    // П.5: Освобождение конкретного слота из массива active_bookings
    function releaseBookingEntryFromSchedule(student, bookingObj) {
      if (!student || !bookingObj) return;
      const { date, time, duration } = bookingObj;
      const daySlots = appData.schedule_slots[date];
      const hoursNeeded = Math.ceil((Number(duration) || Number(student.session_duration) || 60) / 60);
      if (daySlots) {
        const startIdx = daySlots.findIndex(s => s.time === time);
        if (startIdx !== -1) {
          for (let k = 0; k < hoursNeeded; k++) {
            const slot = daySlots[startIdx + k];
            if (slot && (String(slot.booked_by) === String(student.id) || (student.supabase_id && String(slot.booked_by) === String(student.supabase_id)))) {
              slot.booked_by = null;
              if (slot.baseline_closed) {
                slot.is_open = false;
              }
            }
          }
        } else {
          daySlots.forEach(s => {
            if (String(s.booked_by) === String(student.id) || (student.supabase_id && String(s.booked_by) === String(student.supabase_id))) {
              s.booked_by = null;
              if (s.baseline_closed) {
                s.is_open = false;
              }
            }
          });
        }
      }
    }

    let isBookingInProgress = false;

    async function bookStudentSlot(isoDate, startTime) {
      if (isBookingInProgress) return;

      const student = getCurrentStudent();
      if (!student) return;
      if (!Array.isArray(student.active_bookings)) student.active_bookings = [];

      if (student.freeze_details && student.freeze_details.is_frozen) {
        showToast('Ваш абонемент на паузе (Заморозка). Отключите паузу в Профиле для записи.', 'error');
        return;
      }

      const daySlots = appData.schedule_slots[isoDate] || [];
      const startIndex = daySlots.findIndex(s => s.time === startTime);
      if (startIndex === -1) {
        showToast('Выбранный слот не найден в расписании.', 'error');
        return;
      }

      const reschedulingId = uiState.reschedulingBookingId;
      const existingToReschedule = reschedulingId
        ? student.active_bookings.find(b => b.id === reschedulingId)
        : null;

      isBookingInProgress = true;
      try {
        if (existingToReschedule) {
          // ==================== РЕЖИМ ПЕРЕНОСА (Баланс НЕ списывается!) ====================
          const sessionDuration = existingToReschedule.duration || student.session_duration || 120;

          // 1. Освобождаем старый слот в локальной сетке
          releaseBookingEntryFromSchedule(student, existingToReschedule);

          // 2. Занимаем новый слот в локальной сетке
          const hoursNeeded = Math.ceil(sessionDuration / 60);
          const targetDaySlots = appData.schedule_slots[isoDate] || [];
          const targetStartIndex = targetDaySlots.findIndex(s => s.time === startTime);
          if (targetStartIndex !== -1) {
            for (let k = 0; k < hoursNeeded; k++) {
              if (targetDaySlots[targetStartIndex + k]) {
                targetDaySlots[targetStartIndex + k].booked_by = student.id;
              }
            }
          }

          // 3. Обновляем саму запись в массиве активных броней
          existingToReschedule.date = isoDate;
          existingToReschedule.time = startTime;
          existingToReschedule.duration = sessionDuration;

          student.active_bookings.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
          uiState.reschedulingBookingId = null;

          // 4. Синхронизируем изменение в Supabase (БЕЗ списания used_sessions!)
          try {
            ensureSupabaseClient();
            if (supabaseClient) {
              const targetStudentId = student.supabase_id || student.id || (currentUser && currentUser.id);

              if (existingToReschedule.id && !String(existingToReschedule.id).startsWith('bk-')) {
                await supabaseClient
                  .from('bookings')
                  .update({
                    session_date: isoDate,
                    session_time: startTime,
                    duration_minutes: sessionDuration,
                    status: 'confirmed'
                  })
                  .eq('id', existingToReschedule.id);
              } else if (targetStudentId) {
                const { data: newBk } = await supabaseClient
                  .from('bookings')
                  .insert([{
                    student_id: targetStudentId,
                    session_date: isoDate,
                    session_time: startTime,
                    duration_minutes: sessionDuration,
                    status: 'confirmed'
                  }])
                  .select();
                if (newBk && newBk.length > 0) {
                  existingToReschedule.id = newBk[0].id;
                }
              }
            }
          } catch (err) {
            console.warn('Ошибка синхронизации переноса с Supabase:', err);
          }

          await Promise.all([
            persistScheduleSlotsToSupabase(),
            persistStudentToSupabase(student)
          ]);
          saveAppData();
          triggerHaptic('success');
          showToast(`Запись перенесена на ${formatHumanDate(isoDate)} в ${startTime}. Баланс сохранён: ${student.subscription.remaining} из ${student.subscription.total}!`);
          renderApp();
          return;
        }

        // ==================== НОВОЕ БРОНИРОВАНИЕ (Списание занятия) ====================
        if (student.subscription && student.subscription.remaining <= 0) {
          showToast('Закончились тренировки в абонементе! Обновите абонемент для записи.', 'error');
          return;
        }

        const result = await bookSession(isoDate, startTime);
        if (!result || !result.success) {
          return;
        }

        const activeStudent = getCurrentStudent() || student;
        if (!Array.isArray(activeStudent.active_bookings)) activeStudent.active_bookings = [];

        // Обновляем локальное состояние абонемента строго по ответу Supabase
        const sub = result.sub;
        const total = Math.max(0, Number(sub.total_sessions ?? activeStudent.subscription?.total ?? 0) || 0);
        const used = Math.max(0, Number(sub.used_sessions) || 0);
        const remaining = Math.max(0, total - used);
        const sessionDuration = Number(sub.session_duration_minutes) || activeStudent.session_duration || 60;

        activeStudent.session_duration = sessionDuration;
        activeStudent.subscription.id = sub.id;
        activeStudent.subscription.total = total;
        activeStudent.subscription.used = used;
        activeStudent.subscription.remaining = remaining;
        if (sub.billing_day) {
          activeStudent.subscription.payment_day = Number(sub.billing_day);
        }

        // Помечаем часы в локальной сетке расписания
        const hoursNeeded = Math.ceil(sessionDuration / 60);
        const targetDaySlots = appData.schedule_slots[isoDate] || [];
        const targetStartIndex = targetDaySlots.findIndex(s => s.time === startTime);
        if (targetStartIndex !== -1) {
          for (let k = 0; k < hoursNeeded; k++) {
            if (targetDaySlots[targetStartIndex + k]) {
              targetDaySlots[targetStartIndex + k].booked_by = activeStudent.id;
            }
          }
        }

        activeStudent.active_bookings.push({
          id: (result.booking && result.booking.id) ? result.booking.id : ('bk-' + Date.now() + '-' + Math.random().toString(36).slice(2, 5)),
          date: isoDate,
          time: startTime,
          duration: sessionDuration
        });

        activeStudent.active_bookings.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));

        await persistStudentToSupabase(activeStudent);
        await persistScheduleSlotsToSupabase();
        saveAppData();
        triggerHaptic('success');
        showToast(`Тренировка забронирована на ${formatHumanDate(isoDate)} в ${startTime}! Остаток: ${remaining} из ${total}`);
        renderApp();
      } finally {
        isBookingInProgress = false;
      }
    }

    async function cancelStudentBookingById(bookingId) {
  const student = getCurrentStudent();
  if (!student || !Array.isArray(student.active_bookings)) return;
  const target = student.active_bookings.find(b => b.id === bookingId);
  if (!target) return;

  // 1. Возвращаем слот в локальное расписание тренера
  releaseBookingEntryFromSchedule(student, target);
  student.active_bookings = student.active_bookings.filter(b => b.id !== bookingId);
  if (uiState.reschedulingBookingId === bookingId) {
    uiState.reschedulingBookingId = null;
  }

  // 2. ВОЗВРАЩАЕМ ЗАНЯТИЕ НА БАЛАНС В UI
  if (student.subscription) {
    const total = Math.max(0, Number(student.subscription.total) || 0);
    const used = Math.max(0, (Number(student.subscription.used) || 0) - 1);
    student.subscription.used = used;
    student.subscription.used_sessions = used;
    student.subscription.remaining = Math.max(0, total - used);
  }

  // 3. Синхронизируем возврат с Supabase
  try {
    ensureSupabaseClient();
    if (supabaseClient) {
      if (bookingId && !String(bookingId).startsWith('bk-')) {
        await supabaseClient
          .from('bookings')
          .delete()
          .eq('id', bookingId);
      } else {
        const targetNumericId = toValidNumericIdOrNull(student.supabase_id || student.id);
        if (targetNumericId) {
          await supabaseClient
            .from('bookings')
            .delete()
            .eq('student_id', targetNumericId)
            .eq('session_date', target.date)
            .eq('session_time', target.time);
        }
      }

      await persistStudentToSupabase(student);
      await persistScheduleSlotsToSupabase();
    }
  } catch (err) {
    console.warn("Ошибка синхронизации отмены с Supabase:", err);
  }

  saveAppData();
  triggerHaptic('warning');
  showToast('Тренировка отменена. Занятие возвращено на баланс!');
  renderApp();
}

    function syncDraftWorkoutFromDOM() {
      if (!uiState.draftWorkout) return;
      const titleEl = document.getElementById('workout-title-input');
      const commentEl = document.getElementById('workout-student-comment');
      if (titleEl) uiState.draftWorkout.title = titleEl.value;
      if (commentEl) uiState.draftWorkout.student_comment = commentEl.value;

      uiState.draftWorkout.exercises.forEach((ex, idx) => {
        const nEl = document.getElementById(`ex-name-${idx}`);
        const sEl = document.getElementById(`ex-sets-${idx}`);
        const rEl = document.getElementById(`ex-reps-${idx}`);
        const wEl = document.getElementById(`ex-weight-${idx}`);
        const vEl = document.getElementById(`ex-video-${idx}`);
        if (nEl) ex.name = nEl.value;
        if (sEl) ex.sets = Number(sEl.value) || 4;
        if (rEl) {
          const rawR = String(rEl.value || '').replace(',', '.').trim();
          ex.reps = rawR === '' ? '' : (Number(rawR) || 0);
        }
        if (wEl) {
          const rawW = String(wEl.value || '').replace(',', '.').trim();
          ex.weight = rawW === '' ? '' : (parseFloat(rawW) || 0);

    let exerciseUploadChain = Promise.resolve();

async function handleExerciseVideoUpload(event, idx) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;

  syncDraftWorkoutFromDOM();

  const d = uiState.draftWorkout;
  if (!d || !d.exercises || !d.exercises[idx]) return;

  // Сразу помечаем элемент как стоящий в очереди
  d.exercises[idx].is_uploading = true;
  d.exercises[idx].upload_status = 'В очереди...';
  renderApp();

  // Добавляем обработку в строгую очередь: второе видео ждёт окончания первого
  exerciseUploadChain = exerciseUploadChain.then(async () => {
    try {
      if (!d.exercises[idx]) return;

      d.exercises[idx].upload_status = file.size > 45 * 1024 * 1024 ? 'Сжатие 720p...' : 'Загрузка...';
      renderApp();

      const processedFile = await compressVideoFile(file, (txt) => {
        if (d.exercises[idx]) {
          d.exercises[idx].upload_status = txt;
          const lbl = document.getElementById(`ex-video-status-${idx}`);
          if (lbl) lbl.innerText = txt;
        }
      });

      if (d.exercises[idx]) {
        d.exercises[idx].upload_status = 'Отправка...';
        const lbl = document.getElementById(`ex-video-status-${idx}`);
        if (lbl) lbl.innerText = 'Отправка...';
      }

      const student = (typeof getCurrentStudent === 'function') ? getCurrentStudent() : null;
      const exName = d.exercises[idx].name || 'Упражнение';
      const caption = `🏋️ Подход: ${exName}\nУченик: ${student ? (student.full_name || student.name || '—') : '—'}`;

      // Отправка с повторной попыткой при разрыве мобильного интернета
      let uploadRes = null;
      let lastErr = null;
      for (let attempt = 1; attempt <= 2; attempt++) {
        try {
          uploadRes = await uploadVideoMediaToTelegram(processedFile, caption);
          if (uploadRes && uploadRes.video_url) break;
        } catch (e) {
          lastErr = e;
          if (attempt === 1) {
            await new Promise(r => setTimeout(r, 1500));
          }
        }
      }

      if (!uploadRes || !uploadRes.video_url) {
        throw lastErr || new Error('Не удалось загрузить видео');
      }

      d.exercises[idx].video_url = uploadRes.video_url;
      d.exercises[idx].video_file_id = uploadRes.file_id;
      if (typeof showToast === 'function') showToast('Видео подхода сохранено');

    } catch (err) {
      console.error('Ошибка загрузки видео:', err);
      const msg = err && err.message ? err.message : 'Ошибка сети при загрузке';
      if (typeof showToast === 'function') showToast(msg, 'error');
    } finally {
      if (d.exercises[idx]) {
        delete d.exercises[idx].is_uploading;
        delete d.exercises[idx].upload_status;
      }
      renderApp();
    }
  }).catch((err) => {
    console.error('Критический сбой в очереди видео:', err);
    if (d.exercises[idx]) {
      delete d.exercises[idx].is_uploading;
      delete d.exercises[idx].upload_status;
    }
    renderApp();
  });
}

    async function saveStudentWorkout() {
      syncDraftWorkoutFromDOM();
      const draft = uiState.draftWorkout;
      if (!draft) return;

      const title = (draft.title || '').trim() || 'Силовая тренировка';
      const validExercises = draft.exercises
        .filter(e => (e.name || '').trim() !== '')
        .map(e => {
          const cleanWeight = parseFloat(String(e.weight ?? '0').replace(',', '.')) || 0;
          const cleanReps = parseInt(String(e.reps ?? '0').replace(',', '.'), 10) || 0;
          return {
            name: e.name.trim(),
            sets: Math.min(8, Math.max(1, Number(e.sets) || 4)),
            reps: cleanReps,
            weight: cleanWeight,
            video_url: (e.video_url || '').trim(),
            video_file_id: e.video_file_id || null
          };
        });

      if (validExercises.length === 0) {
        showToast('Заполните хотя бы одно упражнение', 'error');
        return;
      }

      const student = getCurrentStudent();
      if (!student) return;
      if (!Array.isArray(student.workouts)) student.workouts = [];

      const savedObj = {
        id: draft.id,
        date: draft.date,
        title: title,
        student_comment: (draft.student_comment || '').trim(),
        trainer_comment: draft.trainer_comment || '',
        exercises: validExercises
      };

      const existingIdx = student.workouts.findIndex(w => w.id === draft.id);
      if (existingIdx >= 0) {
        student.workouts[existingIdx] = savedObj;
      } else {
        student.workouts.push(savedObj);
      }

      await persistStudentToSupabase(student);
      refreshStudentExercisesDatalist();
      uiState.workoutEditorOpen = false;
      uiState.editingWorkoutId = null;
      uiState.draftWorkout = null;
      triggerHaptic('success');
      showToast('Тренировка сохранена в облаке! Новые упражнения добавлены в ваш пул подсказок.');
      renderApp();
    }

    async function saveNewInBodyRecord() {
      const student = getCurrentStudent();
      if (!student) return;
      if (!Array.isArray(student.inbody)) student.inbody = [];

      const readFloat = (id) => {
        const el = document.getElementById(id);
        return el ? (parseFloat(String(el.value || '0').replace(',', '.')) || 0) : 0;
      };
      const readInt = (id) => {
        const el = document.getElementById(id);
        return el ? (parseInt(String(el.value || '0').replace(',', '.'), 10) || 0) : 0;
      };

      const record = enrichInBodyRecord({
        date: formatDotDate(formatISO(getTodayDateObj())),
        weight: readFloat('inbody-weight'),
        muscle_mass: readFloat('inbody-muscle'),
        body_fat_pct: readFloat('inbody-fat'),
        water: readFloat('inbody-water'),
        protein: readFloat('inbody-protein'),
        minerals: readFloat('inbody-minerals'),
        visceral_fat: readInt('inbody-visceral'),
        bmi: readFloat('inbody-bmi'),
        fat_free_mass: readFloat('inbody-ffm'),
        bmr: readInt('inbody-bmr'),
        optimal_weight: readFloat('inbody-opt-weight'),
        calorie_norm: readInt('inbody-cal-norm'),
        seg_left_arm: readFloat('inbody-seg-la'),
        seg_right_arm: readFloat('inbody-seg-ra'),
        seg_torso: readFloat('inbody-seg-tr'),
        seg_left_leg: readFloat('inbody-seg-ll'),
        seg_right_leg: readFloat('inbody-seg-rl')
      });

      student.inbody.push(record);
      await persistStudentToSupabase(student);
      closeModal();
      triggerHaptic('success');
      showToast('Полный скан DDX InBody сохранён в базе!');
      renderApp();
    }

    async function compressImageFileToDataUrl(file, maxDim = 1280, quality = 0.75) {
      const res = await compressImageToBlobAndDataUrl(file, maxDim, quality);
      return res.dataUrl;
    }

    function getCurrentMonthYearLabel() {
      const d = getTodayDateObj();
      const monthsNom = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
      return `${monthsNom[d.getMonth()]} ${d.getFullYear()}`;
    }

    function createDefaultPhotoReportSlice(label) {
      const sliceLabel = label || getCurrentMonthYearLabel();
      return {
        date: sliceLabel,
        front_url: createSilhouetteDataUri(sliceLabel, 'СПЕРЕДИ', 10, 0, '#00E676'),
        side_url: createSilhouetteDataUri(sliceLabel, 'СБОКУ', 10, 0, '#00E676'),
        back_url: createSilhouetteDataUri(sliceLabel, 'СЗАДИ', 10, 0, '#00E676'),
        front_custom: false,
        side_custom: false,
        back_custom: false
      };
    }

    async function handlePhotoFileChange(event) {
      const file = event.target.files && event.target.files[0];
      if (!file || !uiState.pendingPhotoSlotKey) return;
      try {
        const { blob: compressedBlob, dataUrl: compressedDataUrl } = await compressImageToBlobAndDataUrl(file, 1280, 0.75);
        const student = getCurrentStudent();
        if (!student) return;
        if (!Array.isArray(student.photo_reports) || student.photo_reports.length === 0) {
          student.photo_reports = [createDefaultPhotoReportSlice()];
        }
        const latestReport = student.photo_reports[student.photo_reports.length - 1];

        const key = uiState.pendingPhotoSlotKey;
        const customFlagKey = key.replace('_url', '_custom');
        const fileIdKey = key.replace('_url', '_file_id');
        latestReport[key] = compressedDataUrl;
        latestReport[customFlagKey] = true;

        let shortFileId = `photo_${key}_${Date.now()}`;
        let tgMsgId = 0;
        try {
          const caption = `📌 Фотоотчёт: ${student.full_name || 'Подопечный'} (${student.access_code || 'N/A'}) — ${uiState.pendingPhotoSlotTitle || key}`;
          const tgRes = await uploadMediaToTelegram(compressedBlob, caption);
          if (tgRes && tgRes.file_id) {
            shortFileId = tgRes.file_id;
            tgMsgId = Number(tgRes.message_id) || 0;
          }
        } catch (tgUploadErr) {
          console.warn('Fallback отправки фото в Telegram (сохраняем короткий file_id в Supabase):', tgUploadErr);
        }

        latestReport[fileIdKey] = shortFileId;

        ensureSupabaseClient();
        if (supabaseClient) {
          try {
            const safeNumericStudentId = toValidNumericIdOrNull(student.supabase_id || student.id);
            await supabaseClient
              .from('student_reports')
              .insert([{
                student_id: safeNumericStudentId,
                student_code: student.access_code || 'N/A',
                type: 'weekly_photo',
                photo_file_id: shortFileId,
                telegram_msg_id: tgMsgId,
                created_at: new Date().toISOString()
              }]);
          } catch (repErr) {
            console.warn('Не удалось записать weekly_photo в student_reports:', repErr);
          }
        }

        await persistStudentToSupabase(student);
        triggerHaptic('success');
        showToast(`Фото «${uiState.pendingPhotoSlotTitle}» сжато (JPEG 0.75) и сохранено в облаке!`);
        renderApp();
      } catch (err) {
        showToast('Не удалось обработать изображение', 'error');
      }
    }

    async function deleteStudentPhotoSlot(angleKey, angleTitle) {
      triggerHaptic('warning');
      const student = getCurrentStudent();
      if (!student || !Array.isArray(student.photo_reports) || student.photo_reports.length === 0) return;
      const latestReport = student.photo_reports[student.photo_reports.length - 1];
      const customFlagKey = angleKey.replace('_url', '_custom');
      const fileIdKey = angleKey.replace('_url', '_file_id');
      const oldFileId = latestReport[fileIdKey] || null;

      latestReport[angleKey] = createSilhouetteDataUri(latestReport.date, angleTitle.toUpperCase(), 10, 0, '#00E676');
      latestReport[customFlagKey] = false;
      latestReport[fileIdKey] = '';

      ensureSupabaseClient();
      if (supabaseClient) {
        try {
          let delQuery = supabaseClient
            .from('student_reports')
            .delete()
            .eq('type', 'weekly_photo');

          if (oldFileId) {
            delQuery = delQuery.eq('photo_file_id', oldFileId);
          } else if (student.access_code) {
            delQuery = delQuery.eq('student_code', student.access_code);
          } else {
            const safeId = toValidNumericIdOrNull(student.supabase_id || student.id);
            if (safeId) delQuery = delQuery.eq('student_id', safeId);
          }
          await delQuery;
        } catch (delErr) {
          console.warn('Не удалось удалить запись weekly_photo из student_reports:', delErr);
        }
      }

      await persistStudentToSupabase(student);
      showToast(`Фото «${angleTitle}» удалено, восстановлен базовый силуэт`);
      renderApp();
    }

    function updatePhotoCompareControl(field, val) {

        const rightCut = 100 - uiState.photoCompareSliderVal;

    async function submitWeeklyCheckup() {
      const student = getCurrentStudent();
      if (!student) return;
      if (!Array.isArray(student.checkups)) student.checkups = [];

      const wEl = document.getElementById('chk-weight');
      const dEl = document.getElementById('chk-workouts');
      const gEl = document.getElementById('chk-growth');
      const sEl = document.getElementById('chk-sleep');
      const aEl = document.getElementById('chk-appetite');
      const dtEl = document.getElementById('chk-diet');
      const dgEl = document.getElementById('chk-digestion');
      const cEl = document.getElementById('checkup-comment');

      const parsedWeight = wEl ? parseFloat(String(wEl.value || '0').replace(',', '.')) : NaN;
      const parsedWorkouts = dEl ? parseInt(dEl.value, 10) : NaN;
      const record = {
        date: formatDotDate(formatISO(getTodayDateObj())),
        fasting_weight: !isNaN(parsedWeight) ? parsedWeight : 0,
        workouts_done: !isNaN(parsedWorkouts) ? parsedWorkouts : 0,
        weights_growth: (gEl && gEl.value.trim()) ? gEl.value.trim() : '',
        sleep: sEl && !isNaN(parseInt(sEl.value, 10)) ? parseInt(sEl.value, 10) : 8,
        appetite: aEl && !isNaN(parseInt(aEl.value, 10)) ? parseInt(aEl.value, 10) : 9,
        diet: dtEl && !isNaN(parseInt(dtEl.value, 10)) ? parseInt(dtEl.value, 10) : 9,
        digestion: dgEl && !isNaN(parseInt(dgEl.value, 10)) ? parseInt(dgEl.value, 10) : 8,
        comment: (cEl && cEl.value.trim()) ? cEl.value.trim() : ''
      };

      student.checkups.push(record);
      await persistStudentToSupabase(student);
      triggerHaptic('success');
      showToast('Еженедельный чек-ап сохранён и отправлен тренеру!');
      renderApp();
    }

      if (!st) return;
      if (!st.subscription) st.subscription = {};

      const packEl = document.getElementById('tr-mgmt-total-pack');
      const dayEl = document.getElementById('tr-mgmt-payment-day');
      const tgEl = document.getElementById('tr-mgmt-tg-username');
      const sumEl = document.getElementById('tr-mgmt-robokassa-sum');
      const urlEl = document.getElementById('tr-mgmt-robokassa-url');
      const notesEl = document.getElementById('tr-mgmt-private-notes');

      if (packEl) {
    const rawPack = packEl.value.trim();
    const newTotal = rawPack === '' ? 0 : Math.max(0, parseInt(rawPack, 10) || 0);
    st.subscription.total = newTotal;
    st.subscription.total_sessions = newTotal;

    // Если remaining уже есть в объекте, держим его в пределах нового пакета
    let currentRem = Number(st.subscription.remaining ?? (newTotal - Number(st.subscription.used_sessions ?? st.subscription.used ?? 0)));
    if (isNaN(currentRem)) currentRem = 0;
    if (newTotal > 0 && currentRem > newTotal) currentRem = newTotal;

    st.subscription.remaining = currentRem;
    st.subscription.used = Math.max(0, newTotal - currentRem);
    st.subscription.used_sessions = Math.max(0, newTotal - currentRem);
  }
      if (dayEl && dayEl.value !== '') {
        const newDay = Math.min(28, Math.max(1, parseInt(dayEl.value, 10) || 1));
        st.subscription.payment_day = newDay;

      }
      if (tgEl) {
        st.telegram_username = tgEl.value.trim().replace(/^@/, '');
      }
      if (sumEl) {
        const rawSumStr = sumEl.value.trim();
        const rawNum = rawSumStr === '' ? 0 : Math.max(0, parseInt(rawSumStr, 10) || 0);
        st.subscription.robokassa_sum = formatRublesFromNumber(rawNum);

    async function updateStudentPaymentDay(studentIdOrDayVal, maybeDayVal) {
      const targetStudent = maybeDayVal !== undefined
        ? getStudentById(studentIdOrDayVal)
        : getCurrentStudent();
      if (!targetStudent) return;

      const rawDay = maybeDayVal !== undefined ? maybeDayVal : studentIdOrDayVal;
      const newDay = Math.min(28, Math.max(1, Number(rawDay) || 1));
      if (!targetStudent.subscription) targetStudent.subscription = {};
      targetStudent.subscription.payment_day = newDay;
      targetStudent.subscription.billing_day = newDay;

      const selectEl = document.getElementById('tr-mgmt-payment-day');
      if (selectEl) selectEl.value = String(newDay);
      const badgeEl = document.getElementById('tr-mgmt-payment-day-badge');
      if (badgeEl) badgeEl.textContent = `${newDay}-е число`;

      const targetUserId = targetStudent.supabase_id || targetStudent.id;
      ensureSupabaseClient();
      if (supabaseClient && targetUserId && !String(targetUserId).startsWith('step-')) {
        try {
          if (targetStudent.subscription.id) {
            await supabaseClient
              .from('subscriptions')
              .update({ billing_day: Number(newDay) || 1 })
              .eq('id', targetStudent.subscription.id);
          } else {
            await supabaseClient
              .from('subscriptions')
              .update({ billing_day: Number(newDay) || 1 })
              .eq('student_id', targetUserId)
              .eq('status', 'active');
          }
        } catch (err) {
          console.warn('Ошибка точечного обновления billing_day в subscriptions:', err);
        }
      }

      await persistStudentToSupabase(targetStudent);
      triggerHaptic('light');
      showToast(`День выставления счёта сохранён в базе: ${newDay}-е число месяца`);
    }

    let draftGeneratorSlots = [];
