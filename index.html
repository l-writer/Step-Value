     * 1. TELEGRAM WEBAPP SDK & HAPTIC FEEDBACK INITIALIZATION
     *************************************************************************/
    const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;

    function initTelegramSDK() {
      if (!tg) return;
      try {
        tg.ready();
        tg.expand();
        if (typeof tg.setHeaderColor === 'function') tg.setHeaderColor('#090C10');
        if (typeof tg.setBackgroundColor === 'function') tg.setBackgroundColor('#090C10');
      } catch (err) {
        console.warn('Telegram WebApp SDK init fallback:', err);
      }
    }

    function triggerHaptic(style = 'light') {
      try {
        if (tg && tg.HapticFeedback) {
          if (style === 'success' || style === 'warning' || style === 'error') {
            tg.HapticFeedback.notificationOccurred(style);
          } else {
            tg.HapticFeedback.impactOccurred(style);
          }
        }
      } catch (e) {}
    }

    /*************************************************************************
     * 3. DATE HELPERS & 10-DAY DYNAMIC SCHEDULE BUILDER
     *************************************************************************/
    const RU_DAYS_SHORT = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
    const RU_DAYS_FULL = ['Воскресенье', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];
    const RU_MONTHS_SHORT = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];

    function getTodayDateObj() {
      // Base reference date aligned with system metadata (Oct 2026) or live browser date
      const now = new Date();
      return new Date(now.getFullYear(), now.getMonth(), now.getDate());
    }

    function formatISO(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function parseISO(isoStr) {
      const [y, m, d] = (isoStr || '2026-10-27').split('-').map(Number);
      return new Date(y, (m || 1) - 1, d || 1);
    }

    function formatHumanDate(isoStr) {
      if (!isoStr) return '';
      const d = parseISO(isoStr);
      const dayName = RU_DAYS_FULL[d.getDay()];
      return `${dayName}, ${d.getDate()} ${RU_MONTHS_SHORT[d.getMonth()]}`;
    }

    function formatShortRuDate(isoStr) {
      if (!isoStr) return '';
      const d = parseISO(isoStr);
      return `${d.getDate()} ${RU_MONTHS_SHORT[d.getMonth()]} ${d.getFullYear()}`;
    }

    function formatDotDate(isoStr) {
      if (!isoStr) return '';
      const [y, m, d] = isoStr.split('-');
      return `${d}.${m}.${y}`;
    }

    function getUpcomingDays(count = 10) {
      const base = getTodayDateObj();
      const list = [];
      for (let i = 0; i < count; i++) {
        const d = new Date(base);
        d.setDate(base.getDate() + i);
        list.push({
          iso: formatISO(d),
          dayShort: RU_DAYS_SHORT[d.getDay()],
          dayNum: d.getDate(),
          monthShort: RU_MONTHS_SHORT[d.getMonth()],
          isToday: i === 0
        });
      }
      return list;
    }

    function buildDefaultHoursForDay(startH = 9, endH = 21, closedHours = [], bookingsMap = {}) {
      const slots = [];
      for (let h = startH; h < endH; h++) {
        const timeStr = `${String(h).padStart(2, '0')}:00`;
        const bookedBy = bookingsMap[timeStr] || null;
        const isOpen = bookedBy ? true : !closedHours.includes(h);
        slots.push({
          time: timeStr,
          duration: 60,
          is_open: isOpen,
          booked_by: bookedBy
        });
      }
      return slots;
    }

    // Active Chart.js references to cleanly destroy before re-creating
    const activeCharts = {};

    function destroyAllCharts() {
      Object.keys(activeCharts).forEach(key => {
        if (activeCharts[key] && typeof activeCharts[key].destroy === 'function') {
          try {
            activeCharts[key].destroy();
          } catch (e) {}
        }
        delete activeCharts[key];
      });
    }

    function loadAppData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          appData = JSON.parse(raw);
          // Ensure upcoming 10 days exist in schedule_slots
          const upcoming = getUpcomingDays(10);
          if (!appData.schedule_slots) appData.schedule_slots = {};
          upcoming.forEach(d => {
            if (!appData.schedule_slots[d.iso]) {
              appData.schedule_slots[d.iso] = buildDefaultHoursForDay(9, 21, [13], {});
            }
          });
          autoProcessCompletedBookings();
          return;
        }
      } catch (e) {
        console.warn('LocalStorage read error, using seed in-memory:', e);
      }
      appData = buildInitialSeedData();
      saveAppData();
    }

    function saveAppData() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
      } catch (e) {
        console.warn('LocalStorage write warning:', e);
      }
    }

    // Automatically deduct 1 session if active_booking date has already passed
    function autoProcessCompletedBookings() {
      const todayIso = formatISO(getTodayDateObj());
      let changed = false;
      (appData.students || []).forEach(st => {
        if (st.active_booking && st.active_booking.date < todayIso) {
          if (st.subscription && st.subscription.remaining > 0) {
            st.subscription.remaining = Math.max(0, st.subscription.remaining - 1);
          }
          st.active_booking = null;
          changed = true;
        }
      });
      if (changed) saveAppData();
    }

    function getCurrentStudent() {
      if (!appData || !appData.students) return null;
      return appData.students.find(s => s.id === appData.current_student_id) || appData.students[0];
    }

    function getStudentById(id) {
      if (!appData || !appData.students) return null;
      return appData.students.find(s => s.id === id) || null;
    }

    /*************************************************************************
     * 6. TOAST NOTIFICATIONS & MODAL SYSTEM (NO NATIVE ALERT/CONFIRM)
     *************************************************************************/
    function showToast(message, type = 'success') {
      triggerHaptic(type === 'error' ? 'error' : 'light');
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      const borderCol = type === 'error' ? 'border-red-500/70' : 'border-[#10B981]';
      const iconName = type === 'error' ? 'alert-triangle' : 'check-circle-2';
      const iconCol = type === 'error' ? 'text-red-400' : 'text-[#00E676]';
      toast.className = `pointer-events-auto bg-[#161B22]/95 backdrop-blur-md border ${borderCol} rounded-xl px-4 py-3 shadow-neon flex items-center gap-3 animate-fade`;
      toast.innerHTML = `
        <i data-lucide="${iconName}" class="w-5 h-5 ${iconCol} shrink-0"></i>
        <span class="text-xs font-medium text-white leading-snug flex-1">${message}</span>
      `;
      container.appendChild(toast);
      if (window.lucide) lucide.createIcons({ attrs: { class: 'w-5 h-5' } });
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.25s ease';
        setTimeout(() => toast.remove(), 260);
      }, 2800);
    }

    function openModal(htmlContent) {
      const backdrop = document.getElementById('modal-backdrop');

      backdrop.classList.remove('hidden');

    function computeFittableSlotsForStudent(isoDate, durationMinutes) {
      const daySlots = (appData.schedule_slots && appData.schedule_slots[isoDate]) || [];
      const hoursNeeded = Math.ceil(durationMinutes / 60); // 60m->1, 90m->2, 120m->2, 180m->3
      const availableStarts = [];

      for (let i = 0; i <= daySlots.length - hoursNeeded; i++) {
        let fitsAll = true;
        for (let k = 0; k < hoursNeeded; k++) {
          const s = daySlots[i + k];
          if (!s || !s.is_open || s.booked_by !== null) {
            fitsAll = false;
            break;
          }
        }
        if (fitsAll) {
          const startHour = parseInt(daySlots[i].time.split(':')[0], 10);
          const endTotalMins = startHour * 60 + durationMinutes;
          const endH = String(Math.floor(endTotalMins / 60)).padStart(2, '0');
          const endM = String(endTotalMins % 60).padStart(2, '0');
          availableStarts.push({
            startTime: daySlots[i].time,
            endTime: `${endH}:${endM}`,
            duration: durationMinutes,
            hoursSpan: hoursNeeded
          });
        }
      }
      return availableStarts;
    }

    function releaseStudentActiveBookingFromSchedule(student) {
      if (!student || !student.active_booking) return;
      const { date, time, duration } = student.active_booking;
      const daySlots = appData.schedule_slots[date];
      if (daySlots) {
        daySlots.forEach(s => {
          if (s.booked_by === student.id) {
            s.booked_by = null;
            s.is_open = true;
          }
        });
      }
      student.active_booking = null;
    }

    function bookStudentSlot(isoDate, startTime) {
      const student = getCurrentStudent();
      if (!student) return;
      if (student.freeze_details && student.freeze_details.is_frozen) {
        showToast('Ваш абонемент на паузе (Заморозка). Отключите паузу в Профиле для записи.', 'error');
        return;
      }
      if (student.subscription.remaining <= 0) {
        showToast('На балансе 0 тренировок. Обновите абонемент для записи.', 'error');
        return;
      }

      // If student already had an active booking, release those hours first (1-click reschedule)
      const hadPrevious = !!student.active_booking;
      if (hadPrevious) {
        releaseStudentActiveBookingFromSchedule(student);
      }

      const hoursNeeded = Math.ceil((student.session_duration || 60) / 60);
      const daySlots = appData.schedule_slots[isoDate] || [];
      const startIndex = daySlots.findIndex(s => s.time === startTime);
      if (startIndex === -1) return;

      for (let k = 0; k < hoursNeeded; k++) {
        if (daySlots[startIndex + k]) {
          daySlots[startIndex + k].booked_by = student.id;
        }
      }

      student.active_booking = {
        date: isoDate,
        time: startTime,
        duration: student.session_duration || 60
      };

      saveAppData();
      triggerHaptic('success');
      showToast(hadPrevious
        ? `Запись перенесена на ${formatHumanDate(isoDate)} в ${startTime}`
        : `Запись подтверждена: ${formatHumanDate(isoDate)} в ${startTime}`);
      renderApp();
    }

    function cancelStudentBooking() {
      const student = getCurrentStudent();
      if (!student || !student.active_booking) return;
      releaseStudentActiveBookingFromSchedule(student);
      saveAppData();
      triggerHaptic('warning');
      showToast('Тренировка отменена. Слот возвращён в расписание тренера.');

    function exportBookingToCalendar(mode = 'google') {
      const student = getCurrentStudent();
      if (!student || !student.active_booking) return;
      triggerHaptic('light');
      const { date, time, duration } = student.active_booking;
      const [y, m, d] = date.split('-').map(Number);
      const [hh, mm] = time.split(':').map(Number);
      const startDt = new Date(Date.UTC(y, m - 1, d, hh, mm, 0));
      const endDt = new Date(startDt.getTime() + duration * 60000);
      const fmtCal = (dt) => dt.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
      const title = encodeURIComponent(`Тренировка Step Value • Тренер ${appData.trainer_profile.full_name}`);
      const details = encodeURIComponent(`Персональная тренировка (${duration} мин). Подопечный: ${student.full_name}`);

      if (mode === 'google') {
        const gUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${fmtCal(startDt)}/${fmtCal(endDt)}&details=${details}`;
        window.open(gUrl, '_blank', 'noopener');
        showToast('Открыт Google Calendar для сохранения тренировки');
      } else {
        const icsContent = [
          'BEGIN:VCALENDAR',
          'VERSION:2.0',
          'PRODID:-//Step Value TMA//RU',
          'BEGIN:VEVENT',
          `DTSTART:${fmtCal(startDt)}`,
          `DTEND:${fmtCal(endDt)}`,
          `SUMMARY:Тренировка Step Value (${appData.trainer_profile.full_name})`,
          `DESCRIPTION:Длительность ${duration} мин. Тренер: ${appData.trainer_profile.full_name}`,
          'END:VEVENT',
          'END:VCALENDAR'
        ].join('\r\n');
        const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `step-value-${date}.ics`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        showToast('Файл .ics загружен для Apple Calendar');
      }
    }

      if (mins === 120) return '2 часа';
      if (mins === 180) return '3 часа';
      return `${mins} мин`;
    }

    function saveStudentWorkout() {
      syncDraftWorkoutFromDOM();
      const draft = uiState.draftWorkout;
      if (!draft) return;

      const title = (draft.title || '').trim() || 'Силовая тренировка';
      const validExercises = draft.exercises
        .filter(e => (e.name || '').trim() !== '')
        .map(e => ({
          name: e.name.trim(),
          sets: Number(e.sets) || 1,
          reps: Number(e.reps) || 1,
          weight: Number(e.weight) || 0,
          video_url: (e.video_url || '').trim()
        }));

      if (validExercises.length === 0) {
        showToast('Заполните хотя бы одно упражнение с рабочим весом', 'error');
        return;
      }

      const student = getCurrentStudent();
      const savedObj = {
        id: draft.id,
        date: draft.date,
        title: title,
        student_comment: (draft.student_comment || '').trim(),
        trainer_comment: draft.trainer_comment || '',
        exercises: validExercises
      };

      const existingIdx = student.workouts.findIndex(w => w.id === draft.id);
      if (existingIdx >= 0) {
        student.workouts[existingIdx] = savedObj;
      } else {
        student.workouts.push(savedObj);
      }

      // Automatically select first exercise for reports chart
      uiState.selectedExerciseForChart = validExercises[0].name;

      saveAppData();
      uiState.workoutEditorOpen = false;
      uiState.editingWorkoutId = null;
      uiState.draftWorkout = null;
      triggerHaptic('success');
      showToast('Тренировка сохранена! Данные переданы тренеру и в графики отчётов.');
      renderApp();
    }

      if (uiState.workoutEditorOpen && uiState.draftWorkout) {
        const d = uiState.draftWorkout;
        const chips = ['День груди', 'День спины', 'День ног', 'Тяжёлый верх', 'Руки / Плечи', 'Фулбоди'];

                <span>К списку тренировок</span>

            <!-- Workout Title + 1-Tap Chips -->
            <div class="bg-[#161B22] border border-[#30363D] rounded-2xl p-4 space-y-3">
              <label class="block text-xs font-bold uppercase tracking-wider text-[#8B949E]">Название тренировочного дня</label>
              <input id="workout-title-input" type="text" value="${d.title}" placeholder="Например: День груди" class="w-full bg-[#090C10] border border-[#30363D] focus:border-[#00E676] rounded-xl px-3.5 py-2.5 text-sm font-bold text-white outline-none" />
              <div class="flex flex-wrap gap-1.5">

                  </div>

                  <div class="grid grid-cols-4 gap-2 items-end">

                    <div>

                    <div>

              <span>Сохранить тренировку</span>

      const workoutsReversed = [...(student.workouts || [])].reverse();

      return `
        <div class="space-y-4 animate-fade">
          <button onclick="openWorkoutCreator()" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-[#10B981] to-[#00E676] text-[#090C10] font-extrabold text-sm uppercase tracking-wider shadow-neon flex items-center justify-center gap-2 active:scale-[0.99] transition">

          <div class="space-y-3">

              const totalTonnage = (w.exercises || []).reduce((acc, ex) => acc + (Number(ex.sets) * Number(ex.reps) * Number(ex.weight || 0)), 0);
              const videoCount = (w.exercises || []).filter(e => e.video_url).length;
              return `
                <div onclick="openWorkoutCreator('${w.id}')" class="bg-[#161B22] hover:bg-[#1F242C] border border-[#30363D] rounded-2xl p-4 space-y-3 cursor-pointer transition">
                  <div class="flex items-start justify-between gap-2">

                      <span class="text-[11px] font-semibold text-[#8B949E]">${w.date}</span>

                    <div class="text-right">
                      <span class="text-xs font-bold px-2.5 py-1 rounded-lg bg-[#0D1117] border border-[#30363D] text-[#00E676]">

                      <strong class="text-white">Заметка:</strong> ${w.student_comment}
                    </p>
                  ` : ''}

                  <div class="flex items-center justify-between pt-1">
                    ${w.trainer_comment ? `
                      <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-[#10B981]/15 border border-[#00E676]/50 text-[#00E676] text-xs font-bold">
                        <span>💬 Есть комментарий тренера</span>
                      </div>
                    ` : `
                      <span class="text-[11px] text-[#8B949E]">На проверке у тренера</span>
                    `}
                    ${videoCount > 0 ? `<span class="text-[11px] text-[#8B949E] flex items-center gap-1"><i data-lucide="video" class="w-3.5 h-3.5 text-[#10B981]"></i> ${videoCount} видео</span>` : ''}
                  </div>

                  ${w.trainer_comment ? `
                    <div class="bg-[#0D1117] border-l-2 border-[#00E676] rounded-r-xl p-3 text-xs text-white">
                      <div class="text-[10px] font-bold uppercase text-[#00E676] mb-0.5">Разбор тренера (${appData.trainer_profile.full_name}):</div>
                      ${w.trainer_comment}
                    </div>
                  ` : ''}
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    // --- STUDENT TAB 3: REPORTS (5 ANALYTICS HUB MODULES) ---
    function openStudentReportSubscreen(sub) {
      triggerHaptic('light');
      uiState.studentReportSubscreen = sub;
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function changeSelectedExerciseChart(exName) {
      triggerHaptic('light');
      uiState.selectedExerciseForChart = exName;
      renderApp();
    }

    function submitInBodyScanModal() {
      openModal(`
        <div class="space-y-3.5">

            <div>
              <label class="block text-[11px] text-[#8B949E] mb-1">Мышцы (кг)</label>
              <input id="inbody-muscle" type="number" step="0.1" value="38.9" class="w-full bg-[#090C10] border border-[#30363D] rounded-xl px-3 py-2 text-xs font-bold text-white" />

            <div>
              <label class="block text-[11px] text-[#8B949E] mb-1">Жир (%)</label>

              <label class="block text-[11px] text-[#8B949E] mb-1">Вода (л)</label>

            </div>
            <div>
              <label class="block text-[11px] text-[#8B949E] mb-1">Общий вес (кг)</label>
              <input id="inbody-weight" type="number" step="0.1" value="81.2" class="w-full bg-[#090C10] border border-[#30363D] rounded-xl px-3 py-2 text-xs font-bold text-white" />

          </div>
          <div class="p-3 rounded-xl bg-[#0D1117] border border-dashed border-[#10B981]/50 text-center">
            <label class="cursor-pointer text-xs text-[#00E676] font-semibold flex items-center justify-center gap-1.5">
              <i data-lucide="upload-cloud" class="w-4 h-4"></i>
              <span>Прикрепить фото чека DDX InBody (опционально)</span>
              <input type="file" accept="image/*" class="hidden" onchange="showToast('Чек InBody распознан и прикреплён')" />
            </label>
          </div>
          <button onclick="saveNewInBodyRecord()" class="w-full py-3 rounded-xl bg-gradient-to-r from-[#10B981] to-[#00E676] text-[#090C10] font-extrabold text-xs uppercase">Сохранить срез InBody</button>
        </div>
      `);

    function saveNewInBodyRecord() {
      const student = getCurrentStudent();
      const m = parseFloat(document.getElementById('inbody-muscle').value) || 38.5;
      const f = parseFloat(document.getElementById('inbody-fat').value) || 14.0;
      const w = parseFloat(document.getElementById('inbody-water').value) || 49.5;
      const wt = parseFloat(document.getElementById('inbody-weight').value) || 81.5;
      student.inbody.push({
        date: formatDotDate(formatISO(getTodayDateObj())),
        muscle_mass: m,
        body_fat_pct: f,
        water: w,
        weight: wt
      });
      saveAppData();
      closeModal();
      triggerHaptic('success');
      showToast('Скан InBody добавлен! Графики обновлены.');
      renderApp();
    }

    function uploadStudentPhotoSlot(angleKey, angleTitle) {
      const student = getCurrentStudent();
      const latestReport = student.photo_reports[student.photo_reports.length - 1];
      if (!latestReport) return;
      latestReport[angleKey] = createSilhouetteDataUri('Новое фото • ' + formatShortRuDate(formatISO(getTodayDateObj())), angleTitle, 13, -1, '#00E676');
      saveAppData();
      triggerHaptic('success');
      showToast(`Ракурс «${angleTitle}» обновлён и синхронизирован с тренером`);
      renderApp();
    }

    function addNewMonthlyPhotoSlice() {
      const student = getCurrentStudent();
      const label = 'Ноябрь 2026';
      student.photo_reports.push({
        date: label,
        front_url: createSilhouetteDataUri(label, 'СПЕРЕДИ', 14, -2, '#00E676'),
        side_url: createSilhouetteDataUri(label, 'СБОКУ', 12, -1, '#00E676'),
        back_url: createSilhouetteDataUri(label, 'СЗАДИ', 15, -2, '#00E676')
      });
      uiState.photoCompareIdxA = 0;
      uiState.photoCompareIdxB = student.photo_reports.length - 1;
      saveAppData();
      triggerHaptic('success');
      showToast('Новый ежемесячный фотоотчёт (3 ракурса) сохранён!');
      renderApp();
    }

    function updatePhotoCompareControl(field, val) {
      if (field === 'slider') {
        uiState.photoCompareSliderVal = Number(val);
        const overlay = document.getElementById('before-after-clip');
        const handle = document.getElementById('before-after-handle');
        if (overlay) overlay.style.width = `${uiState.photoCompareSliderVal}%`;
        if (handle) handle.style.left = `${uiState.photoCompareSliderVal}%`;
        return;
      }
      if (field === 'idxA') uiState.photoCompareIdxA = Number(val);
      if (field === 'idxB') uiState.photoCompareIdxB = Number(val);
      if (field === 'angle') uiState.photoCompareAngle = val;
      renderApp();
    }

    function submitWeeklyCheckup() {
      const student = getCurrentStudent();
      const wEl = document.getElementById('chk-weight');
      const dEl = document.getElementById('chk-workouts');
      const gEl = document.getElementById('chk-growth');
      const sEl = document.getElementById('chk-sleep');
      const aEl = document.getElementById('chk-appetite');
      const dtEl = document.getElementById('chk-diet');
      const dgEl = document.getElementById('chk-digestion');

      const record = {
        date: formatDotDate(formatISO(getTodayDateObj())),
        fasting_weight: parseFloat(wEl ? wEl.value : 81.0) || 81.0,
        workouts_done: parseInt(dEl ? dEl.value : 4, 10) || 4,
        weights_growth: (gEl && gEl.value.trim()) ? gEl.value.trim() : 'Рабочие веса растут по плану',
        sleep: parseInt(sEl ? sEl.value : 8, 10),
        appetite: parseInt(aEl ? aEl.value : 9, 10),
        diet: parseInt(dtEl ? dtEl.value : 9, 10),
        digestion: parseInt(dgEl ? dgEl.value : 8, 10)
      };

      student.checkups.push(record);
      saveAppData();
      triggerHaptic('success');
      showToast('Воскресный чек-ап отправлен тренеру!');
      renderApp();
    }

    function renderStudentReportsTab() {
      const student = getCurrentStudent();
      const sub = uiState.studentReportSubscreen;

      // SUBSCREEN 1: WORKOUT CHARTS
      if (sub === 'workouts') {
        const allExercisesSet = new Set();
        (student.workouts || []).forEach(w => (w.exercises || []).forEach(e => allExercisesSet.add(e.name)));
        const exerciseNames = Array.from(allExercisesSet);
        if (exerciseNames.length > 0 && !exerciseNames.includes(uiState.selectedExerciseForChart)) {
          uiState.selectedExerciseForChart = exerciseNames[0];
        }

        return `
          <div class="space-y-4 animate-fade">
            <button onclick="openStudentReportSubscreen(null)" class="text-xs font-semibold text-[#8B949E] hover:text-white flex items-center gap-1.5 py-1.5 px-3 rounded-xl bg-[#161B22] border border-[#30363D]">

            <div class="bg-[#161B22] border border-[#30363D] rounded-2xl p-4 space-y-3">
              <div class="flex items-center justify-between">
                <h3 class="text-sm font-extrabold text-white">Суммарный тоннаж по тренировкам (кг)</h3>
                <span class="text-[11px] text-[#00E676] font-bold">Столбчатый график</span>
              </div>
              <div class="relative h-56 w-full pt-2">
                <canvas id="chart-workout-tonnage"></canvas>

              ${[

              ${checkups.map(c => `
                <div class="p-3 rounded-xl bg-[#0D1117] border border-[#30363D] space-y-1 text-xs">
                  <div class="flex justify-between">
                    <span class="font-bold text-white">${c.date}</span>
                    <span class="font-extrabold text-[#00E676]">Вес натощак: ${c.fasting_weight} кг • Трен: ${c.workouts_done}</span>

                  <p class="text-[#8B949E]">${c.weights_growth}</p>
                  <div class="text-[11px] text-[#8B949E] flex gap-3 pt-1">
                    <span>Сон: <b class="text-white">${c.sleep}/10</b></span>
                    <span>Аппетит: <b class="text-white">${c.appetite}/10</b></span>
                    <span>Рацион: <b class="text-white">${c.diet}/10</b></span>
                    <span>ЖКТ: <b class="text-white">${c.digestion}/10</b></span>
                  </div>

              `).join('')}
            </div>
          </div>
        `;
      }

      // MAIN 5-CARD ANALYTICS HUB
      const lastWorkout = (student.workouts || [])[student.workouts.length - 1];
      const topEx = lastWorkout && lastWorkout.exercises[0] ? lastWorkout.exercises[0] : { name: 'Жим лёжа', weight: 90 };
      const lastTonnage = lastWorkout
        ? ((lastWorkout.exercises || []).reduce((acc, e) => acc + e.sets * e.reps * e.weight, 0) / 1000).toFixed(1)
        : '14.2';
      const lastInbody = (student.inbody || [])[student.inbody.length - 1] || { muscle_mass: 38.4, body_fat_pct: 14.2 };
      const anthroList = student.anthropometry || [];
      const lastAnthro = anthroList[anthroList.length - 1] || { date: '24.10.2026', waist: 79 };
      const prevAnthro = anthroList.length > 1 ? anthroList[anthroList.length - 2] : lastAnthro;
      const waistDiff = +(lastAnthro.waist - prevAnthro.waist).toFixed(1);

          </button>

          <!-- 5. Еженедельный чек-ап -->
          <button onclick="openStudentReportSubscreen('checkup')" class="w-full text-left bg-[#161B22] hover:bg-[#1F242C] border border-[#30363D] hover:border-[#10B981] rounded-2xl p-4 flex items-center justify-between gap-3 transition group">

      const student = getCurrentStudent();
      student.subscription.payment_day = parseInt(dayVal, 10) || 5;

      triggerHaptic('light');
      showToast(`День выставления счёта изменён на ${student.subscription.payment_day}-е число каждого месяца`);

      const fromEl = document.getElementById('freeze-from');
      const toEl = document.getElementById('freeze-to');
      if (fromEl) student.freeze_details.from = fromEl.value;
      if (toEl) student.freeze_details.to = toEl.value;

      student.freeze_details.is_frozen = !student.freeze_details.is_frozen;
      student.status = student.freeze_details.is_frozen ? 'frozen' : 'active';
      saveAppData();
      triggerHaptic('success');
      showToast(student.freeze_details.is_frozen
        ? `Режим заморозки включён до ${formatDotDate(student.freeze_details.to)}`
        : 'Заморозка снята! Статус «Активен» восстановлен.');
      renderApp();
    }

    function updateFreezeDates() {
      const student = getCurrentStudent();
      const fromEl = document.getElementById('freeze-from');
      const toEl = document.getElementById('freeze-to');
      if (fromEl) student.freeze_details.from = fromEl.value;
      if (toEl) student.freeze_details.to = toEl.value;
      saveAppData();
      showToast('Даты отпуска/заморозки обновлены');
      renderApp();
    }

    function saveStudentMedicalNotes() {
      const student = getCurrentStudent();
      const el = document.getElementById('student-medical-notes');
      if (el) {
        student.medical_notes = el.value.trim();
        saveAppData();
        triggerHaptic('success');
        showToast('Медкарта и ограничения сохранены и видны тренеру');

                  ${fr.is_frozen ? `На паузе до ${formatDotDate(fr.to)}` : 'Статус: Активен'}

          <div class="bg-[#161B22] border border-[#30363D] rounded-2xl p-4 space-y-3">

            <textarea id="student-medical-notes" rows="3" placeholder="Травмы, ограничения по упражнениям (например: ноет плечо, не делать присед со свободным весом)" class="w-full bg-[#090C10] border border-[#30363D] focus:border-[#00E676] rounded-xl p-3 text-xs text-white outline-none resize-none">${student.medical_notes || ''}</textarea>
            <button onclick="saveStudentMedicalNotes()" class="w-full py-2.5 rounded-xl bg-[#1F242C] hover:bg-[#10B981] hover:text-[#090C10] border border-[#30363D] text-xs font-bold text-white transition">
              Сохранить медкарту
            </button>
          </div>

          <!-- 5. Smart Notifications in Telegram -->
          <div class="bg-[#161B22] border border-[#30363D] rounded-2xl p-4 space-y-3">
            <h3 class="text-xs font-bold uppercase tracking-wider text-[#8B949E]">Умные уведомления в Telegram</h3>

            <div class="flex items-center justify-between py-1">
              <span class="text-xs text-white">Напоминание о тренировке</span>
              <div class="flex gap-1.5">
                <button onclick="updateStudentNotificationSetting('workout_reminder', '2h')" class="px-2.5 py-1 rounded-lg text-xs font-bold border ${notif.workout_reminder === '2h' ? 'bg-[#10B981] text-[#090C10] border-[#00E676]' : 'bg-[#090C10] text-[#8B949E] border-[#30363D]'}">За 2 ч</button>
                <button onclick="updateStudentNotificationSetting('workout_reminder', '4h')" class="px-2.5 py-1 rounded-lg text-xs font-bold border ${notif.workout_reminder === '4h' ? 'bg-[#10B981] text-[#090C10] border-[#00E676]' : 'bg-[#090C10] text-[#8B949E] border-[#30363D]'}">За 4 ч</button>

                <div class="w-4 h-4 rounded-full transition transform ${notif.sunday_checkup ? 'translate-x-5 bg-[#090C10]' : 'translate-x-0 bg-[#8B949E]'}"></div>
              </button>
            </div>

            <div class="flex items-center justify-between py-1 border-t border-[#30363D]/60">
              <span class="text-xs text-white">InBody и фотоотчёт (за 3 дня до конца мес.)</span>
              <button onclick="updateStudentNotificationSetting('monthly_inbody_photos', ${!notif.monthly_inbody_photos})" class="w-11 h-6 rounded-full p-0.5 transition ${notif.monthly_inbody_photos ? 'bg-[#00E676]' : 'bg-[#090C10] border border-[#30363D]'} flex items-center">
                <div class="w-4 h-4 rounded-full transition transform ${notif.monthly_inbody_photos ? 'translate-x-5 bg-[#090C10]' : 'translate-x-0 bg-[#8B949E]'}"></div>

    /*************************************************************************
     * 9. TRAINER INTERFACE — 2 TABS (SCHEDULE & STUDENTS ADMIN)
     *************************************************************************/
    function setTrainerTab(tabName) {
      triggerHaptic('light');
      uiState.trainerTab = tabName;
      if (tabName === 'schedule') {
        uiState.selectedTrainerStudentId = null;
        uiState.trainerStudentSubscreen = null;
      }
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // --- TRAINER TAB 1: SCHEDULE & STRIKE-OUT GENERATOR ---
    function selectTrainerScheduleDate(iso) {
      triggerHaptic('light');
      uiState.selectedTrainerScheduleDate = iso;
      renderApp();
    }

    let draftGeneratorSlots = [];
    let draftGeneratorStartH = 9;
    let draftGeneratorEndH = 21;

    function openTrainerSlotGeneratorModal() {
      triggerHaptic('light');
      const iso = uiState.selectedTrainerScheduleDate;
      const existing = appData.schedule_slots[iso] || [];
      draftGeneratorStartH = 9;
      draftGeneratorEndH = 21;
      draftGeneratorSlots = [];

      for (let h = draftGeneratorStartH; h < draftGeneratorEndH; h++) {
        const t = `${String(h).padStart(2, '0')}:00`;
        const found = existing.find(s => s.time === t);
        draftGeneratorSlots.push({
          time: t,
          is_open: found ? found.is_open : true,
          booked_by: found ? found.booked_by : null
        });
      }
      renderTrainerSlotGeneratorModalContent();
    }

    function rebuildDraftGeneratorRange() {
      const sEl = document.getElementById('gen-start-hour');
      const eEl = document.getElementById('gen-end-hour');
      const startH = Math.max(6, Math.min(22, parseInt(sEl ? sEl.value : 9, 10) || 9));
      const endH = Math.max(startH + 1, Math.min(23, parseInt(eEl ? eEl.value : 21, 10) || 21));
      draftGeneratorStartH = startH;
      draftGeneratorEndH = endH;
      draftGeneratorSlots = [];
      for (let h = startH; h < endH; h++) {
        draftGeneratorSlots.push({
          time: `${String(h).padStart(2, '0')}:00`,
          is_open: true,
          booked_by: null
        });
      }
      renderTrainerSlotGeneratorModalContent();
    }

    function toggleDraftGeneratorSlot(idx) {
      triggerHaptic('light');
      const s = draftGeneratorSlots[idx];
      if (!s) return;
      if (s.booked_by) {
        showToast('Этот час уже забронирован учеником. Отмените бронь в списке дня при необходимости.', 'error');
        return;
      }
      s.is_open = !s.is_open;
      renderTrainerSlotGeneratorModalContent();
    }

    function applyTrainerGeneratedSchedule() {
      const iso = uiState.selectedTrainerScheduleDate;
      appData.schedule_slots[iso] = draftGeneratorSlots.map(s => ({
        time: s.time,
        duration: 60,
        is_open: s.is_open,
        booked_by: s.booked_by
      }));
      saveAppData();
      closeModal();
      triggerHaptic('success');
      showToast(`Расписание на ${formatHumanDate(iso)} опубликовано для учеников!`);
      renderApp();
    }

    function renderTrainerSlotGeneratorModalContent() {
      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <span class="text-[10px] font-bold uppercase text-[#00E676]">Метод вычёркивания</span>
              <h3 class="text-sm font-extrabold text-white">Настроить часы: ${formatHumanDate(uiState.selectedTrainerScheduleDate)}</h3>
            </div>
            <button onclick="closeModal()" class="text-[#8B949E] hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
          </div>

          <div class="grid grid-cols-2 gap-2.5 bg-[#0D1117] p-3 rounded-xl border border-[#30363D]">
            <div>
              <label class="block text-[10px] text-[#8B949E] mb-1">Начало дня (ч)</label>
              <input id="gen-start-hour" type="number" min="6" max="20" value="${draftGeneratorStartH}" onchange="rebuildDraftGeneratorRange()" class="w-full bg-[#161B22] border border-[#30363D] rounded-lg px-2.5 py-1.5 text-xs font-bold text-white" />
            </div>
            <div>
              <label class="block text-[10px] text-[#8B949E] mb-1">Конец дня (ч)</label>
              <input id="gen-end-hour" type="number" min="10" max="23" value="${draftGeneratorEndH}" onchange="rebuildDraftGeneratorRange()" class="w-full bg-[#161B22] border border-[#30363D] rounded-lg px-2.5 py-1.5 text-xs font-bold text-white" />
            </div>
          </div>

          <p class="text-[11px] text-[#8B949E]">
            По умолчанию все часы <span class="text-[#00E676] font-bold">зелёные (Свободно)</span>. Тапните по часам отдыха или перерыва — они погаснут:
          </p>

          <div class="grid grid-cols-3 gap-2">
            ${draftGeneratorSlots.map((s, idx) => `
              <button type="button" onclick="toggleDraftGeneratorSlot(${idx})" class="p-2.5 rounded-xl border text-center transition ${
                s.booked_by
                  ? 'bg-[#10B981]/30 border-[#00E676] text-white'
                  : s.is_open
                    ? 'bg-[#10B981]/15 border-[#00E676] text-[#00E676] shadow-neon'
                    : 'bg-[#090C10] border-[#30363D] text-[#8B949E] opacity-60 line-through'
              }">
                <div class="text-xs font-extrabold">${s.time}</div>
                <div class="text-[9px] uppercase mt-0.5">${s.booked_by ? 'Бронь' : (s.is_open ? 'Свободно' : 'Перерыв')}</div>
              </button>
            `).join('')}
          </div>

          <button onclick="applyTrainerGeneratedSchedule()" class="w-full py-3 rounded-xl bg-gradient-to-r from-[#10B981] to-[#00E676] text-[#090C10] font-extrabold text-xs uppercase tracking-wider shadow-neon">
            Применить расписание
          </button>
        </div>
      `);
    }

    function emergencyTrainerCancelBooking(isoDate, studentId) {
      const st = getStudentById(studentId);
      const daySlots = appData.schedule_slots[isoDate] || [];
      daySlots.forEach(s => {
        if (s.booked_by === studentId) {
          s.booked_by = null;
          s.is_open = true;
        }
      });
      if (st && st.active_booking && st.active_booking.date === isoDate) {
        st.active_booking = null;
      }
      saveAppData();
      triggerHaptic('warning');
      showToast(`Тренировка ${st ? st.full_name : ''} отменена. Окно свободно, пуш отправлен ученику в Telegram.`);
      renderApp();
    }

    function toggleSingleTrainerHourQuick(isoDate, timeStr) {
      triggerHaptic('light');
      const daySlots = appData.schedule_slots[isoDate] || [];
      const slot = daySlots.find(s => s.time === timeStr);
      if (!slot || slot.booked_by) return;
      slot.is_open = !slot.is_open;
      saveAppData();
      renderApp();
    }

    function renderTrainerScheduleTab() {
      const upcomingDays = getUpcomingDays(10);
      if (!upcomingDays.some(d => d.iso === uiState.selectedTrainerScheduleDate)) {
        uiState.selectedTrainerScheduleDate = upcomingDays[0].iso;
      }
      const iso = uiState.selectedTrainerScheduleDate;
      const daySlots = appData.schedule_slots[iso] || [];

      // Group consecutive hours booked by the same student for clean display
      const renderedRows = [];
      let i = 0;
      while (i < daySlots.length) {
        const s = daySlots[i];
        if (s.booked_by) {
          const st = getStudentById(s.booked_by);
          let span = 1;
          while (i + span < daySlots.length && daySlots[i + span].booked_by === s.booked_by) {
            span++;
          }
          const startH = parseInt(s.time.split(':')[0], 10);
          const durMins = st ? st.session_duration : span * 60;
          const endTotal = startH * 60 + durMins;
          const endStr = `${String(Math.floor(endTotal / 60)).padStart(2, '0')}:${String(endTotal % 60).padStart(2, '0')}`;
          renderedRows.push({
            type: 'booked',
            startTime: s.time,
            endTime: endStr,
            student: st,
            durationLabel: formatDurationLabel(durMins)
          });
          i += span;
        } else {
          renderedRows.push({
            type: 'slot',
            time: s.time,
            is_open: s.is_open
          });
          i++;
        }
      }

      return `
        <div class="space-y-4 animate-fade">
          <!-- Top Generator Button -->
          <button onclick="openTrainerSlotGeneratorModal()" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-[#10B981] to-[#00E676] text-[#090C10] font-extrabold text-xs uppercase tracking-wider shadow-neon flex items-center justify-center gap-2">
            <i data-lucide="sliders-horizontal" class="w-4 h-4 stroke-[2.5]"></i>
            <span>+ Настроить доступные часы (Метод вычёркивания)</span>
          </button>

          <!-- Day Scroller -->
          <div class="space-y-2">
            <div class="flex items-center justify-between">
              <span class="text-xs font-bold uppercase tracking-wider text-[#8B949E]">Рабочий календарь тренера</span>
              <span class="text-xs font-bold text-[#00E676]">${formatHumanDate(iso)}</span>
            </div>
            <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
              ${upcomingDays.map(d => {
                const isSelected = d.iso === iso;
                const slots = appData.schedule_slots[d.iso] || [];
                const hasBookings = slots.some(s => s.booked_by !== null);
                return `
                  <button onclick="selectTrainerScheduleDate('${d.iso}')" class="shrink-0 w-[62px] py-2.5 rounded-xl border ${isSelected ? 'bg-[#10B981] text-[#090C10] border-[#00E676] shadow-neon font-extrabold' : 'bg-[#161B22] text-white border-[#30363D]'} flex flex-col items-center justify-center transition">
                    <span class="text-[10px] uppercase ${isSelected ? 'text-[#090C10]/80 font-bold' : 'text-[#8B949E]'}">${d.isToday ? 'Сег' : d.dayShort}</span>
                    <span class="text-base font-extrabold my-0.5">${d.dayNum}</span>
                    <span class="text-[10px] ${isSelected ? 'text-[#090C10]/80' : 'text-[#8B949E]'}">${d.monthShort}</span>
                    ${hasBookings ? `<span class="w-1.5 h-1.5 rounded-full ${isSelected ? 'bg-[#090C10]' : 'bg-[#00E676]'} mt-1"></span>` : ''}
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          <!-- Hourly Schedule List -->
          <div class="bg-[#161B22] border border-[#30363D] rounded-2xl p-4 space-y-2.5">
            <div class="flex items-center justify-between mb-1">
              <h3 class="text-sm font-bold text-white">Почасовая сетка дня</h3>
              <span class="text-[11px] text-[#8B949E]">Тап по свободному слоту меняет статус</span>
            </div>

            ${renderedRows.map(row => {
              if (row.type === 'booked' && row.student) {
                return `
                  <div class="p-3.5 rounded-xl bg-[#0D1117] border-2 border-[#00E676] shadow-neon flex items-center justify-between gap-2">
                    <div class="space-y-0.5">
                      <div class="text-xs font-extrabold text-[#00E676]">
                        ${row.startTime} – ${row.endTime} • ${row.student.full_name} (${row.durationLabel})
                      </div>
                      <div class="text-[11px] text-[#8B949E]">
                        Остаток абонемента: ${row.student.subscription.remaining} из ${row.student.subscription.total}
                      </div>
                    </div>
                    <button onclick="emergencyTrainerCancelBooking('${iso}', '${row.student.id}')" class="px-2.5 py-1.5 rounded-lg bg-red-950/60 hover:bg-red-900 border border-red-500/40 text-[11px] font-bold text-red-300 shrink-0 transition">
                      Отменить
                    </button>
                  </div>
                `;
              }
              return `

    function copyTextSafe(text) {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text);
        } else {
          const ta = document.createElement('textarea');
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          ta.remove();
        }
      } catch (e) {}
    }

    function copyInviteCode(code) {
      const nameEl = document.getElementById('new-st-name');
      const fio = (nameEl && nameEl.value.trim()) ? nameEl.value.trim() : 'Атлет';
      const inviteMsg = `Привет, ${fio}! Твой персональный код доступа в приложение Step Value: ${code}`;
      copyTextSafe(inviteMsg);
      triggerHaptic('success');
      showToast(`Скопировано в буфер: «${inviteMsg}»`);
    }

    function createNewStudentRecord(generatedCode) {
      const nameEl = document.getElementById('new-st-name');
      const packEl = document.getElementById('new-st-pack');
      const durEl = document.getElementById('new-st-dur');

      const fio = (nameEl ? nameEl.value.trim() : '') || 'Новый Подопечный';
      const pack = parseInt(packEl ? packEl.value : 12, 10) || 12;
      const dur = parseInt(durEl ? durEl.value : 120, 10) || 120;
      const parts = fio.split(' ');
      const initials = ((parts[0] ? parts[0][0] : 'С') + (parts[1] ? parts[1][0] : 'В')).toUpperCase();
      const newId = 'step-' + Date.now();

      const newStudent = {
        id: newId,
        access_code: generatedCode,
        telegram_username: 'student_telegram',
        full_name: fio,
        avatar: initials,
        status: 'active',
        freeze_details: { is_frozen: false, from: '2026-11-01', to: '2026-11-15' },
        session_duration: dur,
        subscription: {
          total: pack,
          remaining: pack,
          payment_day: 5,
          robokassa_sum: '24 000 ₽',
          robokassa_url: 'https://auth.robokassa.ru/Merchant/Index.aspx?MerchantLogin=StepValueCoach&OutSum=24000'
        },
        payment_history: [
          { date: formatDotDate(formatISO(getTodayDateObj())), count: pack, amount: '24 000 ₽', status: 'Оплачено' }
        ],
        medical_notes: 'Ограничений пока не указано',
        trainer_private_notes: '',
        notification_settings: { workout_reminder: '2h', sunday_checkup: true, monthly_inbody_photos: true },
        workouts: [],
        anthropometry: [
          { date: formatDotDate(formatISO(getTodayDateObj())), chest: 100, waist: 80, abdomen: 82, biceps: 36, hips: 96, glutes: 98 }
        ],
        checkups: [],
        inbody: [
          { date: formatDotDate(formatISO(getTodayDateObj())), muscle_mass: 35.0, body_fat_pct: 16.0, water: 46.0, weight: 78.0 }
        ],
        photo_reports: [
          {
            date: 'Октябрь 2026',
            front_url: createSilhouetteDataUri('Октябрь 2026', 'СПЕРЕДИ', 6, 2, '#00E676'),
            side_url: createSilhouetteDataUri('Октябрь 2026', 'СБОКУ', 6, 2, '#00E676'),
            back_url: createSilhouetteDataUri('Октябрь 2026', 'СЗАДИ', 6, 2, '#00E676')
          }
        ],
        active_booking: null
      };

      appData.students.push(newStudent);
      saveAppData();
      copyInviteCode(generatedCode);
      closeModal();
      renderApp();

        `;
      }

      // --- TRAINER STUDENT SUBSCREEN 3: MANAGEMENT & BALANCE ---
      if (subScreen === 'management') {
        const durations = [
          { mins: 60, label: '1 час' },
          { mins: 90, label: '1.5 часа' },
          { mins: 120, label: '2 часа' },
          { mins: 180, label: '3 часа' }
        ];
        return `
          <div class="space-y-4 animate-fade">
            ${topStudentHeader}

            <!-- 1. Session Balance & Manual +/-1 -->
            <div class="bg-[#161B22] border border-[#30363D] rounded-2xl p-4 space-y-3">
              <h3 class="text-xs font-bold uppercase tracking-wider text-[#00E676]">1. Баланс занятий</h3>
              <div class="grid grid-cols-2 gap-3 items-center">
                <div>
                  <label class="block text-[11px] text-[#8B949E] mb-1">Пакет тренировок (всего)</label>
                  <input type="number" min="1" max="100" value="${st.subscription.total}" onchange="updateStudentTotalSubscription('${st.id}', this.value)" class="w-full bg-[#090C10] border border-[#30363D] rounded-xl px-3 py-2 text-sm font-extrabold text-white" />
                </div>
                <div>
                  <span class="block text-[11px] text-[#8B949E] mb-1">Текущий остаток: <strong class="text-[#00E676]">${st.subscription.remaining}</strong></span>
                  <div class="flex gap-2">
                    <button onclick="adjustStudentRemainingBalance('${st.id}', -1)" class="flex-1 py-2 rounded-xl bg-[#0D1117] hover:bg-red-950/40 border border-[#30363D] text-xs font-extrabold text-white">-1</button>
                    <button onclick="adjustStudentRemainingBalance('${st.id}', 1)" class="flex-1 py-2 rounded-xl bg-[#10B981] text-[#090C10] text-xs font-extrabold shadow-neon">+1</button>
                  </div>
                </div>
              </div>
            </div>

            <!-- 2. Personal Session Duration Selector -->
            <div class="bg-[#161B22] border border-[#30363D] rounded-2xl p-4 space-y-2.5">
              <h3 class="text-xs font-bold uppercase tracking-wider text-[#00E676]">2. Персональная длительность тренировки</h3>
              <p class="text-[11px] text-[#8B949E]">Под эту настройку автоматически фильтруются свободные окна у ученика:</p>
              <div class="grid grid-cols-4 gap-2">
                ${durations.map(d => `
                  <button onclick="setStudentSessionDuration('${st.id}', ${d.mins})" class="py-2.5 rounded-xl text-xs font-extrabold border transition ${
                    Number(st.session_duration) === d.mins
                      ? 'bg-[#10B981] text-[#090C10] border-[#00E676] shadow-neon'
                      : 'bg-[#0D1117] text-white border-[#30363D] hover:bg-[#1F242C]'
                  }">${d.label}</button>
                `).join('')}
              </div>
            </div>

            <!-- 3. Finances & Robokassa -->
            <div class="bg-[#161B22] border border-[#30363D] rounded-2xl p-4 space-y-3">
              <div class="flex items-center justify-between">
                <h3 class="text-xs font-bold uppercase tracking-wider text-[#00E676]">3. Финансы и Robokassa</h3>
                <span class="text-[11px] text-[#8B949E]">День счёта ученика: <strong class="text-white">${st.subscription.payment_day}-е число</strong></span>
              </div>
              <div>
                <label class="block text-[11px] text-[#8B949E] mb-1">Сумма к оплате</label>
                <input id="tr-mgmt-robokassa-sum" type="text" value="${st.subscription.robokassa_sum}" class="w-full bg-[#090C10] border border-[#30363D] rounded-xl px-3 py-2 text-xs font-bold text-white" />
              </div>
              <div>
                <label class="block text-[11px] text-[#8B949E] mb-1">Персональная ссылка на оплату Robokassa</label>
                <input id="tr-mgmt-robokassa-url" type="text" value="${st.subscription.robokassa_url}" class="w-full bg-[#090C10] border border-[#30363D] rounded-xl px-3 py-2 text-xs text-white" />
              </div>
            </div>

            <!-- 4. Medical Card (Filled by student) -->
            <div class="bg-[#161B22] border border-[#30363D] rounded-2xl p-4 space-y-2">
              <h3 class="text-xs font-bold uppercase tracking-wider text-amber-400 flex items-center gap-1.5">
                <i data-lucide="alert-circle" class="w-4 h-4"></i>
                <span>4. Ограничения по здоровью (Медкарта от ученика)</span>
              </h3>
              <p class="text-xs text-white bg-[#0D1117] p-3 rounded-xl border border-[#30363D]">
                ${st.medical_notes || 'Ограничений не указано'}
              </p>
            </div>

            <!-- 5. Trainer Private Note -->
            <div class="bg-[#161B22] border border-[#30363D] rounded-2xl p-4 space-y-2.5">
              <div class="flex items-center justify-between">
                <h3 class="text-xs font-bold uppercase tracking-wider text-[#00E676]">5. Скрытая заметка тренера</h3>
                <span class="text-[10px] text-[#8B949E]">Видит только наставник</span>
              </div>
              <textarea id="tr-mgmt-private-notes" rows="3" placeholder="Цели, психология, особенности режима клиента..." class="w-full bg-[#090C10] border border-[#30363D] focus:border-[#00E676] rounded-xl p-3 text-xs text-white outline-none resize-none">${st.trainer_private_notes || ''}</textarea>
              <button onclick="saveTrainerManagementFinanceAndNotes('${st.id}')" class="w-full py-3 rounded-xl bg-gradient-to-r from-[#10B981] to-[#00E676] text-[#090C10] font-extrabold text-xs uppercase tracking-wider shadow-neon">
                Сохранить параметры и заметку
              </button>
            </div>
          </div>
        `;
      }

      // DEFAULT STUDENT PERSONAL PAGE: EXACTLY 3 FULL-WIDTH LARGE PLATES
      return `
        <div class="space-y-4 animate-fade">
          ${topStudentHeader}

          <div class="space-y-3 pt-1">
            <!-- ПЛАШКА 1: ТРЕНИРОВКИ -->
            <button onclick="openTrainerStudentSubscreen('workouts')" class="w-full text-left bg-[#161B22] hover:bg-[#1F242C] border border-[#30363D] hover:border-[#00E676] rounded-2xl p-5 flex items-center justify-between gap-4 transition group shadow-lg">
              <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-2xl bg-[#0D1117] border border-[#30363D] group-hover:border-[#00E676] flex items-center justify-center text-[#00E676] shrink-0">
                  <i data-lucide="dumbbell" class="w-6 h-6"></i>
                </div>
                <div>
                  <h3 class="text-base font-extrabold text-white group-hover:text-[#00E676] transition">1. Тренировки</h3>
                  <p class="text-xs text-[#8B949E] mt-0.5">Сетка 2×2 дневника, таблица подходов, видео и разбор ошибок (${(st.workouts || []).length} дн.)</p>
                </div>
              </div>
              <i data-lucide="chevron-right" class="w-6 h-6 text-[#8B949E] group-hover:text-[#00E676] shrink-0"></i>
            </button>

            <!-- ПЛАШКА 2: ОТЧЁТЫ И ПРОГРЕСС -->
            <button onclick="openTrainerStudentSubscreen('reports_hub')" class="w-full text-left bg-[#161B22] hover:bg-[#1F242C] border border-[#30363D] hover:border-[#00E676] rounded-2xl p-5 flex items-center justify-between gap-4 transition group shadow-lg">
              <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-2xl bg-[#0D1117] border border-[#30363D] group-hover:border-[#00E676] flex items-center justify-center text-[#00E676] shrink-0">
                  <i data-lucide="bar-chart-3" class="w-6 h-6"></i>
                </div>
                <div>
                  <h3 class="text-base font-extrabold text-white group-hover:text-[#00E676] transition">2. Отчёты и прогресс</h3>
                  <p class="text-xs text-[#8B949E] mt-0.5">Антропометрия (ввод лентой), воскресные чек-апы, InBody и фото формы</p>
                </div>
              </div>
              <i data-lucide="chevron-right" class="w-6 h-6 text-[#8B949E] group-hover:text-[#00E676] shrink-0"></i>
            </button>

            <!-- ПЛАШКА 3: УПРАВЛЕНИЕ И БАЛАНС -->
            <button onclick="openTrainerStudentSubscreen('management')" class="w-full text-left bg-[#161B22] hover:bg-[#1F242C] border border-[#30363D] hover:border-[#00E676] rounded-2xl p-5 flex items-center justify-between gap-4 transition group shadow-lg">
              <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-2xl bg-[#0D1117] border border-[#30363D] group-hover:border-[#00E676] flex items-center justify-center text-[#00E676] shrink-0">
                  <i data-lucide="settings-2" class="w-6 h-6"></i>
                </div>
                <div>
                  <h3 class="text-base font-extrabold text-white group-hover:text-[#00E676] transition">3. Управление и баланс</h3>
                  <p class="text-xs text-[#8B949E] mt-0.5">Корректировка занятий (+1/-1), длительность сессии, Robokassa и медкарта</p>
                </div>
              </div>
              <i data-lucide="chevron-right" class="w-6 h-6 text-[#8B949E] group-hover:text-[#00E676] shrink-0"></i>
            </button>
          </div>
        </div>
      `;
    }

    /*************************************************************************
     * 10. CHART.JS INITIALIZATION (WITH PROPER chart.destroy() CLEANUP)
     *************************************************************************/
    function initReportChartsIfNeeded() {
      if (!window.Chart) return;
      const student = getCurrentStudent();
      if (!student) return;

      // 1. Workout Exercise Progress Line Chart + Tonnage Bar Chart
      const exCanvas = document.getElementById('chart-exercise-weight');
      const tonCanvas = document.getElementById('chart-workout-tonnage');
      if (exCanvas && tonCanvas) {
        const targetEx = uiState.selectedExerciseForChart;
        const exLabels = [];
        const exWeights = [];
        const tonLabels = [];
        const tonValues = [];

        (student.workouts || []).forEach(w => {
          tonLabels.push(w.date.slice(0, 6));
          const ton = (w.exercises || []).reduce((acc, e) => acc + (Number(e.sets) * Number(e.reps) * Number(e.weight || 0)), 0);
          tonValues.push(ton);

          const found = (w.exercises || []).find(e => e.name === targetEx);
          if (found) {
            exLabels.push(w.date.slice(0, 6));
            exWeights.push(Number(found.weight));
          }
        });

        activeCharts.exChart = new Chart(exCanvas.getContext('2d'), {
          type: 'line',
          data: {
            labels: exLabels.length ? exLabels : ['Старт', 'Тек.'],
            datasets: [{
              label: `${targetEx} (кг)`,
              data: exWeights.length ? exWeights : [80, 90],
              borderColor: '#00E676',
              backgroundColor: 'rgba(0, 230, 118, 0.15)',
              borderWidth: 3,
              pointBackgroundColor: '#090C10',
              pointBorderColor: '#00E676',
              pointBorderWidth: 2,
              pointRadius: 5,
              tension: 0.35,
              fill: true
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { labels: { color: '#FFFFFF', font: { size: 11 } } } },
            scales: {
              x: { ticks: { color: '#8B949E' }, grid: { color: '#30363D44' } },
              y: { ticks: { color: '#8B949E' }, grid: { color: '#30363D44' } }
            }
          }
        });

        activeCharts.tonChart = new Chart(tonCanvas.getContext('2d'), {
          type: 'bar',
          data: {
            labels: tonLabels,
            datasets: [{
              label: 'Тоннаж за тренировку (кг)',
              data: tonValues,
              backgroundColor: 'rgba(16, 185, 129, 0.75)',
              borderColor: '#00E676',
              borderWidth: 1.5,
              borderRadius: 8
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { labels: { color: '#FFFFFF', font: { size: 11 } } } },
            scales: {
              x: { ticks: { color: '#8B949E' }, grid: { display: false } },
              y: { ticks: { color: '#8B949E' }, grid: { color: '#30363D44' } }
            }
          }
        });
      }

      // 2. InBody 4-Parameter Chart
      const inbodyCanvas = document.getElementById('chart-inbody-params');
      if (inbodyCanvas) {
        const list = student.inbody || [];
        const labels = list.map(i => i.date.slice(0, 5));
        activeCharts.inbodyChart = new Chart(inbodyCanvas.getContext('2d'), {
          type: 'line',
          data: {
            labels,
            datasets: [
              {
                label: 'Мышцы (кг)',
                data: list.map(i => i.muscle_mass),
                borderColor: '#00E676',
                backgroundColor: 'transparent',
                borderWidth: 2.5,
                tension: 0.3
              },
              {
                label: 'Жир (%)',
                data: list.map(i => i.body_fat_pct),
                borderColor: '#F59E0B',
                backgroundColor: 'transparent',
                borderWidth: 2.5,
                tension: 0.3
              },
              {
                label: 'Вода (л)',
                data: list.map(i => i.water),
                borderColor: '#38BDF8',
                backgroundColor: 'transparent',
                borderWidth: 2,
                tension: 0.3
              },
              {
                label: 'Вес (кг)',
                data: list.map(i => i.weight),
                borderColor: '#A855F7',
                backgroundColor: 'transparent',
                borderWidth: 2,
                tension: 0.3
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { labels: { color: '#FFFFFF', boxWidth: 12, font: { size: 10 } } } },
            scales: {
              x: { ticks: { color: '#8B949E' }, grid: { color: '#30363D44' } },
              y: { ticks: { color: '#8B949E' }, grid: { color: '#30363D44' } }
            }
          }
        });
      }
    }

    /*************************************************************************
     * 11. MASTER RENDER PIPELINE & TABBAR CONTROLLER
     *************************************************************************/
    function renderBottomTabBar() {
      const nav = document.getElementById('app-tabbar');
      if (!appData.current_role) {
        nav.classList.add('hidden');
        nav.innerHTML = '';
        return;
      }
      nav.classList.remove('hidden');

      if (appData.current_role === 'student') {
        const tabs = [
          { id: 'booking', label: 'Бронирование', icon: 'calendar-clock' },
          { id: 'workouts', label: 'Тренировки', icon: 'dumbbell' },
          { id: 'reports', label: 'Отчёты', icon: 'line-chart' },
          { id: 'profile', label: 'Профиль', icon: 'user-check' }
        ];
        nav.innerHTML = `
          <div class="grid grid-cols-4 gap-1 px-2 py-2">
            ${tabs.map(t => {
              const active = uiState.studentTab === t.id;
              return `
                <button onclick="setStudentTab('${t.id}')" class="py-1.5 rounded-xl flex flex-col items-center justify-center gap-1 transition ${
                  active ? 'text-[#00E676] bg-[#1F242C] border border-[#10B981]/40 shadow-neon' : 'text-[#8B949E] hover:text-white'
                }">
                  <i data-lucide="${t.icon}" class="w-4 h-4"></i>
                  <span class="text-[10px] font-bold">${t.label}</span>
                </button>
              `;
            }).join('')}
          </div>
        `;
      } else if (appData.current_role === 'trainer') {
        const tabs = [
          { id: 'schedule', label: '1. Расписание', icon: 'calendar-range' },
          { id: 'students', label: '2. Ученики', icon: 'users' }
        ];
        nav.innerHTML = `
          <div class="grid grid-cols-2 gap-2 px-3 py-2">
            ${tabs.map(t => {
              const active = uiState.trainerTab === t.id;
              return `
                <button onclick="setTrainerTab('${t.id}')" class="py-2 rounded-xl flex items-center justify-center gap-2 transition ${
                  active ? 'text-[#090C10] bg-gradient-to-r from-[#10B981] to-[#00E676] font-extrabold shadow-neon' : 'text-[#8B949E] bg-[#0D1117] border border-[#30363D] hover:text-white font-bold'
                }">
                  <i data-lucide="${t.icon}" class="w-4 h-4"></i>
                  <span class="text-xs">${t.label}</span>
                </button>
              `;
            }).join('')}
          </div>
        `;
      }
    }

    function updateHeaderBadge() {
      const badge = document.getElementById('header-role-badge');
      const subtitle = document.getElementById('header-subtitle');
      if (!badge || !subtitle) return;

      if (!appData.current_role) {
        badge.textContent = 'АВТОРИЗАЦИЯ';
        subtitle.textContent = 'Персональный трекер прогресса';
      } else if (appData.current_role === 'student') {
        const st = getCurrentStudent();
        badge.textContent = 'УЧЕНИК';
        subtitle.textContent = st ? `${st.full_name} • ${st.access_code}` : 'Личный кабинет';
      } else {
        badge.textContent = 'ТРЕНЕР';
        subtitle.textContent = `Наставник: ${appData.trainer_profile.full_name}`;
      }
    }

    function renderApp() {
      destroyAllCharts();
      updateHeaderBadge();
      renderBottomTabBar();

      const main = document.getElementById('app-main');
      if (!appData.current_role) {
        main.innerHTML = renderOnboardingScreen();
      } else if (appData.current_role === 'student') {
        if (uiState.studentTab === 'booking') main.innerHTML = renderStudentBookingTab();
        else if (uiState.studentTab === 'workouts') main.innerHTML = renderStudentWorkoutsTab();
        else if (uiState.studentTab === 'reports') main.innerHTML = renderStudentReportsTab();
        else if (uiState.studentTab === 'profile') main.innerHTML = renderStudentProfileTab();
      } else if (appData.current_role === 'trainer') {
        if (uiState.trainerTab === 'schedule') main.innerHTML = renderTrainerScheduleTab();
        else main.innerHTML = renderTrainerStudentsTab();
      }

      if (window.lucide) {
        lucide.createIcons();
      }
      initReportChartsIfNeeded();
    }

    // Boot Application on DOMContentLoaded
    window.addEventListener('DOMContentLoaded', () => {
      initTelegramSDK();
      loadAppData();
      renderApp();
    });
  </script>
</body>
</html>
