    function syncSupabaseStateToLocalApp(user, sub, bookings, preferredStudentId = null) {
      if (typeof appData === 'undefined' || !appData || !Array.isArray(appData.students)) return;
      if (!user || !user.id) return;

      let student = null;
      if (preferredStudentId) {
        student = appData.students.find(s => s.id === preferredStudentId || s.access_code === preferredStudentId);
      }
      if (!student) {
        student = appData.students.find(s => s.id === user.id || s.supabase_id === user.id);
      }
      if (!student) {
        student = appData.students.find(s => s.id === appData.current_student_id) || appData.students[0];
      }
      if (!student) return;

      const oldId = student.id;
      const newId = user.id;

      // Синхронизируем UUID пользователя между профилем и слотами расписания
      if (oldId !== newId) {
        student.id = newId;
        student.supabase_id = newId;
        if (appData.current_student_id === oldId) {
          appData.current_student_id = newId;
        }
        if (appData.schedule_slots) {
          Object.keys(appData.schedule_slots).forEach(dateKey => {
            (appData.schedule_slots[dateKey] || []).forEach(slot => {
              if (slot.booked_by === oldId) {
                slot.booked_by = newId;
              }
            });
          });
        }
      } else {
        student.supabase_id = newId;
      }

      if (user.name && !user.name.startsWith('Демо ')) {
        student.full_name = user.name;
      }

      if (sub) {
        currentSubscription = sub;
        const total = Number(sub.total_sessions) || 12;
        const used = Number(sub.used_sessions) || 0;
        const remaining = Math.max(0, total - used);
        const dur = Number(sub.session_duration_minutes) || student.session_duration || 120;
        const billDay = Number(sub.billing_day) || (student.subscription && student.subscription.payment_day) || 7;

        student.session_duration = dur;
        if (!student.subscription) student.subscription = {};
        student.subscription.id = sub.id;
        student.subscription.total = total;
        student.subscription.used = used;
        student.subscription.remaining = remaining;
        student.subscription.payment_day = billDay;
      }

      if (Array.isArray(bookings)) {
        const confirmed = bookings.filter(b => !b.status || b.status === 'confirmed');
        // Если в Supabase есть реальные бронирования, синхронизируем их с локальной сеткой
        if (confirmed.length > 0) {
          if (appData.schedule_slots) {
            Object.keys(appData.schedule_slots).forEach(dateKey => {
              (appData.schedule_slots[dateKey] || []).forEach(slot => {
                if (slot.booked_by === student.id) {
                  slot.booked_by = null;
                  slot.is_open = true;
                }
              });
            });
          }

          student.active_bookings = confirmed.map(b => {
            const dur = Number(b.duration_minutes) || student.session_duration || 120;
            const dateStr = b.session_date;
            const timeStr = b.session_time;
            if (appData.schedule_slots && appData.schedule_slots[dateStr]) {
              const daySlots = appData.schedule_slots[dateStr];
              const startIdx = daySlots.findIndex(s => s.time === timeStr);
              const hoursNeeded = Math.ceil(dur / 60);
              if (startIdx !== -1) {
                for (let k = 0; k < hoursNeeded; k++) {
                  if (daySlots[startIdx + k]) {
                    daySlots[startIdx + k].booked_by = student.id;
                  }
                }
              }
            }
            return {
              id: b.id || ('bk-' + Date.now() + '-' + Math.random().toString(36).slice(2, 5)),
              date: dateStr,
              time: timeStr,
              duration: dur
            };
          });
          student.active_bookings.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
        }
      }

      if (typeof saveAppData === 'function') {
        saveAppData();
      }
    }


    async function syncAllStudentsFromSupabase() {
      if (!supabaseClient) return;
      try {
        const { data: users, error: uErr } = await supabaseClient
          .from('users')
          .select('*')
          .eq('role', 'student');

        if (uErr || !Array.isArray(users) || users.length === 0) return;

        const { data: subs } = await supabaseClient
          .from('subscriptions')
          .select('*')
          .eq('status', 'active');

        const { data: bks } = await supabaseClient
          .from('bookings')
          .select('*')
          .eq('status', 'confirmed');

        const subsMap = new Map();
        if (Array.isArray(subs)) {
          subs.forEach(s => subsMap.set(s.student_id, s));
        }

        const bksMap = new Map();
        if (Array.isArray(bks)) {
          bks.forEach(b => {
            if (!bksMap.has(b.student_id)) bksMap.set(b.student_id, []);
            bksMap.get(b.student_id).push(b);
          });
        }

        users.forEach(u => {
          let st = (appData.students || []).find(s => 
            s.id === u.id || 
            s.supabase_id === u.id || 
            (u.username && s.access_code && s.access_code.toUpperCase() === u.username.toUpperCase()) ||
            (u.username && s.telegram_username && s.telegram_username.toLowerCase() === u.username.toLowerCase())
          );

          const userFullName = `${u.first_name || ''} ${u.last_name || ''}`.trim() || u.username || 'Атлет';
          const userSub = subsMap.get(u.id);
          const userBks = bksMap.get(u.id) || [];

          const total = Math.max(1, Number(userSub?.total_sessions) || (st?.subscription?.total) || 12);
          const used = Math.min(total, Math.max(0, Number(userSub?.used_sessions) || 0));
          const remaining = Math.max(0, total - used);
          const dur = Number(userSub?.session_duration_minutes) || (st?.session_duration) || 120;
          const billDay = Number(userSub?.billing_day) || (st?.subscription?.payment_day) || 5;

          if (st) {
            st.id = u.id;
            st.supabase_id = u.id;
            if (!st.full_name || st.full_name.startsWith('Новый')) {
              st.full_name = userFullName;
            }
            st.session_duration = dur;
            if (!st.subscription) st.subscription = {};
            st.subscription.id = userSub?.id || st.subscription.id;
            st.subscription.total = total;
            st.subscription.total_sessions = total;
            st.subscription.used = used;
            st.subscription.used_sessions = used;
            st.subscription.remaining = remaining;
            st.subscription.payment_day = billDay;

            if (userBks.length > 0) {
              st.active_bookings = userBks.map(b => ({
                id: b.id,
                date: b.session_date,
                time: b.session_time,
                duration: Number(b.duration_minutes) || dur
              }));
            }
          } else {
            const parts = userFullName.split(' ');
            const initials = ((parts[0] ? parts[0][0] : 'А') + (parts[1] ? parts[1][0] : 'В')).toUpperCase();
            const code = (u.username && u.username.toUpperCase().startsWith('STEP-')) 
              ? u.username.toUpperCase() 
              : generateFreeStudentAccessCode();

            const newSt = {
              id: u.id,
              supabase_id: u.id,
              access_code: code,
              telegram_username: u.username || '',
              full_name: userFullName,
              avatar: initials,
              status: 'active',
              freeze_details: { is_frozen: false, from: '2026-11-01', to: '2026-11-15' },
              session_duration: dur,
              subscription: {
                id: userSub?.id,
                total: total,
                total_sessions: total,
                used: used,
                used_sessions: used,
                remaining: remaining,
                payment_day: billDay,
                robokassa_sum: '24 000 ₽',
                robokassa_url: 'https://auth.robokassa.ru/Merchant/Index.aspx?MerchantLogin=StepValueCoach&OutSum=24000'
              },
              payment_history: [
                { date: formatDotDate(formatISO(getTodayDateObj())), count: total, amount: '24 000 ₽', status: 'Оплачено' }
              ],
              medical_notes: 'Ограничений пока не указано',
              trainer_private_notes: '',
              notification_settings: { workout_reminder: '2h', sunday_checkup: true, monthly_inbody_photos: true },
              workouts: [],
              anthropometry: [
                { date: formatDotDate(formatISO(getTodayDateObj())), chest: 100, waist: 80, arms: 36 }
              ],
              checkups: [],
              inbody: [
                enrichInBodyRecord({ date: formatDotDate(formatISO(getTodayDateObj())), muscle_mass: 35.0, body_fat_pct: 16.0, water: 46.0, weight: 78.0 })
              ],
              photo_reports: [
                {
                  date: 'Октябрь 2026',
                  front_url: createSilhouetteDataUri('Октябрь 2026', 'СПЕРЕДИ', 6, 2, '#00E676'),
                  side_url: createSilhouetteDataUri('Октябрь 2026', 'СБОКУ', 6, 2, '#00E676'),

            appData.students.push(newSt);
          }

        saveAppData();

    async function getOrCreateSupabaseUser(role = 'student', options = {}) {
  const normalizedDbRole = (role === 'trainer' || role === 'coach') ? 'coach' : 'student';
  const preferredStudent = options.student || null;

  try {
    if (!supabaseClient) {
      throw new Error('Supabase SDK не инициализирован');
    }

    const tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user;
    const telegramId = tgUser?.id ? Number(tgUser.id) : 999999999;
    const studentFullName = preferredStudent?.full_name || preferredStudent?.name || '';
    const firstName = tgUser?.first_name || (studentFullName ? studentFullName.split(' ')[0] : (normalizedDbRole === 'coach' ? 'Денис' : 'Александр'));
    const lastName = tgUser?.last_name || (studentFullName ? studentFullName.split(' ').slice(1).join(' ') : 'Воронов');
    const username = tgUser?.username || '';

    // 1. Ищем пользователя по telegram_id
    let { data: user, error: selectErr } = await supabaseClient
      .from('users')
      .select('*')
      .eq('telegram_id', telegramId)
      .maybeSingle();

    if (selectErr) console.warn("Supabase select warning:", selectErr);

    // 2. Если нет — создаем с обязательным полем first_name
    if (!user) {
      const { data: newUser, error: createError } = await supabaseClient
        .from('users')
        .insert([{
          telegram_id: telegramId,
          first_name: firstName,
          last_name: lastName,
          username: username,
          role: normalizedDbRole
        }])
        .select()
        .single();

      if (createError) throw createError;
      user = newUser;
    }

    // 3. Синхронизируем абонемент
    let { data: sub } = await supabaseClient
      .from('subscriptions')
      .select('*')
      .eq('student_id', user.id)
      .eq('status', 'active')
      .maybeSingle();

    if (!sub) {
      const { data: newSub, error: subCreateErr } = await supabaseClient
        .from('subscriptions')
        .insert([{
          student_id: user.id,
          total_sessions: 12,
          used_sessions: 0,
          session_duration_minutes: 120,
          billing_day: 7,
          status: 'active'
        }])
        .select()
        .single();

      if (!subCreateErr) sub = newSub;
    }

    currentUser = user;
    if (sub) currentSubscription = sub;
    localStorage.setItem('sv_user', JSON.stringify(user));
    if (sub) localStorage.setItem('sv_sub', JSON.stringify(sub));

    // Синхронизируем полученное состояние с локальным приложением
    syncSupabaseStateToLocalApp(user, sub, [], preferredStudent ? preferredStudent.id : null);

    return { user, sub };
  } catch (err) {
    console.error("Ошибка в getOrCreateSupabaseUser:", err);
    throw err;
  }
}

    async function bookSession(date, time) {
      try {
        if (!supabaseClient) {
          notifyUser('Ошибка связи с базой данных: клиент Supabase не загружен', 'error');
          return null;
        }

        // 1. Проверяем или восстанавливаем авторизацию пользователя
        let user = currentUser;
        if (!user || !user.id) {
          try {
            const rawUser = localStorage.getItem('sv_user');
            if (rawUser) user = JSON.parse(rawUser);
          } catch (e) {}
        }

        if (!user || !user.id) {
          const currentSt = typeof getCurrentStudent === 'function' ? getCurrentStudent() : null;
          const authRes = await getOrCreateSupabaseUser('student', { autoEnter: true, student: currentSt });
          user = authRes ? authRes.user : null;
        }

        if (!user || !user.id) {
          notifyUser('Не удалось войти. Проверьте подключение и попробуйте снова.', 'error');
          return null;
        }

        // 2. Проверяем реальный остаток занятий в таблице subscriptions в Supabase
        let { data: subsList, error: subError } = await supabaseClient
          .from('subscriptions')
          .select('*')
          .eq('student_id', user.id)
          .eq('status', 'active')
          .order('id', { ascending: false })
          .limit(1);

        if (subError) throw subError;

        let sub = (subsList && subsList.length > 0) ? subsList[0] : null;

        if (!sub) {
          const { data: createdSubs, error: insErr } = await supabaseClient
            .from('subscriptions')
            .insert([{
              student_id: user.id,
              total_sessions: 12,
              used_sessions: 0,
              session_duration_minutes: 120,
              billing_day: 7,
              status: 'active'
            }])
            .select();
          if (insErr) throw insErr;
          sub = (createdSubs && createdSubs.length > 0) ? createdSubs[0] : null;
        }

        if (!sub) {
          throw new Error('Не удалось найти или создать активный абонемент');
        }

        const totalSessions = Number(sub.total_sessions) || 0;
        const usedSessions = Number(sub.used_sessions) || 0;
        const remainingSessions = totalSessions - usedSessions;

        if (remainingSessions <= 0) {
          notifyUser('Закончились тренировки в абонементе! Обновите абонемент для записи.', 'error');
          return null;
        }

        const durationMinutes = Number(sub.session_duration_minutes) || 120;

        // 3. Добавляем строку в таблицу bookings
        const { data: insertedBookings, error: bookError } = await supabaseClient
          .from('bookings')
          .insert([{
            student_id: user.id,
            session_date: date,
            session_time: time,
            duration_minutes: durationMinutes,
            status: 'confirmed'
          }])
          .select();

        if (bookError) throw bookError;
        const createdBooking = (insertedBookings && insertedBookings.length > 0) ? insertedBookings[0] : null;

        // 4. Обновляем счетчик used_sessions = used_sessions + 1 в subscriptions
        const newUsedSessions = usedSessions + 1;
        const { data: updatedSubs, error: updateError } = await supabaseClient
          .from('subscriptions')
          .update({ used_sessions: newUsedSessions })
          .eq('id', sub.id)
          .select();

        if (updateError) throw updateError;

        const updatedSub = (updatedSubs && updatedSubs.length > 0)
          ? updatedSubs[0]
          : { ...sub, used_sessions: newUsedSessions };

        currentSubscription = updatedSub;

        return {
          success: true,
          user,
          sub: updatedSub,
          booking: createdBooking || {
            id: 'bk-' + Date.now(),
            student_id: user.id,
            session_date: date,
            session_time: time,
            duration_minutes: durationMinutes,
            status: 'confirmed'
          }
        };
      } catch (err) {
        console.error('Ошибка бронирования в Supabase:', err);
        notifyUser('Ошибка связи с базой данных: ' + (err.message || 'не удалось сохранить запись'), 'error');
        return null;
      }
    }

    function initTelegramSDK() {
      if (!tg) return;
      try {
        tg.ready();
        tg.expand();
        if (typeof tg.enableClosingConfirmation === 'function') tg.enableClosingConfirmation();
        if (typeof tg.disableVerticalSwipes === 'function') tg.disableVerticalSwipes();
        if (typeof tg.setHeaderColor === 'function') tg.setHeaderColor('#090C10');
        if (typeof tg.setBackgroundColor === 'function') tg.setBackgroundColor('#090C10');
      } catch (err) {
        console.warn('Telegram WebApp SDK init fallback:', err);
      }
    }

    function initTapToDismissKeyboard() {
      const isTextControl = (el) => {
        if (!el || !el.tagName) return false;
        const tag = el.tagName.toUpperCase();
        if (tag === 'TEXTAREA' || tag === 'SELECT') return true;
        if (tag === 'INPUT') {
          const type = (el.type || 'text').toLowerCase();
          return !['range', 'checkbox', 'radio', 'button', 'submit', 'file'].includes(type);
        }
        return false;
      };

      document.addEventListener('pointerdown', (e) => {
        const active = document.activeElement;
        if (active && isTextControl(active)) {
          if (!active.contains(e.target) && !isTextControl(e.target) && !e.target.closest('#modal-backdrop')) {
            active.blur();
          }
        }
      }, { passive: true });

      // touchmove не должен сбрасывать активный инпут, чтобы страница могла свободно скроллиться при вводе текста

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const active = document.activeElement;
          if (active && active.tagName && active.tagName.toUpperCase() === 'INPUT') {
            e.preventDefault();
            active.blur();
          }
        }
      });
    }

    function triggerHaptic(style = 'light') {
      try {
        if (tg && tg.HapticFeedback) {
          if (style === 'success' || style === 'warning' || style === 'error') {
            tg.HapticFeedback.notificationOccurred(style);
          } else {
            tg.HapticFeedback.impactOccurred(style);
          }
        }
      } catch (e) {}
    }

    function openTelegramChat(username) {
      triggerHaptic('light');

      const url = `https://t.me/${clean}`;

          window.open(url, '_blank', 'noopener,noreferrer');

    const RU_MONTHS_LONG = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];

    function getTodayDateObj() {
      const now = new Date();
      return new Date(now.getFullYear(), now.getMonth(), now.getDate());
    }

    function formatISO(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function parseISO(isoStr) {
      const [y, m, d] = (isoStr || '2026-11-02').split('-').map(Number);
      return new Date(y, (m || 1) - 1, d || 1);
    }

    // П.7: Формат месяца полное название («Понедельник, 2 ноября»)
    function formatHumanDate(isoStr) {
      if (!isoStr) return '';
      const d = parseISO(isoStr);
      const dayName = RU_DAYS_FULL[d.getDay()];
      return `${dayName}, ${d.getDate()} ${RU_MONTHS_LONG[d.getMonth()]}`;
    }

    function formatShortRuDate(isoStr) {
      if (!isoStr) return '';
      const d = parseISO(isoStr);
      return `${d.getDate()} ${RU_MONTHS_SHORT[d.getMonth()]} ${d.getFullYear()}`;
    }

    function formatDotDate(isoStr) {
      if (!isoStr) return '';
      const [y, m, d] = isoStr.split('-');
      return `${d}.${m}.${y}`;
    }

    function getUpcomingDays(count = 10) {
      const base = getTodayDateObj();
      const list = [];
      for (let i = 0; i < count; i++) {
        const d = new Date(base);
        d.setDate(base.getDate() + i);
        list.push({
          iso: formatISO(d),
          dayShort: RU_DAYS_SHORT[d.getDay()],
          dayNum: d.getDate(),
          monthShort: RU_MONTHS_SHORT[d.getMonth()],
          isToday: i === 0
        });
      }
      return list;
    }

    function buildDefaultHoursForDay(startH = 9, endH = 21, closedHours = [], bookingsMap = {}) {
      const slots = [];
      for (let h = startH; h < endH; h++) {
        const timeStr = `${String(h).padStart(2, '0')}:00`;
        const bookedBy = bookingsMap[timeStr] || null;
        const isOpen = bookedBy ? true : !closedHours.includes(h);
        slots.push({
          time: timeStr,
          duration: 60,
          is_open: isOpen,
          booked_by: bookedBy
        });
      }
      return slots;
    }

    function migrateLoadedData() {
      if (!appData || !appData.students) return;
      const upcoming = getUpcomingDays(10);
      if (!appData.schedule_slots) appData.schedule_slots = {};
      upcoming.forEach(d => {
        if (!appData.schedule_slots[d.iso]) {
          appData.schedule_slots[d.iso] = buildDefaultHoursForDay(9, 21, [13], {});
        }
      });

      appData.students.forEach(st => {
        if (!Array.isArray(st.active_bookings)) {
          st.active_bookings = [];
          if (st.active_booking && st.active_booking.date) {
            st.active_bookings.push({
              id: 'bk-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
              date: st.active_booking.date,
              time: st.active_booking.time,
              duration: st.active_booking.duration || st.session_duration || 60
            });
          }
          delete st.active_booking;
        }
        st.anthropometry = (st.anthropometry || []).map(normalizeAnthropometryRecord);
        st.inbody = (st.inbody || []).map(enrichInBodyRecord);
        if (Array.isArray(st.photo_reports)) {
          st.photo_reports.forEach((pr, idx) => {
            const accent = idx === 0 && st.photo_reports.length > 1 ? '#3B82F6' : '#00E676';
            const tone = idx === 0 && st.photo_reports.length > 1 ? 2 : 10;
            const waist = idx === 0 && st.photo_reports.length > 1 ? 8 : 0;
            if (!pr.front_custom) pr.front_url = createSilhouetteDataUri(pr.date, 'СПЕРЕДИ', tone, waist, accent);
            if (!pr.side_custom) pr.side_url = createSilhouetteDataUri(pr.date, 'СБОКУ', tone, waist, accent);
            if (!pr.back_custom) pr.back_url = createSilhouetteDataUri(pr.date, 'СЗАДИ', tone, waist, accent);
          });
        }
      });
    }

          autoProcessCompletedBookings();
          saveAppData();

    function autoProcessCompletedBookings() {
      const todayIso = formatISO(getTodayDateObj());
      let changed = false;
      (appData.students || []).forEach(st => {
        if (!Array.isArray(st.active_bookings)) st.active_bookings = [];
        const remainingBookings = [];
        st.active_bookings.forEach(bk => {
          if (bk.date < todayIso) {
            // Занятие уже было списано с баланса при оформлении бронирования
            changed = true;
          } else {
            remainingBookings.push(bk);
          }
        });
        st.active_bookings = remainingBookings;
      });
      if (changed) saveAppData();
    }

    // П.2: Персональный пул упражнений ТЕКУЩЕГО подопечного, отсортированный по частоте выполнения
    function getStudentPersonalExercisePool(student) {
      if (!student || !Array.isArray(student.workouts)) return [];
      const freqMap = new Map();
      student.workouts.forEach(w => {
        (w.exercises || []).forEach(ex => {
          const name = (ex.name || '').trim();
          if (name) {
            freqMap.set(name, (freqMap.get(name) || 0) + 1);
          }
        });
      });
      return Array.from(freqMap.entries())
        .sort((a, b) => b[1] - a[1])
        .map(entry => entry[0]);
    }

      datalistEl.innerHTML = pool.map(name => `<option value="${name.replace(/"/g, '&quot;')}"></option>`).join('');

    function showToast(message, type = 'success') {
      triggerHaptic(type === 'error' ? 'error' : 'light');
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      const borderCol = type === 'error' ? 'border-red-500/70' : 'border-[#10B981]';
      const iconName = type === 'error' ? 'alert-triangle' : 'check-circle-2';
      const iconCol = type === 'error' ? 'text-red-400' : 'text-[#00E676]';
      toast.className = `pointer-events-auto bg-[#161B22]/95 backdrop-blur-md border ${borderCol} rounded-xl px-4 py-3 shadow-neon flex items-center gap-3 animate-fade`;
      toast.innerHTML = `
        <i data-lucide="${iconName}" class="w-5 h-5 ${iconCol} shrink-0"></i>
        <span class="text-xs font-medium text-white leading-snug flex-1">${message}</span>
      `;
      container.appendChild(toast);
      if (window.lucide) lucide.createIcons({ attrs: { class: 'w-5 h-5' } });
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.25s ease';
        setTimeout(() => toast.remove(), 260);
      }, 2800);
    }

    // П.4: Фильтрация прошедших часов на сегодня + часовой буфер (lead time)
    function computeFittableSlotsForStudent(isoDate, durationMinutes) {
      const daySlots = (appData.schedule_slots && appData.schedule_slots[isoDate]) || [];
      const hoursNeeded = Math.ceil(durationMinutes / 60);
      const availableStarts = [];

      const todayIso = formatISO(getTodayDateObj());
      const isToday = isoDate === todayIso;
      const nowHour = new Date().getHours();
      const minAllowedHourToday = nowHour + 1; // slotHour <= nowHour отсекается + 1 час lead time буфер => строго slotHour > nowHour + 1 (или >= nowHour + 2)

      for (let i = 0; i <= daySlots.length - hoursNeeded; i++) {
        const startHour = parseInt(daySlots[i].time.split(':')[0], 10);
        if (isToday && startHour <= minAllowedHourToday) {
          continue;
        }
        let fitsAll = true;
        for (let k = 0; k < hoursNeeded; k++) {
          const s = daySlots[i + k];
          if (!s || !s.is_open || s.booked_by !== null) {
            fitsAll = false;
            break;
          }
        }
        if (fitsAll) {
          const endTotalMins = startHour * 60 + durationMinutes;
          const endH = String(Math.floor(endTotalMins / 60)).padStart(2, '0');
          const endM = String(endTotalMins % 60).padStart(2, '0');
          availableStarts.push({
            startTime: daySlots[i].time,
            endTime: `${endH}:${endM}`,
            duration: durationMinutes,
            hoursSpan: hoursNeeded
          });
        }
      }
      return availableStarts;
    }

    // П.5: Освобождение конкретного слота из массива active_bookings
    function releaseBookingEntryFromSchedule(student, bookingObj) {
      if (!student || !bookingObj) return;
      const { date, time, duration } = bookingObj;
      const daySlots = appData.schedule_slots[date];
      const hoursNeeded = Math.ceil((duration || student.session_duration || 60) / 60);
      if (daySlots) {
        const startIdx = daySlots.findIndex(s => s.time === time);
        if (startIdx !== -1) {
          for (let k = 0; k < hoursNeeded; k++) {
            if (daySlots[startIdx + k] && daySlots[startIdx + k].booked_by === student.id) {
              daySlots[startIdx + k].booked_by = null;
              daySlots[startIdx + k].is_open = true;
            }
          }
        } else {
          daySlots.forEach(s => {
            if (s.booked_by === student.id) {
              s.booked_by = null;
              s.is_open = true;
            }
          });
        }
      }
    }

    let isBookingInProgress = false;

    async function bookStudentSlot(isoDate, startTime) {
      if (isBookingInProgress) return;

      const student = getCurrentStudent();
      if (!student) return;
      if (!Array.isArray(student.active_bookings)) student.active_bookings = [];

      if (student.freeze_details && student.freeze_details.is_frozen) {
        showToast('Ваш абонемент на паузе (Заморозка). Отключите паузу в Профиле для записи.', 'error');
        return;
      }

      const daySlots = appData.schedule_slots[isoDate] || [];
      const startIndex = daySlots.findIndex(s => s.time === startTime);
      if (startIndex === -1) {
        showToast('Выбранный слот не найден в расписании.', 'error');
        return;
      }

      const reschedulingId = uiState.reschedulingBookingId;
      const existingToReschedule = reschedulingId
        ? student.active_bookings.find(b => b.id === reschedulingId)
        : null;

      isBookingInProgress = true;
      try {
        if (existingToReschedule) {
          // ==================== РЕЖИМ ПЕРЕНОСА (Баланс НЕ списывается!) ====================
          const sessionDuration = existingToReschedule.duration || student.session_duration || 120;

          // 1. Освобождаем старый слот в локальной сетке
          releaseBookingEntryFromSchedule(student, existingToReschedule);

          // 2. Занимаем новый слот в локальной сетке
          const hoursNeeded = Math.ceil(sessionDuration / 60);
          const targetDaySlots = appData.schedule_slots[isoDate] || [];
          const targetStartIndex = targetDaySlots.findIndex(s => s.time === startTime);
          if (targetStartIndex !== -1) {
            for (let k = 0; k < hoursNeeded; k++) {
              if (targetDaySlots[targetStartIndex + k]) {
                targetDaySlots[targetStartIndex + k].booked_by = student.id;
              }
            }
          }

          // 3. Обновляем саму запись в массиве активных броней
          existingToReschedule.date = isoDate;
          existingToReschedule.time = startTime;
          existingToReschedule.duration = sessionDuration;

          student.active_bookings.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
          uiState.reschedulingBookingId = null;

          // 4. Синхронизируем изменение в Supabase (БЕЗ списания used_sessions!)
          try {
            if (typeof supabaseClient !== 'undefined' && supabaseClient) {
              const userRaw = localStorage.getItem('sv_user');
              const user = userRaw ? JSON.parse(userRaw) : currentUser;

              if (existingToReschedule.id && !String(existingToReschedule.id).startsWith('bk-')) {
                await supabaseClient
                  .from('bookings')
                  .update({
                    session_date: isoDate,
                    session_time: startTime,
                    duration_minutes: sessionDuration,
                    status: 'confirmed'
                  })
                  .eq('id', existingToReschedule.id);
              } else if (user && user.id) {
                const { data: newBk } = await supabaseClient
                  .from('bookings')
                  .insert([{
                    student_id: user.id,
                    session_date: isoDate,
                    session_time: startTime,
                    duration_minutes: sessionDuration,
                    status: 'confirmed'
                  }])
                  .select();
                if (newBk && newBk.length > 0) {
                  existingToReschedule.id = newBk[0].id;
                }
              }
            }
          } catch (err) {
            console.warn('Ошибка синхронизации переноса с Supabase:', err);
          }

          saveAppData();
          triggerHaptic('success');
          showToast(`Запись перенесена на ${formatHumanDate(isoDate)} в ${startTime}. Баланс сохранён: ${student.subscription.remaining} из ${student.subscription.total}!`);
          renderApp();
          return;
        }

        // ==================== НОВОЕ БРОНИРОВАНИЕ (Списание занятия) ====================
        if (student.subscription && student.subscription.remaining <= 0) {
          showToast('Закончились тренировки в абонементе! Обновите абонемент для записи.', 'error');
          return;
        }

        const result = await bookSession(isoDate, startTime);
        if (!result || !result.success) {
          return;
        }

        const activeStudent = getCurrentStudent() || student;
        if (!Array.isArray(activeStudent.active_bookings)) activeStudent.active_bookings = [];

        // Обновляем локальное состояние абонемента строго по ответу Supabase
        const sub = result.sub;
        const total = Number(sub.total_sessions) || activeStudent.subscription.total || 12;
        const used = Number(sub.used_sessions) || 0;
        const remaining = Math.max(0, total - used);
        const sessionDuration = Number(sub.session_duration_minutes) || activeStudent.session_duration || 120;

        activeStudent.session_duration = sessionDuration;
        activeStudent.subscription.id = sub.id;
        activeStudent.subscription.total = total;
        activeStudent.subscription.used = used;
        activeStudent.subscription.remaining = remaining;
        if (sub.billing_day) {
          activeStudent.subscription.payment_day = Number(sub.billing_day);
        }

        // Помечаем часы в локальной сетке расписания
        const hoursNeeded = Math.ceil(sessionDuration / 60);
        const targetDaySlots = appData.schedule_slots[isoDate] || [];
        const targetStartIndex = targetDaySlots.findIndex(s => s.time === startTime);
        if (targetStartIndex !== -1) {
          for (let k = 0; k < hoursNeeded; k++) {
            if (targetDaySlots[targetStartIndex + k]) {
              targetDaySlots[targetStartIndex + k].booked_by = activeStudent.id;
            }
          }
        }

        activeStudent.active_bookings.push({
          id: (result.booking && result.booking.id) ? result.booking.id : ('bk-' + Date.now() + '-' + Math.random().toString(36).slice(2, 5)),
          date: isoDate,
          time: startTime,
          duration: sessionDuration
        });

        activeStudent.active_bookings.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));

        saveAppData();
        triggerHaptic('success');
        showToast(`Тренировка забронирована на ${formatHumanDate(isoDate)} в ${startTime}! Остаток: ${remaining} из ${total}`);
        renderApp();
      } finally {
        isBookingInProgress = false;
      }
    }

    async function cancelStudentBookingById(bookingId) {
  const student = getCurrentStudent();
  if (!student || !Array.isArray(student.active_bookings)) return;
  const target = student.active_bookings.find(b => b.id === bookingId);
  if (!target) return;

  // 1. Возвращаем слот в локальное расписание тренера
  releaseBookingEntryFromSchedule(student, target);
  student.active_bookings = student.active_bookings.filter(b => b.id !== bookingId);
  if (uiState.reschedulingBookingId === bookingId) {
    uiState.reschedulingBookingId = null;
  }

  // 2. ВОЗВРАЩАЕМ ЗАНЯТИЕ НА БАЛАНС В UI
  if (student.subscription) {
    student.subscription.remaining = Math.min(
      student.subscription.total,
      (student.subscription.remaining || 0) + 1
    );
  }

  // 3. Синхронизируем возврат с Supabase
  try {
    if (typeof supabaseClient !== 'undefined' && supabaseClient) {
      // Удаляем из таблицы bookings
      await supabaseClient
        .from('bookings')
        .delete()
        .eq('id', bookingId);

      // Уменьшаем used_sessions в subscriptions
      const userRaw = localStorage.getItem('sv_user');
      if (userRaw) {
        const user = JSON.parse(userRaw);
        const { data: sub } = await supabaseClient
          .from('subscriptions')
          .select('*')
          .eq('student_id', user.id)
          .eq('status', 'active')
          .maybeSingle();

        if (sub && sub.used_sessions > 0) {
          await supabaseClient
            .from('subscriptions')
            .update({ used_sessions: sub.used_sessions - 1 })
            .eq('id', sub.id);
        }
      }
    }
  } catch (err) {
    console.warn("Ошибка синхронизации отмены с Supabase:", err);
  }

  saveAppData();
  triggerHaptic('warning');
  showToast('Тренировка отменена. Занятие возвращено на баланс!');
  renderApp();
}

    // П.1: Слайдер подходов (1..8, value=4) и дефолтный 0 в повторах
    function openWorkoutCreator(workoutId = null) {
      triggerHaptic('light');
      const student = getCurrentStudent();
      uiState.workoutEditorOpen = true;
      uiState.editingWorkoutId = workoutId;
      refreshStudentExercisesDatalist();

      if (workoutId) {
        const existing = (student.workouts || []).find(w => w.id === workoutId);
        if (existing) {
          uiState.draftWorkout = JSON.parse(JSON.stringify(existing));
          renderApp();
          window.scrollTo({ top: 0, behavior: 'smooth' });
          return;
        }
      }

      const defaultRows = [];
      for (let i = 0; i < 4; i++) {
        defaultRows.push({
          name: '',
          sets: 4,
          reps: '',
          weight: '',
          video_url: '',
          show_video_input: false
        });
      }

      uiState.draftWorkout = {
        id: 'w-' + Date.now(),
        date: formatShortRuDate(formatISO(getTodayDateObj())),
        title: '',
        student_comment: '',
        trainer_comment: '',
        exercises: defaultRows
      };
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function closeWorkoutCreator() {
      triggerHaptic('light');
      uiState.workoutEditorOpen = false;
      uiState.editingWorkoutId = null;
      uiState.draftWorkout = null;
      renderApp();
    }

    function syncDraftWorkoutFromDOM() {
      if (!uiState.draftWorkout) return;
      const titleEl = document.getElementById('workout-title-input');
      const commentEl = document.getElementById('workout-student-comment');
      if (titleEl) uiState.draftWorkout.title = titleEl.value;
      if (commentEl) uiState.draftWorkout.student_comment = commentEl.value;

      uiState.draftWorkout.exercises.forEach((ex, idx) => {
        const nEl = document.getElementById(`ex-name-${idx}`);
        const sEl = document.getElementById(`ex-sets-${idx}`);
        const rEl = document.getElementById(`ex-reps-${idx}`);
        const wEl = document.getElementById(`ex-weight-${idx}`);
        const vEl = document.getElementById(`ex-video-${idx}`);
        if (nEl) ex.name = nEl.value;
        if (sEl) ex.sets = Number(sEl.value) || 4;
        if (rEl) ex.reps = rEl.value === '' ? '' : Number(rEl.value);
        if (wEl) ex.weight = wEl.value === '' ? '' : Number(wEl.value);
        if (vEl) ex.video_url = vEl.value.trim();
      });
    }

    function updateSetsSliderBadge(idx, val) {
      const badge = document.getElementById(`ex-sets-badge-${idx}`);
      if (badge) badge.textContent = `${val} подх.`;
      if (uiState.draftWorkout && uiState.draftWorkout.exercises[idx]) {
        uiState.draftWorkout.exercises[idx].sets = Number(val);
      }
    }

    function pickWorkoutTitleChip(chipText) {
      triggerHaptic('light');
      syncDraftWorkoutFromDOM();
      if (uiState.draftWorkout) {
        uiState.draftWorkout.title = chipText;
      }
      const titleEl = document.getElementById('workout-title-input');
      if (titleEl) {
        titleEl.value = chipText;
      }
      renderApp();
    }

    function addDraftExerciseRow() {
      triggerHaptic('light');
      syncDraftWorkoutFromDOM();
      if (!uiState.draftWorkout) return;
      uiState.draftWorkout.exercises.push({
        name: '',
        sets: 4,
        reps: '',
        weight: '',
        video_url: '',
        show_video_input: false
      });
      renderApp();
    }

    function removeDraftExerciseRow(idx) {
      triggerHaptic('light');
      syncDraftWorkoutFromDOM();
      if (!uiState.draftWorkout) return;
      if (uiState.draftWorkout.exercises.length <= 1) {
        showToast('В тренировке должно быть хотя бы 1 упражнение', 'error');
        return;
      }
      uiState.draftWorkout.exercises.splice(idx, 1);
      renderApp();
    }

    function toggleExerciseVideoField(idx) {
      triggerHaptic('light');
      syncDraftWorkoutFromDOM();
      if (!uiState.draftWorkout || !uiState.draftWorkout.exercises[idx]) return;
      const row = uiState.draftWorkout.exercises[idx];
      row.show_video_input = !row.show_video_input;
      if (row.show_video_input && !row.video_url) {
        row.video_url = 'https://t.me/step_value_video/set_' + (idx + 1);
      }
      renderApp();
    }

    function saveStudentWorkout() {
      syncDraftWorkoutFromDOM();
      const draft = uiState.draftWorkout;
      if (!draft) return;

      const title = (draft.title || '').trim() || 'Силовая тренировка';
      const validExercises = draft.exercises
        .filter(e => (e.name || '').trim() !== '')
        .map(e => ({
          name: e.name.trim(),
          sets: Math.min(8, Math.max(1, Number(e.sets) || 4)),
          reps: Number(e.reps) || 0,
          weight: Number(e.weight) || 0,
          video_url: (e.video_url || '').trim()
        }));

      if (validExercises.length === 0) {
        showToast('Заполните хотя бы одно упражнение', 'error');
        return;
      }

      const student = getCurrentStudent();
      const savedObj = {
        id: draft.id,
        date: draft.date,
        title: title,
        student_comment: (draft.student_comment || '').trim(),
        trainer_comment: draft.trainer_comment || '',
        exercises: validExercises
      };

      const existingIdx = student.workouts.findIndex(w => w.id === draft.id);
      if (existingIdx >= 0) {
        student.workouts[existingIdx] = savedObj;
      } else {
        student.workouts.push(savedObj);
      }

      saveAppData();
      refreshStudentExercisesDatalist();
      uiState.workoutEditorOpen = false;
      uiState.editingWorkoutId = null;
      uiState.draftWorkout = null;
      triggerHaptic('success');
      showToast('Тренировка сохранена! Новые упражнения добавлены в ваш персональный пул подсказок.');
      renderApp();
    }

    // П.10: Загрузка фото формы со смартфона (Canvas max 1280px, JPEG 0.75, Base64 DataURL, просмотр и удаление)
    function triggerStudentPhotoUpload(angleKey, angleTitle) {
      triggerHaptic('light');
      uiState.pendingPhotoSlotKey = angleKey;
      uiState.pendingPhotoSlotTitle = angleTitle;
      const fileInput = document.getElementById('photo-file-input');

    }

    function compressImageFileToDataUrl(file, maxDim = 1280, quality = 0.75) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let width = img.width;
            let height = img.height;
            if (width > maxDim || height > maxDim) {
              if (width >= height) {
                height = Math.round((height * maxDim) / width);
                width = maxDim;
              } else {
                width = Math.round((width * maxDim) / height);
                height = maxDim;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            const dataUrl = canvas.toDataURL('image/jpeg', quality);
            resolve(dataUrl);
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function handlePhotoFileChange(event) {
      const file = event.target.files && event.target.files[0];
      if (!file || !uiState.pendingPhotoSlotKey) return;
      try {
        const compressedDataUrl = await compressImageFileToDataUrl(file, 1280, 0.75);
        const student = getCurrentStudent();
        const latestReport = student.photo_reports[student.photo_reports.length - 1];
        if (!latestReport) return;

        const key = uiState.pendingPhotoSlotKey;
        const customFlagKey = key.replace('_url', '_custom');
        latestReport[key] = compressedDataUrl;
        latestReport[customFlagKey] = true;

        saveAppData();
        triggerHaptic('success');
        showToast(`Фото «${uiState.pendingPhotoSlotTitle}» сжато (JPEG 0.75) и сохранено!`);
        renderApp();
      } catch (err) {
        showToast('Не удалось обработать изображение', 'error');
      }
    }

      showToast(student.freeze_details.is_frozen

    function setTrainerTab(tabName) {
      triggerHaptic('light');
      uiState.trainerTab = tabName;
      if (tabName === 'schedule') {
        uiState.selectedTrainerStudentId = null;
        uiState.trainerStudentSubscreen = null;
      }
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function selectTrainerScheduleDate(iso) {
      triggerHaptic('light');
      uiState.selectedTrainerScheduleDate = iso;
      renderApp();
    }

    let draftGeneratorSlots = [];
    let draftGeneratorStartH = 9;
    let draftGeneratorEndH = 21;

    function openTrainerSlotGeneratorModal() {
      triggerHaptic('light');
      const iso = uiState.selectedTrainerScheduleDate;
      const existing = appData.schedule_slots[iso] || [];
      draftGeneratorStartH = 9;
      draftGeneratorEndH = 21;
      draftGeneratorSlots = [];

      for (let h = draftGeneratorStartH; h < draftGeneratorEndH; h++) {
        const t = `${String(h).padStart(2, '0')}:00`;
        const found = existing.find(s => s.time === t);
        draftGeneratorSlots.push({
          time: t,
          is_open: found ? found.is_open : true,
          booked_by: found ? found.booked_by : null
        });
      }
      renderTrainerSlotGeneratorModalContent();
    }

    function rebuildDraftGeneratorRange() {
      const sEl = document.getElementById('gen-start-hour');
      const eEl = document.getElementById('gen-end-hour');
      const startH = Math.max(6, Math.min(22, parseInt(sEl ? sEl.value : 9, 10) || 9));
      const endH = Math.max(startH + 1, Math.min(23, parseInt(eEl ? eEl.value : 21, 10) || 21));
      draftGeneratorStartH = startH;
      draftGeneratorEndH = endH;
      draftGeneratorSlots = [];
      for (let h = startH; h < endH; h++) {
        draftGeneratorSlots.push({
          time: `${String(h).padStart(2, '0')}:00`,
          is_open: true,
          booked_by: null
        });
      }
      renderTrainerSlotGeneratorModalContent();
    }

    function toggleDraftGeneratorSlot(idx) {
      triggerHaptic('light');
      const s = draftGeneratorSlots[idx];
      if (!s) return;
      if (s.booked_by) {
        showToast('Этот час уже забронирован подопечным. Отмените бронь в списке дня при необходимости.', 'error');
        return;
      }
      s.is_open = !s.is_open;
      renderTrainerSlotGeneratorModalContent();
    }

    function applyTrainerGeneratedSchedule() {
      const iso = uiState.selectedTrainerScheduleDate;
      appData.schedule_slots[iso] = draftGeneratorSlots.map(s => ({
        time: s.time,
        duration: 60,
        is_open: s.is_open,
        booked_by: s.booked_by
      }));
      saveAppData();
      closeModal();
      triggerHaptic('success');
      showToast(`Расписание на ${formatHumanDate(iso)} опубликовано для подопечных!`);
      renderApp();
    }

    function renderTrainerSlotGeneratorModalContent() {
      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <span class="text-[10px] font-bold uppercase text-[#00E676]">Метод вычёркивания</span>

              <input id="gen-start-hour" type="number" min="6" max="20" value="${draftGeneratorStartH}" onchange="rebuildDraftGeneratorRange()" class="w-full bg-[#161B22] border border-[#30363D] rounded-lg px-2.5 py-1.5 text-xs font-bold text-white" />
            </div>
            <div>
              <label class="block text-[10px] text-[#8B949E] mb-1">Конец дня (ч)</label>

            </div>
          </div>

          <p class="text-[11px] text-[#8B949E]">
            По умолчанию все часы <span class="text-[#00E676] font-bold">зелёные (Свободно)</span>. Тапните по часам отдыха или перерыва — они погаснут:
          </p>

          <div class="grid grid-cols-3 gap-2">
            ${draftGeneratorSlots.map((s, idx) => `
              <button type="button" onclick="toggleDraftGeneratorSlot(${idx})" class="p-2.5 rounded-xl border text-center transition ${
                s.booked_by
                  ? 'bg-[#10B981]/30 border-[#00E676] text-white'
                  : s.is_open
                    ? 'bg-[#10B981]/15 border-[#00E676] text-[#00E676] shadow-neon'

              }">
                <div class="text-xs font-extrabold">${s.time}</div>
                <div class="text-[9px] uppercase mt-0.5">${s.booked_by ? 'Бронь' : (s.is_open ? 'Свободно' : 'Перерыв')}</div>
              </button>
            `).join('')}
          </div>

          <button onclick="applyTrainerGeneratedSchedule()" class="w-full py-3 rounded-xl bg-gradient-to-r from-[#10B981] to-[#00E676] text-[#090C10] font-extrabold text-xs uppercase tracking-wider shadow-neon">
            Применить расписание
          </button>
        </div>
      `);
    }

    function emergencyTrainerCancelBooking(isoDate, studentId, startTime) {
      const st = getStudentById(studentId);
      if (st && Array.isArray(st.active_bookings)) {
        const target = st.active_bookings.find(b => b.date === isoDate && (!startTime || b.time === startTime));
        if (target) {
          releaseBookingEntryFromSchedule(st, target);
          st.active_bookings = st.active_bookings.filter(b => b.id !== target.id);
        } else {
          const daySlots = appData.schedule_slots[isoDate] || [];
          daySlots.forEach(s => {
            if (s.booked_by === studentId) {
              s.booked_by = null;
              s.is_open = true;
            }
          });
          st.active_bookings = st.active_bookings.filter(b => b.date !== isoDate);
        }
      }
      saveAppData();
      triggerHaptic('warning');
      showToast(`Тренировка ${st ? st.full_name : ''} отменена. Окно свободно.`);
      renderApp();
    }

    function toggleSingleTrainerHourQuick(isoDate, timeStr) {
      triggerHaptic('light');
      const daySlots = appData.schedule_slots[isoDate] || [];
      const slot = daySlots.find(s => s.time === timeStr);
      if (!slot || slot.booked_by) return;
      slot.is_open = !slot.is_open;
      saveAppData();
      renderApp();
    }

    function renderTrainerScheduleTab() {
      const upcomingDays = getUpcomingDays(10);
      if (!upcomingDays.some(d => d.iso === uiState.selectedTrainerScheduleDate)) {
        uiState.selectedTrainerScheduleDate = upcomingDays[0].iso;
      }
      const iso = uiState.selectedTrainerScheduleDate;
      const daySlots = appData.schedule_slots[iso] || [];

      const renderedRows = [];
      let i = 0;
      while (i < daySlots.length) {
        const s = daySlots[i];
        if (s.booked_by) {
          const st = getStudentById(s.booked_by);
          let span = 1;
          while (i + span < daySlots.length && daySlots[i + span].booked_by === s.booked_by) {
            span++;
          }
          const startH = parseInt(s.time.split(':')[0], 10);
          const durMins = st ? st.session_duration : span * 60;
          const endTotal = startH * 60 + durMins;
          const endStr = `${String(Math.floor(endTotal / 60)).padStart(2, '0')}:${String(endTotal % 60).padStart(2, '0')}`;
          renderedRows.push({
            type: 'booked',
            startTime: s.time,
            endTime: endStr,
            student: st,
            durationLabel: formatDurationLabel(durMins)
          });
          i += span;
        } else {
          renderedRows.push({
            type: 'slot',
            time: s.time,
            is_open: s.is_open
          });
          i++;
        }
      }

      return `
        <div class="space-y-4 animate-fade">
          <button onclick="openTrainerSlotGeneratorModal()" class="w-full bg-[#10B981] hover:bg-[#059669] text-[#090C10] font-bold py-3.5 px-4 rounded-2xl flex items-center justify-center gap-2.5 text-center text-xs tracking-wider uppercase transition-all shadow-lg shadow-[#10B981]/20">
  <i data-lucide="sliders-horizontal" class="w-4 h-4 shrink-0"></i>
  <span>Настроить доступные часы (метод вычёркивания)</span>
</button>

          <div class="space-y-2">
            <div class="flex items-center justify-between">
              <span class="text-xs font-bold uppercase tracking-wider text-[#8B949E]">Рабочий календарь тренера</span>
              <span class="text-xs font-bold text-[#00E676]">${formatHumanDate(iso)}</span>
            </div>
            <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
              ${upcomingDays.map(d => {
                const isSelected = d.iso === iso;
                const slots = appData.schedule_slots[d.iso] || [];
                const hasBookings = slots.some(s => s.booked_by !== null);
                return `
                  <button onclick="selectTrainerScheduleDate('${d.iso}')" class="shrink-0 w-[62px] py-2.5 rounded-xl border ${isSelected ? 'bg-[#10B981] text-[#090C10] border-[#00E676] shadow-neon font-extrabold' : 'bg-[#161B22] text-white border-[#30363D]'} flex flex-col items-center justify-center transition">
                    <span class="text-[10px] uppercase ${isSelected ? 'text-[#090C10]/80 font-bold' : 'text-[#8B949E]'}">${d.isToday ? 'Сег' : d.dayShort}</span>
                    <span class="text-base font-extrabold my-0.5">${d.dayNum}</span>
                    <span class="text-[10px] ${isSelected ? 'text-[#090C10]/80' : 'text-[#8B949E]'}">${d.monthShort}</span>
                    ${hasBookings ? `<span class="w-1.5 h-1.5 rounded-full ${isSelected ? 'bg-[#090C10]' : 'bg-[#00E676]'} mt-1"></span>` : ''}
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          <div class="bg-[#161B22] border border-[#30363D] rounded-2xl p-4 space-y-2.5">
            <div class="flex items-center justify-between mb-1">
              <h3 class="text-sm font-bold text-white">Почасовая сетка дня</h3>
              <span class="text-[11px] text-[#8B949E]">Тап по свободному слоту меняет статус</span>
            </div>

            ${renderedRows.map(row => {
              if (row.type === 'booked' && row.student) {
                return `
                  <div class="p-3.5 rounded-xl bg-[#0D1117] border-2 border-[#00E676] shadow-neon flex items-center justify-between gap-2">
                    <div class="space-y-0.5">
                      <div class="text-xs font-extrabold text-[#00E676]">
                        ${row.startTime} – ${row.endTime} • ${row.student.full_name} (${row.durationLabel})
                      </div>
                      <div class="text-[11px] text-[#8B949E]">
                        Остаток абонемента: ${row.student.subscription.remaining} из ${row.student.subscription.total}
                      </div>
                    </div>
                    <button onclick="emergencyTrainerCancelBooking('${iso}', '${row.student.id}', '${row.startTime}')" class="px-2.5 py-1.5 rounded-lg bg-red-950/60 hover:bg-red-900 border border-red-500/40 text-[11px] font-bold text-red-300 shrink-0 transition">
                      Отменить
                    </button>
                  </div>
                `;
              }
              return `
                <div onclick="toggleSingleTrainerHourQuick('${iso}', '${row.time}')" class="p-3 rounded-xl border cursor-pointer flex items-center justify-between transition ${
                  row.is_open
                    ? 'bg-[#0D1117] border-[#30363D] hover:border-[#10B981]'
                    : 'bg-[#090C10]/60 border-[#30363D]/40 opacity-60'
                }">
                  <div class="flex items-center gap-3">
                    <span class="text-xs font-extrabold ${row.is_open ? 'text-white' : 'text-[#8B949E] line-through'}">${row.time}</span>
                    <span class="text-xs ${row.is_open ? 'text-[#00E676] font-semibold' : 'text-[#8B949E]'}">
                      ${row.is_open ? 'Свободно для записи' : 'Занят / Перерыв'}
                    </span>

            }).join('')}
          </div>
        </div>
      `;

    function generateFreeStudentAccessCode() {
      const existingCodes = new Set((appData.students || []).map(s => (s.access_code || '').toUpperCase()));
      let num = 104;
      while (existingCodes.has(`STEP-${num}`)) {
        num++;
      }
      return `STEP-${num}`;
    }

    function handleNewStudentCodeInput(inputEl) {
      if (!inputEl) return;
      const start = inputEl.selectionStart;
      const oldVal = inputEl.value;
      const cleaned = oldVal.toUpperCase().replace(/[^A-Z0-9_-]/g, '');
      if (oldVal !== cleaned) {
        inputEl.value = cleaned;
        try { inputEl.setSelectionRange(start, start); } catch (e) {}
      }
      const errEl = document.getElementById('new-st-code-error');
      const isTaken = (appData.students || []).some(s => (s.access_code || '').toUpperCase() === cleaned && cleaned !== '');
      if (errEl) {
        if (isTaken) {
          errEl.classList.remove('hidden');
        } else {
          errEl.classList.add('hidden');
        }
      }
    }

    function copyTextSafe(text) {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text);
        } else {
          const ta = document.createElement('textarea');
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          ta.remove();
        }
      } catch (e) {}
    }

      const nameEl = document.getElementById('new-st-name');

      const inviteMsg = `Привет, ${fio}! Твой персональный код доступа в приложение Step Value: ${rawCode}`;
      copyTextSafe(inviteMsg);

    async function createNewStudentRecord() {
      const nameEl = document.getElementById('new-st-name');
      const userEl = document.getElementById('new-st-username');
      const packEl = document.getElementById('new-st-pack');
      const durEl = document.getElementById('new-st-dur');
      const codeEl = document.getElementById('new-st-code');

      const customCode = (codeEl ? codeEl.value.trim().toUpperCase().replace(/[^A-Z0-9_-]/g, '') : '');
      if (!customCode) {
        showToast('Укажите персональный код доступа!', 'error');
        if (codeEl) codeEl.focus();
        return;
      }

      const duplicate = (appData.students || []).some(s => (s.access_code || '').toUpperCase() === customCode);
      if (duplicate) {
        const errEl = document.getElementById('new-st-code-error');
        if (errEl) errEl.classList.remove('hidden');
        showToast(`Код «${customCode}» уже занят другим подопечным! Задайте уникальный код.`, 'error');
        if (codeEl) codeEl.focus();
        return;
      }

      const fio = (nameEl ? nameEl.value.trim() : '') || 'Новый Подопечный';
      const cleanUser = (userEl ? userEl.value.trim() : '').replace(/^@/, '');
      const pack = Math.max(1, parseInt(packEl ? packEl.value : 12, 10) || 12);
      const dur = parseInt(durEl ? durEl.value : 120, 10) || 120;
      const parts = fio.split(' ');
      const initials = ((parts[0] ? parts[0][0] : 'А') + (parts[1] ? parts[1][0] : 'В')).toUpperCase();
      let assignedId = 'step-' + Date.now();
      let createdSubId = null;

      // 1. Создаем пользователя в облаке Supabase (если клиент доступен)
      if (typeof supabaseClient !== 'undefined' && supabaseClient) {
        try {
          const { data: newUser, error: userErr } = await supabaseClient
            .from('users')
            .insert([{
              telegram_id: Date.now(),
              first_name: parts[0] || fio,
              last_name: parts.slice(1).join(' ') || '',
              username: cleanUser || customCode.toLowerCase(),
              role: 'student'
            }])
            .select()
            .single();

          if (newUser && newUser.id) {
            assignedId = newUser.id;
            const { data: newSub } = await supabaseClient
              .from('subscriptions')
              .insert([{
                student_id: newUser.id,
                total_sessions: pack,
                used_sessions: 0,
                session_duration_minutes: dur,
                billing_day: 5,
                status: 'active'
              }])
              .select()
              .single();

            if (newSub) createdSubId = newSub.id;
          }
        } catch (err) {
          console.warn('Ошибка сохранения нового ученика в Supabase:', err);
        }
      }

      const newStudent = {
        id: assignedId,
        supabase_id: assignedId,
        access_code: customCode,
        telegram_username: cleanUser,
        full_name: fio,
        avatar: initials,
        status: 'active',
        freeze_details: { is_frozen: false, from: '2026-11-01', to: '2026-11-15' },
        session_duration: dur,
        subscription: {
          id: createdSubId,
          total: pack,
          total_sessions: pack,
          used: 0,
          used_sessions: 0,
          remaining: pack,
          payment_day: 5,
          robokassa_sum: '24 000 ₽',
          robokassa_url: 'https://auth.robokassa.ru/Merchant/Index.aspx?MerchantLogin=StepValueCoach&OutSum=24000'
        },
        payment_history: [
          { date: formatDotDate(formatISO(getTodayDateObj())), count: pack, amount: '24 000 ₽', status: 'Оплачено' }
        ],
        medical_notes: 'Ограничений пока не указано',
        trainer_private_notes: '',
        notification_settings: { workout_reminder: '2h', sunday_checkup: true, monthly_inbody_photos: true },
        workouts: [],
        anthropometry: [
          { date: formatDotDate(formatISO(getTodayDateObj())), chest: 100, waist: 80, arms: 36 }
        ],
        checkups: [],
        inbody: [
          enrichInBodyRecord({ date: formatDotDate(formatISO(getTodayDateObj())), muscle_mass: 35.0, body_fat_pct: 16.0, water: 46.0, weight: 78.0 })
        ],
        photo_reports: [
          {
            date: 'Октябрь 2026',
            front_url: createSilhouetteDataUri('Октябрь 2026', 'СПЕРЕДИ', 6, 2, '#00E676'),
            side_url: createSilhouetteDataUri('Октябрь 2026', 'СБОКУ', 6, 2, '#00E676'),
            back_url: createSilhouetteDataUri('Октябрь 2026', 'СЗАДИ', 6, 2, '#00E676'),
            front_custom: false,
            side_custom: false,
            back_custom: false
          }
        ],
        active_bookings: []
      };

      appData.students.push(newStudent);
      saveAppData();
      copyInviteCode(customCode);
      closeModal();
      showToast(`Подопечный ${fio} создан и сохранён в облаке!`);
      renderApp();
    }

    function adjustStudentRemainingBalance(studentId, delta) {
      const st = getStudentById(studentId);
      if (!st || !st.subscription) return;
      const total = Math.max(1, Number(st.subscription.total_sessions || st.subscription.total) || 12);
      let currentUsed = Math.min(total, Math.max(0, Number(st.subscription.used_sessions ?? st.subscription.used) || 0));
      // delta > 0 (+1 к остатку) означает уменьшение used
      // delta < 0 (-1 от остатка) означает увеличение used
      currentUsed = Math.max(0, Math.min(total, currentUsed - delta));
      const remaining = Math.max(0, total - currentUsed);

      st.subscription.total = total;
      st.subscription.total_sessions = total;
      st.subscription.used = currentUsed;
      st.subscription.used_sessions = currentUsed;
      st.subscription.remaining = remaining;

      if (typeof supabaseClient !== 'undefined' && supabaseClient && st.subscription.id) {
        supabaseClient
          .from('subscriptions')
          .update({ used_sessions: currentUsed })
          .eq('id', st.subscription.id)
          .then();
      }

      saveAppData();
      triggerHaptic('light');
      showToast(`Баланс: осталось ${remaining} из ${total}`);
      renderApp();
    }

    function updateStudentTotalSubscription(studentId, totalVal) {
      const st = getStudentById(studentId);
      if (!st || !st.subscription) return;
      const newTotal = Math.max(1, parseInt(totalVal, 10) || 12);
      let currentUsed = Math.min(newTotal, Math.max(0, Number(st.subscription.used_sessions ?? st.subscription.used) || 0));
      const remaining = Math.max(0, newTotal - currentUsed);

      st.subscription.total = newTotal;
      st.subscription.total_sessions = newTotal;
      st.subscription.used = currentUsed;
      st.subscription.used_sessions = currentUsed;
      st.subscription.remaining = remaining;

      if (typeof supabaseClient !== 'undefined' && supabaseClient && st.subscription.id) {
        supabaseClient
          .from('subscriptions')
          .update({ total_sessions: newTotal, used_sessions: currentUsed })
          .eq('id', st.subscription.id)
          .then();
      }

      saveAppData();
      showToast(`Пакет обновлён: ${remaining} из ${newTotal} занятий`);
      renderApp();
    }

    function formatRublesFromNumber(numVal) {
      const cleanNum = Math.max(0, Math.round(Number(numVal) || 0));
      return cleanNum.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' ₽';
    }

    function parseNumericRubles(strVal) {
      const digits = String(strVal ?? '').replace(/[^\d]/g, '');
      return digits ? parseInt(digits, 10) : 0;
    }

      const st = getStudentById(studentId);

      const tgEl = document.getElementById('tr-mgmt-tg-username');

      const urlEl = document.getElementById('tr-mgmt-robokassa-url');
      const notesEl = document.getElementById('tr-mgmt-private-notes');
      if (tgEl) st.telegram_username = tgEl.value.trim().replace(/^@/, '');
      const rawNum = sumEl ? Math.max(0, parseInt(sumEl.value, 10) || 0) : parseNumericRubles(st.subscription.robokassa_sum);
      st.subscription.robokassa_sum = formatRublesFromNumber(rawNum);
      if (urlEl) {
        let updatedUrl = urlEl.value.trim();
        if (/OutSum=\d+/i.test(updatedUrl)) {
          updatedUrl = updatedUrl.replace(/OutSum=\d+/i, `OutSum=${rawNum}`);

        st.subscription.robokassa_url = updatedUrl;

      if (notesEl) st.trainer_private_notes = notesEl.value.trim();
      saveAppData();
      triggerHaptic('success');
      showToast('Контакт @username, настройки оплаты и заметка сохранены!');

    }
