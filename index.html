        ];
        const numericSum = parseNumericRubles(st.subscription.robokassa_sum);
        return `
          <div class="space-y-4 animate-fade">
            ${topStudentHeader}

            <div class="bg-[#161B22] border border-[#30363D] rounded-2xl p-4 space-y-3">
              <h3 class="text-xs font-bold uppercase tracking-wider text-[#00E676]">1. Баланс занятий</h3>
              <div class="grid grid-cols-2 gap-3 items-center">
                <div>
                  <label class="block text-[11px] text-[#8B949E] mb-1">Пакет тренировок (всего)</label>
                  <input type="number" min="1" max="100" value="${st.subscription.total}" onchange="updateStudentTotalSubscription('${st.id}', this.value)" class="w-full bg-[#090C10] border border-[#30363D] rounded-xl px-3 py-2 text-sm font-extrabold text-white" />
                </div>
                <div>
                  <span class="block text-[11px] text-[#8B949E] mb-1">Текущий остаток: <strong class="text-[#00E676]">${st.subscription.remaining}</strong></span>
                  <div class="flex gap-2">
                    <button onclick="adjustStudentRemainingBalance('${st.id}', -1)" class="flex-1 py-2 rounded-xl bg-[#0D1117] hover:bg-red-950/40 border border-[#30363D] text-xs font-extrabold text-white">-1</button>
                    <button onclick="adjustStudentRemainingBalance('${st.id}', 1)" class="flex-1 py-2 rounded-xl bg-[#10B981] text-[#090C10] text-xs font-extrabold shadow-neon">+1</button>
                  </div>
                </div>
              </div>
            </div>

            <div class="bg-[#161B22] border border-[#30363D] rounded-2xl p-4 space-y-2.5">
              <h3 class="text-xs font-bold uppercase tracking-wider text-[#00E676]">2. Персональная длительность тренировки</h3>
              <p class="text-[11px] text-[#8B949E]">Под эту настройку автоматически фильтруются свободные окна у подопечного:</p>
              <div class="grid grid-cols-4 gap-2">
                ${durations.map(d => `
                  <button onclick="setStudentSessionDuration('${st.id}', ${d.mins})" class="py-2.5 rounded-xl text-xs font-extrabold border transition ${
                    Number(st.session_duration) === d.mins
                      ? 'bg-[#10B981] text-[#090C10] border-[#00E676] shadow-neon'
                      : 'bg-[#0D1117] text-white border-[#30363D] hover:bg-[#1F242C]'
                  }">${d.label}</button>
                `).join('')}
              </div>
            </div>

            <div class="bg-[#161B22] border border-[#30363D] rounded-2xl p-4 space-y-3">
              <div class="flex items-center justify-between">
                <h3 class="text-xs font-bold uppercase tracking-wider text-[#00E676]">3. Контакт Telegram и оплата</h3>
                <span class="text-[11px] text-[#8B949E]">День счёта: <strong class="text-white">${st.subscription.payment_day}-е число</strong></span>
              </div>
              <div>
                <label class="block text-[11px] text-[#8B949E] mb-1">Индивидуальный день выставления счёта (только для тренера)</label>
                <select id="tr-mgmt-payment-day" onchange="updateStudentPaymentDay('${st.id}', this.value)" class="w-full bg-[#090C10] border border-[#30363D] focus:border-[#00E676] rounded-xl px-3 py-2 text-xs font-bold text-white outline-none">
                  ${Array.from({ length: 28 }, (_, idx) => idx + 1).map(d => `<option value="${d}" ${Number(st.subscription.payment_day) === d ? 'selected' : ''}>${d}-е число месяца</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="block text-[11px] text-[#8B949E] mb-1">Персональный код доступа (неизменяемый)</label>
                <input type="text" value="${st.access_code}" readonly class="w-full bg-[#090C10]/60 border border-[#30363D] rounded-xl px-3 py-2 text-xs font-extrabold text-[#00E676] tracking-wider opacity-80 cursor-not-allowed outline-none" />
              </div>
              <div>
                <label class="block text-[11px] text-[#8B949E] mb-1">Telegram @username подопечного (для голосовых ответов)</label>
                <input id="tr-mgmt-tg-username" type="text" value="${st.telegram_username || ''}" placeholder="Например: alex_voronov" class="w-full bg-[#090C10] border border-[#30363D] focus:border-[#00E676] rounded-xl px-3 py-2 text-xs font-bold text-white outline-none" />
              </div>
              <div>
                <label class="block text-[11px] text-[#8B949E] mb-1">Сумма к оплате</label>
                <div class="relative flex items-center">
                  <input id="tr-mgmt-robokassa-sum" type="number" min="0" step="500" value="${numericSum}" class="w-full bg-[#090C10] border border-[#30363D] focus:border-[#00E676] rounded-xl pl-3 pr-9 py-2 text-xs font-bold text-white outline-none" />
                  <span class="absolute right-4 pointer-events-none text-[#8B949E] font-bold">₽</span>
                </div>
              </div>
              <div>
                <label class="block text-[11px] text-[#8B949E] mb-1">Персональная ссылка на оплату абонемента</label>
                <input id="tr-mgmt-robokassa-url" type="text" value="${st.subscription.robokassa_url}" class="w-full bg-[#090C10] border border-[#30363D] rounded-xl px-3 py-2 text-xs text-white" />
              </div>
            </div>

            <div class="bg-[#161B22] border border-[#30363D] rounded-2xl p-4 space-y-2">
              <h3 class="text-xs font-bold uppercase tracking-wider text-[#00E676] flex items-center gap-1.5">
                <i data-lucide="heart-pulse" class="w-4 h-4 text-[#00E676]"></i>
                <span>4. ОГРАНИЧЕНИЯ ПО ЗДОРОВЬЮ</span>
              </h3>
              <p class="text-xs text-white bg-[#0D1117] p-3 rounded-xl border border-[#30363D]">
                ${st.medical_notes || 'Ограничений не указано'}
              </p>
            </div>

            <div class="bg-[#161B22] border border-[#30363D] rounded-2xl p-4 space-y-2.5">
              <div class="flex items-center justify-between">
                <h3 class="text-xs font-bold uppercase tracking-wider text-[#00E676]">5. Скрытая заметка тренера</h3>
                <span class="text-[10px] text-[#8B949E]">Видите только вы</span>
              </div>
              <textarea id="tr-mgmt-private-notes" rows="3" placeholder="Цели, психология, особенности режима клиента..." class="w-full bg-[#090C10] border border-[#30363D] focus:border-[#00E676] rounded-xl p-3 text-xs text-white outline-none resize-none">${st.trainer_private_notes || ''}</textarea>
              <button onclick="saveTrainerManagementFinanceAndNotes('${st.id}')" class="w-full py-3 rounded-xl bg-gradient-to-r from-[#10B981] to-[#00E676] text-[#090C10] font-extrabold text-xs uppercase tracking-wider shadow-neon">
                Сохранить параметры и заметку
              </button>
            </div>
          </div>
        `;
      }

      return renderTrainerStudentPage(st, topStudentHeader);
    }

    function renderTrainerStudentPage(st, topStudentHeader) {
      return `
        <div class="space-y-4 animate-fade">
          ${topStudentHeader}

          <div class="space-y-2.5 pt-1">
            <button onclick="openTrainerStudentSubscreen('workouts')" class="w-full text-left bg-[#161B22] hover:bg-[#1F242C] border border-[#30363D] hover:border-[#00E676] rounded-2xl px-4 py-3.5 flex items-center justify-between gap-3.5 transition group shadow-lg">
              <div class="w-10 h-10 rounded-xl bg-[#0D1117] border border-[#30363D] group-hover:border-[#00E676] flex items-center justify-center text-[#00E676] shrink-0">
                <i data-lucide="dumbbell" class="w-5 h-5"></i>
              </div>
              <h3 class="flex-1 text-sm font-extrabold text-white group-hover:text-[#00E676] transition">1. Тренировки</h3>
              <i data-lucide="chevron-right" class="w-5 h-5 text-[#8B949E] group-hover:text-[#00E676] shrink-0"></i>
            </button>

            <button onclick="openTrainerStudentSubscreen('reports_hub')" class="w-full text-left bg-[#161B22] hover:bg-[#1F242C] border border-[#30363D] hover:border-[#00E676] rounded-2xl px-4 py-3.5 flex items-center justify-between gap-3.5 transition group shadow-lg">
              <div class="w-10 h-10 rounded-xl bg-[#0D1117] border border-[#30363D] group-hover:border-[#00E676] flex items-center justify-center text-[#00E676] shrink-0">
                <i data-lucide="bar-chart-3" class="w-5 h-5"></i>
              </div>
              <h3 class="flex-1 text-sm font-extrabold text-white group-hover:text-[#00E676] transition">2. Отчёты и прогресс</h3>
              <i data-lucide="chevron-right" class="w-5 h-5 text-[#8B949E] group-hover:text-[#00E676] shrink-0"></i>
            </button>

            <button onclick="openTrainerStudentSubscreen('management')" class="w-full text-left bg-[#161B22] hover:bg-[#1F242C] border border-[#30363D] hover:border-[#00E676] rounded-2xl px-4 py-3.5 flex items-center justify-between gap-3.5 transition group shadow-lg">
              <div class="w-10 h-10 rounded-xl bg-[#0D1117] border border-[#30363D] group-hover:border-[#00E676] flex items-center justify-center text-[#00E676] shrink-0">
                <i data-lucide="settings-2" class="w-5 h-5"></i>
              </div>
              <h3 class="flex-1 text-sm font-extrabold text-white group-hover:text-[#00E676] transition">3. Управление и баланс</h3>
              <i data-lucide="chevron-right" class="w-5 h-5 text-[#8B949E] group-hover:text-[#00E676] shrink-0"></i>
            </button>
          </div>
        </div>
      `;
    }

    function initReportChartsIfNeeded() {
      if (!window.Chart) return;
      const student = getCurrentStudent();
      if (!student) return;

      const inbodyCanvas = document.getElementById('chart-inbody-params');
      if (inbodyCanvas) {
        const list = (student.inbody || []).map(enrichInBodyRecord);
        const labels = list.map(i => i.date.slice(0, 5));
        activeCharts.inbodyChart = new Chart(inbodyCanvas.getContext('2d'), {
          type: 'line',
          data: {
            labels,
            datasets: [
              {
                label: 'Мышцы (кг)',
                data: list.map(i => i.muscle_mass),
                borderColor: '#00E676',
                backgroundColor: 'transparent',
                borderWidth: 2.5,
                tension: 0.3
              },
              {
                label: 'Жир (%)',
                data: list.map(i => i.body_fat_pct),
                borderColor: '#F59E0B',
                backgroundColor: 'transparent',
                borderWidth: 2.5,
                tension: 0.3
              },
              {
                label: 'Вода (л)',
                data: list.map(i => i.water),
                borderColor: '#38BDF8',
                backgroundColor: 'transparent',
                borderWidth: 2,
                tension: 0.3
              },
              {
                label: 'Вес (кг)',
                data: list.map(i => i.weight),
                borderColor: '#A855F7',
                backgroundColor: 'transparent',
                borderWidth: 2,
                tension: 0.3
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { labels: { color: '#FFFFFF', boxWidth: 12, font: { size: 10 } } } },
            scales: {
              x: { ticks: { color: '#8B949E' }, grid: { color: '#30363D44' } },
              y: { ticks: { color: '#8B949E' }, grid: { color: '#30363D44' } }
            }
          }
        });
      }
    }

    // П.13: Очистка таббара тренера (чистые подписи «Расписание» и «Подопечные» без «1.» и «2.»)
    function renderBottomTabBar() {
      const nav = document.getElementById('app-tabbar');
      if (!appData.current_role || (appData.current_role === 'student' && uiState.workoutEditorOpen)) {
        nav.classList.add('hidden');
        nav.innerHTML = '';
        return;
      }
      nav.classList.remove('hidden');

      if (appData.current_role === 'student') {
        const tabs = [
          { id: 'booking', label: 'Бронирование', icon: 'calendar-clock' },
          { id: 'workouts', label: 'Тренировки', icon: 'dumbbell' },
          { id: 'reports', label: 'Отчёты', icon: 'line-chart' },
          { id: 'profile', label: 'Профиль', icon: 'user' }
        ];
        nav.innerHTML = `
          <div class="grid grid-cols-4 gap-1 px-2 py-2">
            ${tabs.map(t => {
              const active = uiState.studentTab === t.id;
              return `
                <button onclick="setStudentTab('${t.id}')" class="py-1.5 rounded-xl flex flex-col items-center justify-center gap-1 transition ${
                  active ? 'text-[#00E676] bg-[#1F242C] border border-[#10B981]/40 shadow-neon' : 'text-[#8B949E] hover:text-white'
                }">
                  <i data-lucide="${t.icon}" class="w-4 h-4"></i>
                  <span class="text-[10px] font-bold">${t.label}</span>
                </button>
              `;
            }).join('')}
          </div>
        `;
      } else if (appData.current_role === 'trainer') {
        const tabs = [
          { id: 'schedule', label: 'Расписание', icon: 'calendar-range' },
          { id: 'students', label: 'Подопечные', icon: 'users' }
        ];
        nav.innerHTML = `
          <div class="grid grid-cols-2 gap-2 px-3 py-2">
            ${tabs.map(t => {
              const active = uiState.trainerTab === t.id;
              return `
                <button onclick="setTrainerTab('${t.id}')" class="py-2 rounded-xl flex items-center justify-center gap-2 transition ${
                  active ? 'text-[#090C10] bg-gradient-to-r from-[#10B981] to-[#00E676] font-extrabold shadow-neon' : 'text-[#8B949E] bg-[#0D1117] border border-[#30363D] hover:text-white font-bold'
                }">
                  <i data-lucide="${t.icon}" class="w-4 h-4"></i>
                  <span class="text-xs">${t.label}</span>
                </button>
              `;
            }).join('')}
          </div>
        `;
      }
    }

    function renderHeader() {
      const badge = document.getElementById('header-role-badge');
      const subtitle = document.getElementById('header-subtitle');
      if (!badge) return;

      if (!appData.current_role) {
        badge.textContent = 'АВТОРИЗАЦИЯ';
        if (subtitle) {
          subtitle.textContent = '';
          subtitle.classList.add('hidden');
        }
      } else if (appData.current_role === 'student') {
        const st = getCurrentStudent();
        badge.textContent = 'ПОДОПЕЧНЫЙ';
        if (subtitle) {
          subtitle.textContent = st ? st.full_name : 'Личный кабинет';
          subtitle.classList.remove('hidden');
        }
      } else {
        badge.textContent = 'ТРЕНЕР';
        if (subtitle) {
          subtitle.textContent = '';
          subtitle.classList.add('hidden');
        }
      }
    }
    const updateHeaderBadge = renderHeader;

    function renderApp() {
      destroyAllCharts();
      updateHeaderBadge();
      renderBottomTabBar();

      const main = document.getElementById('app-main');
      if (!appData.current_role) {
        main.innerHTML = renderOnboardingScreen();
      } else if (appData.current_role === 'student') {
        if (uiState.studentTab === 'booking') main.innerHTML = renderStudentBookingTab();
        else if (uiState.studentTab === 'workouts') main.innerHTML = renderStudentWorkoutsTab();
        else if (uiState.studentTab === 'reports') main.innerHTML = renderStudentReportsTab();
        else if (uiState.studentTab === 'profile') main.innerHTML = renderStudentProfileTab();
      } else if (appData.current_role === 'trainer') {
        if (uiState.trainerTab === 'schedule') main.innerHTML = renderTrainerScheduleTab();
        else main.innerHTML = renderTrainerStudentsTab();
      }

      if (window.lucide) {
        lucide.createIcons();
      }
      initReportChartsIfNeeded();
    }

    window.addEventListener('DOMContentLoaded', async () => {
      initTelegramSDK();
      initTapToDismissKeyboard();
      loadAppData();

      renderApp();

      // Фоновая облачная синхронизация единого списка подопечных и их балансов
      syncAllStudentsFromSupabase();

      if (appData.current_role) {
        const activeStudent = appData.current_role === 'student' ? getCurrentStudent() : null;
        await getOrCreateSupabaseUser(
          appData.current_role === 'trainer' ? 'coach' : 'student',
          { autoEnter: true, student: activeStudent }
        );
      }
    });
  </script>
</body>
</html>
