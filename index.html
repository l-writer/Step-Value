    let draftGeneratorEndH = 21;

    function openTrainerSlotGeneratorModal() {
      triggerHaptic('light');
      const iso = uiState.selectedTrainerScheduleDate;
      const existing = appData.schedule_slots[iso] || [];
      draftGeneratorStartH = existing.length > 0 ? (parseInt(existing[0].time.split(':')[0], 10) || 9) : 9;
      draftGeneratorEndH = existing.length > 0 ? ((parseInt(existing[existing.length - 1].time.split(':')[0], 10) || 20) + 1) : 21;
      draftGeneratorSlots = [];

      for (let h = draftGeneratorStartH; h < draftGeneratorEndH; h++) {
        const t = `${String(h).padStart(2, '0')}:00`;
        const found = existing.find(s => s.time === t);
        const bookedBy = found ? (found.booked_by || null) : null;
        const isOpen = bookedBy ? true : (found ? Boolean(found.is_open) : true);
        draftGeneratorSlots.push({
          time: t,
          is_open: isOpen,
          baseline_closed: found ? (found.baseline_closed !== undefined ? Boolean(found.baseline_closed) : !isOpen) : false,
          booked_by: bookedBy
        });
      }
      renderTrainerSlotGeneratorModalContent();
    }

    function rebuildDraftGeneratorRange() {
      const sEl = document.getElementById('gen-start-hour');
      const eEl = document.getElementById('gen-end-hour');
      const startH = Math.max(6, Math.min(22, parseInt(sEl ? sEl.value : 9, 10) || 9));
      const endH = Math.max(startH + 1, Math.min(23, parseInt(eEl ? eEl.value : 21, 10) || 21));
      const iso = uiState.selectedTrainerScheduleDate;
      const existingDaySlots = appData.schedule_slots[iso] || [];
      const prevMap = new Map();
      existingDaySlots.forEach(s => prevMap.set(s.time, s));
      draftGeneratorSlots.forEach(s => prevMap.set(s.time, s));

      draftGeneratorStartH = startH;
      draftGeneratorEndH = endH;
      draftGeneratorSlots = [];
      for (let h = startH; h < endH; h++) {
        const timeStr = `${String(h).padStart(2, '0')}:00`;
        const prev = prevMap.get(timeStr);
        const bookedBy = prev ? (prev.booked_by || null) : null;
        const isOpen = bookedBy ? true : (prev ? Boolean(prev.is_open) : true);
        draftGeneratorSlots.push({
          time: timeStr,
          is_open: isOpen,
          baseline_closed: prev ? (prev.baseline_closed !== undefined ? Boolean(prev.baseline_closed) : !isOpen) : false,
          booked_by: bookedBy
        });
      }
      renderTrainerSlotGeneratorModalContent();
    }

    function toggleDraftGeneratorSlot(idx) {
      triggerHaptic('light');
      const s = draftGeneratorSlots[idx];
      if (!s) return;
      if (s.booked_by) {
        showToast('Этот час уже забронирован подопечным. Отмените бронь в списке дня при необходимости.', 'error');
        return;
      }
      s.is_open = !s.is_open;
      s.baseline_closed = !s.is_open;
      renderTrainerSlotGeneratorModalContent();
    }

    async function applyTrainerGeneratedSchedule() {
      const iso = uiState.selectedTrainerScheduleDate;
      const existingDaySlots = appData.schedule_slots[iso] || [];
      const newSlots = draftGeneratorSlots.map(s => ({
        time: s.time,
        duration: 60,
        is_open: s.booked_by ? true : Boolean(s.is_open),
        baseline_closed: s.booked_by ? Boolean(s.baseline_closed) : !Boolean(s.is_open),
        booked_by: s.booked_by || null
      }));

      existingDaySlots.forEach(oldSlot => {
        if (oldSlot.booked_by && !newSlots.some(ns => ns.time === oldSlot.time)) {
          newSlots.push({
            time: oldSlot.time,
            duration: oldSlot.duration || 60,
            is_open: true,
            baseline_closed: Boolean(oldSlot.baseline_closed),
            booked_by: oldSlot.booked_by
          });
        }
      });
      newSlots.sort((a, b) => a.time.localeCompare(b.time));

      appData.schedule_slots[iso] = newSlots;
      await persistScheduleSlotsToSupabase();
      closeModal();
      renderApp();

      showToast(`Расписание на ${formatHumanDate(iso)} сохранено в облаке!`);

    async function emergencyTrainerCancelBooking(isoDate, studentId, startTime) {
      const st = getStudentById(studentId);
      let cancelledBookingId = null;
      if (st && Array.isArray(st.active_bookings)) {
        const target = st.active_bookings.find(b => b.date === isoDate && (!startTime || b.time === startTime));
        if (target) {
          cancelledBookingId = target.id;
          releaseBookingEntryFromSchedule(st, target);
          st.active_bookings = st.active_bookings.filter(b => b.id !== target.id);
        } else {
          const daySlots = appData.schedule_slots[isoDate] || [];
          daySlots.forEach(s => {
            if (String(s.booked_by) === String(studentId) || (st && String(s.booked_by) === String(st.id))) {
              s.booked_by = null;
              if (s.baseline_closed) {
                s.is_open = false;
              }
            }
          });
          st.active_bookings = st.active_bookings.filter(b => b.date !== isoDate);
        }
        if (st.subscription) {
          const total = Math.max(0, Number(st.subscription.total) || 0);
          const used = Math.max(0, (Number(st.subscription.used) || 0) - 1);
          st.subscription.used = used;
          st.subscription.used_sessions = used;
          st.subscription.remaining = Math.max(0, total - used);
        }
      }
      ensureSupabaseClient();
      if (supabaseClient) {
        try {
          if (cancelledBookingId && !String(cancelledBookingId).startsWith('bk-')) {
            await supabaseClient.from('bookings').delete().eq('id', cancelledBookingId);
          } else if (st) {
            const safeNumericId = toValidNumericIdOrNull(st.supabase_id || st.id);
            if (safeNumericId) {
              let delQ = supabaseClient.from('bookings').delete().eq('student_id', safeNumericId).eq('session_date', isoDate);
              if (startTime) delQ = delQ.eq('session_time', startTime);
              await delQ;
            }
          }
          if (st) await persistStudentToSupabase(st);
          await persistScheduleSlotsToSupabase();
        } catch (e) {
          console.warn('Ошибка отмены бронирования тренером в Supabase:', e);
        }
      }
      renderApp();
      triggerHaptic('warning');
      showToast(`Тренировка ${st ? st.full_name : ''} отменена. Занятие возвращено на баланс.`);
    }

function copyInviteCode(code, name = '') {

      if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {

        }).catch(() => {

    function fallbackCopyText(text) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        const successful = document.execCommand('copy');
        document.body.removeChild(ta);
        if (successful) {
          showToast('Код доступа скопирован в буфер!');
        } else {
          showToast(`Код доступа: ${text}`);
        }
      } catch (e) {
        showToast(`Код доступа: ${text}`);
      }
    }

        const packEl = document.getElementById('new-st-pack');

        if (!customCode) {

          if (codeEl) codeEl.focus();

        }

        const duplicate = (appData.students || []).some(s => (s.access_code || '').toUpperCase() === customCode);
        if (duplicate) {

          if (errEl) errEl.classList.remove('hidden');

        const fio = (nameEl ? nameEl.value.trim() : '') || 'Новый Подопечный';
        const cleanUser = (userEl ? userEl.value.trim() : '').replace(/^@/, '');
        
        const rawPrice = priceEl ? parseFloat(priceEl.value) : 0;
        const price = isNaN(rawPrice) ? 0 : Math.max(0, rawPrice);
        
        const rawPack = packEl ? parseInt(packEl.value, 10) : 0;
        const pack = isNaN(rawPack) ? 0 : Math.max(0, rawPack);
        
        const dur = parseInt(durEl ? durEl.value : 120, 10) || 120;

        const parts = fio.split(' ');
        const initials = ((parts[0] ? parts[0][0] : 'А') + (parts[1] ? parts[1][0] : 'Т')).toUpperCase();

        const newStudent = {
          id: 'step-' + Date.now(),
          supabase_id: null,
          access_code: customCode,
          telegram_username: cleanUser,
          full_name: fio,
          avatar: initials,
          status: 'active',
          freeze_details: { is_frozen: false, from: '', to: '' },
          price: price,
          session_duration: dur,
          subscription: {
            id: null,
            price: price,
            total: pack,
            total_sessions: pack,
            used: 0,

            remaining: pack,

          workouts: [],
          anthropometry: [],
          checkups: [],
          inbody: [],
          photo_reports: [],
          active_bookings: []
        };

        // 1. Физически сохраняем ученика в Supabase (users, subscriptions, student_reports)
        const savedOk = await syncStudentToCloud(newStudent);
        if (!savedOk) {
          return;
        }

        if (!Array.isArray(appData.students)) {
          appData.students = [];
        }
        const existingIdx = appData.students.findIndex(s =>
          String(s.id) === String(newStudent.id) ||
          (s.access_code && String(s.access_code).toUpperCase() === customCode)
        );
        if (existingIdx >= 0) {
          appData.students[existingIdx] = newStudent;
        } else {
          appData.students.push(newStudent);
        }
        saveAppData();

        // 2. Безопасно копируем инвайт-код в буфер обмена
        copyInviteCode(customCode, fio);

        // 3. Закрываем модалку и перерисовываем список
        closeModal();
        renderApp();
        showToast(`Подопечный ${fio} создан. Приглашение скопировано.`);
      } catch (err) {
        console.error('Ошибка в createNewStudentRecord:', err);
        showToast('Ошибка при создании подопечного: ' + (err.message || 'неизвестная ошибка'), 'error');

    async function adjustStudentRemainingBalance(studentId, delta) {
    const st = getStudentById(studentId) || (appData.students || []).find(s => String(s.id) === String(studentId));
    if (!st || !st.subscription) return;

    const total = Math.max(0, Number(st.subscription.total_sessions ?? st.subscription.total ?? 0));
    
    // Берём текущий реальный остаток без вычитания used_sessions
    let currentRem = Number(st.subscription.remaining);
    if (isNaN(currentRem)) {
      const prevUsed = Number(st.subscription.used_sessions ?? st.subscription.used ?? 0);
      currentRem = Math.max(0, total - prevUsed);
    }

    // Применяем дельту (+1 или -1)
    let newRemaining = currentRem + Number(delta || 0);
    if (newRemaining < 0) newRemaining = 0;
    if (total > 0 && newRemaining > total) newRemaining = total;

    // Использованные строго равны остатку до общего пакета
    const newUsed = Math.max(0, total - newRemaining);

    // Записываем во все дублирующие поля объекта
    st.subscription.total = total;
    st.subscription.total_sessions = total;
    st.subscription.remaining = newRemaining;
    st.subscription.used = newUsed;
    st.subscription.used_sessions = newUsed;

    await persistStudentToSupabase(st);
    renderApp();
    triggerHaptic('light');
    showToast(`Баланс сохранён: осталось ${newRemaining} из ${total}`);
  }

    async function updateStudentTotalSubscription(studentId, totalVal) {
  const st = getStudentById(studentId) || (appData.students || []).find(s => String(s.id) === String(studentId));
  if (!st || !st.subscription) return;

  const newTotal = Math.max(0, parseInt(totalVal, 10) || 0);

  // Берём текущий остаток напрямую, без вычитания used_sessions
  let currentRem = Number(st.subscription.remaining);
  if (isNaN(currentRem)) {
    const prevUsed = Number(st.subscription.used_sessions ?? st.subscription.used ?? 0);
    currentRem = Math.max(0, newTotal - prevUsed);
  }
  if (newTotal > 0 && currentRem > newTotal) {
    currentRem = newTotal;
  }

  const currentUsed = Math.max(0, newTotal - currentRem);

  st.subscription.total = newTotal;
  st.subscription.total_sessions = newTotal;
  st.subscription.used = currentUsed;
  st.subscription.used_sessions = currentUsed;
  st.subscription.remaining = currentRem;

  await persistStudentToSupabase(st);
  renderApp();
  showToast(`Пакет обновлён в базе: ${currentRem} из ${newTotal} занятий`);
}

    async function executeDeleteStudent(studentId) {
      const strId = String(studentId || '').trim();
      const st = getStudentById(strId) || (appData.students || []).find(s => 
        String(s.id) === strId || 
        String(s.supabase_id) === strId || 
        String(s.access_code || '').toUpperCase() === strId.toUpperCase()
      );

      const targetDbId = st ? (st.supabase_id || st.id) : strId;
      const targetCode = st ? String(st.access_code || '').trim().toUpperCase() : '';
      const safeNumericId = toValidNumericIdOrNull(targetDbId);

      // 1. Мгновенно вычищаем из локального массива appData
      appData.students = (appData.students || []).filter(s => {
        const sId = String(s.id);
        const sSubId = String(s.supabase_id || '');
        const sCode = String(s.access_code || '').toUpperCase();
        if (sId === strId || sId === String(targetDbId)) return false;
        if (sSubId && (sSubId === strId || sSubId === String(targetDbId))) return false;
        if (targetCode && sCode === targetCode) return false;
        return true;
      });

      if (typeof appState !== 'undefined' && appState) {
        appState.students = appData.students;
      }

      // Освобождаем слоты тренера
      if (appData.schedule_slots) {
        Object.keys(appData.schedule_slots).forEach(dateKey => {
          (appData.schedule_slots[dateKey] || []).forEach(slot => {
            const b = String(slot.booked_by || '');
            if (b === strId || b === String(targetDbId) || (st && b === String(st.id))) {
              slot.booked_by = null;
              if (slot.baseline_closed) slot.is_open = false;
            }
          });
        });
      }

      if (String(appData.current_student_id) === strId || String(appData.current_student_id) === String(targetDbId)) {
        appData.current_student_id = appData.students[0] ? appData.students[0].id : null;
      }

      closeModal();
      uiState.selectedStudentId = null;
      uiState.selectedTrainerStudentId = null;
      uiState.trainerStudentSubscreen = null;
      renderApp();
      triggerHaptic('warning');

      // 2. Полное удаление из Supabase
      ensureSupabaseClient();
      if (supabaseClient) {
        try {
          const deletePromises = [];

          if (targetCode) {
            deletePromises.push(supabaseClient.from('student_reports').delete().eq('student_code', targetCode));
          }
          if (safeNumericId) {
            deletePromises.push(supabaseClient.from('student_reports').delete().eq('student_id', safeNumericId));
            deletePromises.push(supabaseClient.from('bookings').delete().eq('student_id', safeNumericId));
            deletePromises.push(supabaseClient.from('subscriptions').delete().eq('student_id', safeNumericId));
            deletePromises.push(supabaseClient.from('users').delete().eq('id', safeNumericId));
          }

          if (targetCode) {
            deletePromises.push(supabaseClient.from('users').delete().ilike('username', `${targetCode}%`));
          }

          await Promise.allSettled(deletePromises);
          await persistScheduleSlotsToSupabase();
          showToast('Подопечный навсегда удалён из базы');
        } catch (err) {
          console.error('Ошибка удаления подопечного из Supabase:', err);
          showToast('Ошибка при удалении из базы', 'error');
        }
      }
    }

                      <span>Минералы: <b class="text-white">${r.minerals} кг</b></span>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

      if (subScreen === 'report_photos') {
        const reports = [...(st.photo_reports || [])].reverse();
        const latest = reports[0];
        return `
          <div class="space-y-4 animate-fade">
            <button onclick="openTrainerStudentSubscreen('reports_hub')" class="text-xs font-semibold text-[#8B949E] hover:text-white flex items-center gap-1.5 py-1.5 px-3 rounded-xl bg-[#161B22] border border-[#30363D]">
              <span>← К карточке подопечного</span>
            </button>

            ${latest ? `
              <div class="bg-[#161B22] border-2 border-[#00E676] rounded-2xl p-4 shadow-neon space-y-3">
                <div class="flex items-center justify-between">
                  <span class="text-xs font-extrabold uppercase text-[#00E676]">Актуальная форма (3 ракурса)</span>
                  <span class="text-xs font-bold text-white">${latest.date}</span>
                </div>
                <div class="grid grid-cols-3 gap-2">
                  ${[
                    { k: 'front_url', l: 'Спереди' },
                    { k: 'side_url', l: 'Сбоку' },
                    { k: 'back_url', l: 'Сзади' }
                  ].map(item => `
                    <div onclick="viewFullscreenPhoto('${item.k}', '${item.l}')" class="cursor-pointer flex flex-col gap-1.5 rounded-xl p-1.5 border border-[#30363D] bg-[#0D1117]">
                      <div class="relative rounded-lg overflow-hidden">
                        <img src="${latest[item.k]}" class="w-full h-32 object-cover" />
                      </div>
                      <button type="button" class="w-full py-1 px-1.5 rounded-lg bg-[#161B22] border border-[#30363D] text-[10px] font-bold text-white">📷 ${item.l}</button>
                    </div>
                  `).join('')}
                </div>
              </div>
            ` : ''}

            <div class="bg-[#161B22] border border-[#30363D] rounded-2xl p-4 space-y-3">
              <h4 class="text-xs font-bold uppercase tracking-wider text-[#8B949E]">Хронологическая галерея прошлых срезов</h4>
              ${reports.map(r => `
                <div class="p-3 rounded-xl bg-[#0D1117] border border-[#30363D] space-y-2">
                  <div class="text-xs font-bold text-[#00E676]">${r.date}</div>
                  <div class="grid grid-cols-3 gap-2">
                    <img src="${r.front_url}" class="w-full h-24 object-cover rounded-lg border border-[#30363D]" />
                    <img src="${r.side_url}" class="w-full h-24 object-cover rounded-lg border border-[#30363D]" />
                    <img src="${r.back_url}" class="w-full h-24 object-cover rounded-lg border border-[#30363D]" />
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      // П.13, П.14, П.15: Настройки баланса, числовой инпут суммы с суффиксом ₽, readonly код доступа, бейдж «Видите только вы»
      if (subScreen === 'management') {
        const durations = [
          { mins: 60, label: '1 час' },
          { mins: 90, label: '1.5 часа' },
          { mins: 120, label: '2 часа' },
          { mins: 180, label: '3 часа' }
        ];
        const numericSum = parseNumericRubles(st.subscription.robokassa_sum);
        return `
          <div class="space-y-4 animate-fade">
            ${topStudentHeader}

            <div class="bg-[#161B22] border border-[#30363D] rounded-2xl p-4 space-y-3">
              <h3 class="text-xs font-bold uppercase tracking-wider text-[#00E676]">1. Баланс занятий</h3>
              <div class="grid grid-cols-2 gap-3 items-center">
                <div>
                  <label class="block text-[11px] text-[#8B949E] mb-1">Пакет тренировок (всего)</label>
                  <input id="tr-mgmt-total-pack" type="number" min="0" max="100" value="${st.subscription.total > 0 ? st.subscription.total : ''}" placeholder="0" onfocus="if(this.value==='0') this.value=''; this.select();" onblur="updateStudentTotalSubscription('${st.id}', this.value)" class="w-full bg-[#090C10] border border-[#30363D] focus:border-[#00E676] rounded-xl px-3 py-2 text-sm font-extrabold text-white outline-none" />
                </div>
                <div>
                  <span class="block text-[11px] text-[#8B949E] mb-1">Текущий остаток: <strong class="text-[#00E676]">${st.subscription.remaining}</strong></span>
                  <div class="flex gap-2">
                    <button onclick="adjustStudentRemainingBalance('${st.id}', -1)" class="flex-1 py-2 rounded-xl bg-[#0D1117] hover:bg-red-950/40 border border-[#30363D] text-xs font-extrabold text-white">-1</button>
                    <button onclick="adjustStudentRemainingBalance('${st.id}', 1)" class="flex-1 py-2 rounded-xl bg-[#10B981] text-[#090C10] text-xs font-extrabold shadow-neon">+1</button>
                  </div>
                </div>
              </div>
            </div>

            <div class="bg-[#161B22] border border-[#30363D] rounded-2xl p-4 space-y-2.5">
              <h3 class="text-xs font-bold uppercase tracking-wider text-[#00E676]">2. Персональная длительность тренировки</h3>
              <p class="text-[11px] text-[#8B949E]">Под эту настройку фильтруются свободные окна у подопечного:</p>
              <div class="grid grid-cols-4 gap-2">
                ${durations.map(d => `
                  <button onclick="setStudentSessionDuration('${st.id}', ${d.mins})" class="py-2.5 rounded-xl text-xs font-extrabold border transition ${
                    Number(st.session_duration) === d.mins
                      ? 'bg-[#10B981] text-[#090C10] border-[#00E676] shadow-neon'
                      : 'bg-[#0D1117] text-white border-[#30363D] hover:bg-[#1F242C]'
                  }">${d.label}</button>
                `).join('')}
              </div>
            </div>

            <div class="bg-[#161B22] border border-[#30363D] rounded-2xl p-4 space-y-3">
              <div class="flex items-center justify-between">
                <h3 class="text-xs font-bold uppercase tracking-wider text-[#00E676]">3. Контакт Telegram и оплата</h3>
                <span class="text-[11px] text-[#8B949E]">День счёта: <strong id="tr-mgmt-payment-day-badge" class="text-white">${st.subscription.payment_day}-е число</strong></span>
              </div>
              <div>
                <label class="block text-[11px] text-[#8B949E] mb-1">Индивидуальный день выставления счёта (только для тренера)</label>
                <select id="tr-mgmt-payment-day" onchange="updateStudentPaymentDay('${st.id}', this.value)" class="w-full bg-[#090C10] border border-[#30363D] focus:border-[#00E676] rounded-xl px-3 py-2 text-xs font-bold text-white outline-none">
                  ${Array.from({ length: 28 }, (_, idx) => idx + 1).map(d => `<option value="${d}" ${Number(st.subscription.payment_day) === d ? 'selected' : ''}>${d}-е число месяца</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="block text-[11px] text-[#8B949E] mb-1">Персональный код доступа (неизменяемый)</label>
                <input type="text" value="${st.access_code}" readonly class="w-full bg-[#090C10]/60 border border-[#30363D] rounded-xl px-3 py-2 text-xs font-extrabold text-[#00E676] tracking-wider opacity-80 cursor-not-allowed outline-none" />
              </div>
              <div>
                <label class="block text-[11px] text-[#8B949E] mb-1">Telegram @username подопечного (для голосовых ответов)</label>
                <input id="tr-mgmt-tg-username" type="text" value="${st.telegram_username || ''}" placeholder="Например: alex_voronov" class="w-full bg-[#090C10] border border-[#30363D] focus:border-[#00E676] rounded-xl px-3 py-2 text-xs font-bold text-white outline-none" />
              </div>
              <div>
                <label class="block text-[11px] text-[#8B949E] mb-1">Сумма к оплате</label>
                <div class="relative flex items-center">
                  <input id="tr-mgmt-robokassa-sum" type="number" min="0" step="500" value="${numericSum > 0 ? numericSum : ''}" placeholder="0" onfocus="if(this.value==='0') this.value=''; this.select();" class="w-full bg-[#090C10] border border-[#30363D] focus:border-[#00E676] rounded-xl pl-3 pr-9 py-2 text-xs font-bold text-white outline-none" />
                  <span class="absolute right-4 pointer-events-none text-[#8B949E] font-bold">₽</span>
                </div>
              </div>
              <div>
                <label class="block text-[11px] text-[#8B949E] mb-1">Персональная ссылка на оплату абонемента</label>
                <input id="tr-mgmt-robokassa-url" type="text" value="${st.subscription.robokassa_url || ''}" placeholder="https://..." class="w-full bg-[#090C10] border border-[#30363D] focus:border-[#00E676] rounded-xl px-3 py-2 text-xs text-white outline-none" />
              </div>
            </div>

            <div class="bg-[#161B22] border border-[#30363D] rounded-2xl p-4 space-y-2">
              <h3 class="text-xs font-bold uppercase tracking-wider text-[#00E676] flex items-center gap-1.5">
                <i data-lucide="heart-pulse" class="w-4 h-4 text-[#00E676]"></i>
                <span>4. ОГРАНИЧЕНИЯ ПО ЗДОРОВЬЮ</span>
              </h3>
              <p class="text-xs text-white bg-[#0D1117] p-3 rounded-xl border border-[#30363D]">
                ${st.medical_notes || 'Ограничений не указано'}
              </p>
            </div>

            <div class="bg-[#161B22] border border-[#30363D] rounded-2xl p-4 space-y-2.5">
              <div class="flex items-center justify-between">
                <h3 class="text-xs font-bold uppercase tracking-wider text-[#00E676]">5. Скрытая заметка тренера</h3>
                <span class="text-[10px] text-[#8B949E]">Видите только вы</span>
              </div>
              <textarea id="tr-mgmt-private-notes" rows="3" placeholder="Цели, психология, особенности режима клиента..." class="w-full bg-[#090C10] border border-[#30363D] focus:border-[#00E676] rounded-xl p-3 text-xs text-white outline-none resize-none">${st.trainer_private_notes || ''}</textarea>
              <button type="button" onclick="saveTrainerManagementFinanceAndNotes('${st.id}')" class="w-full py-3 rounded-xl bg-gradient-to-r from-[#10B981] to-[#00E676] text-[#090C10] font-extrabold text-xs uppercase tracking-wider shadow-neon active:scale-[0.99] transition">
                Сохранить информацию
              </button>
            </div>

            <div class="pt-1">
              <button type="button" onclick="confirmDeleteStudent('${st.id}')" class="w-full py-3 rounded-xl bg-red-950/30 hover:bg-red-900/50 active:scale-95 border border-red-500/40 hover:border-red-500 text-red-400 hover:text-red-300 font-bold text-xs uppercase tracking-wider transition flex items-center justify-center gap-2">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
                <span>Удалить ученика</span>
              </button>
            </div>
          </div>
        `;
      }

      return renderTrainerStudentPage(st, topStudentHeader);
    }

    function renderTrainerStudentPage(st, topStudentHeader) {
      return `
        <div class="space-y-4 animate-fade">
          ${topStudentHeader}

          <div class="space-y-2.5 pt-1">
            <button onclick="openTrainerStudentSubscreen('workouts')" class="w-full text-left bg-[#161B22] hover:bg-[#1F242C] border border-[#30363D] hover:border-[#00E676] rounded-2xl px-4 py-3.5 flex items-center justify-between gap-3.5 transition group shadow-lg">
              <div class="w-10 h-10 rounded-xl bg-[#0D1117] border border-[#30363D] group-hover:border-[#00E676] flex items-center justify-center text-[#00E676] shrink-0">
                <i data-lucide="dumbbell" class="w-5 h-5"></i>
              </div>
              <h3 class="flex-1 text-sm font-extrabold text-white group-hover:text-[#00E676] transition">1. Тренировки</h3>
              <i data-lucide="chevron-right" class="w-5 h-5 text-[#8B949E] group-hover:text-[#00E676] shrink-0"></i>
            </button>

            <button onclick="openTrainerStudentSubscreen('reports_hub')" class="w-full text-left bg-[#161B22] hover:bg-[#1F242C] border border-[#30363D] hover:border-[#00E676] rounded-2xl px-4 py-3.5 flex items-center justify-between gap-3.5 transition group shadow-lg">
              <div class="w-10 h-10 rounded-xl bg-[#0D1117] border border-[#30363D] group-hover:border-[#00E676] flex items-center justify-center text-[#00E676] shrink-0">
                <i data-lucide="bar-chart-3" class="w-5 h-5"></i>
              </div>
              <h3 class="flex-1 text-sm font-extrabold text-white group-hover:text-[#00E676] transition">2. Отчёты и прогресс</h3>
              <i data-lucide="chevron-right" class="w-5 h-5 text-[#8B949E] group-hover:text-[#00E676] shrink-0"></i>
            </button>

            <button onclick="openTrainerStudentSubscreen('management')" class="w-full text-left bg-[#161B22] hover:bg-[#1F242C] border border-[#30363D] hover:border-[#00E676] rounded-2xl px-4 py-3.5 flex items-center justify-between gap-3.5 transition group shadow-lg">
              <div class="w-10 h-10 rounded-xl bg-[#0D1117] border border-[#30363D] group-hover:border-[#00E676] flex items-center justify-center text-[#00E676] shrink-0">
                <i data-lucide="settings-2" class="w-5 h-5"></i>
              </div>
              <h3 class="flex-1 text-sm font-extrabold text-white group-hover:text-[#00E676] transition">3. Управление и баланс</h3>
              <i data-lucide="chevron-right" class="w-5 h-5 text-[#8B949E] group-hover:text-[#00E676] shrink-0"></i>
            </button>
          </div>
        </div>
      `;
    }

    function initReportChartsIfNeeded() {
      if (!window.Chart) return;
      const student = getCurrentStudent();
      if (!student) return;

      const inbodyCanvas = document.getElementById('chart-inbody-params');
      if (inbodyCanvas) {
        const list = (student.inbody || []).map(enrichInBodyRecord);
        const labels = list.map(i => i.date.slice(0, 5));
        activeCharts.inbodyChart = new Chart(inbodyCanvas.getContext('2d'), {
          type: 'line',
          data: {
            labels,
            datasets: [
              {
                label: 'Мышцы (кг)',
                data: list.map(i => i.muscle_mass),
                borderColor: '#00E676',
                backgroundColor: 'transparent',
                borderWidth: 2.5,
                tension: 0.3
              },
              {
                label: 'Жир (%)',
                data: list.map(i => i.body_fat_pct),
                borderColor: '#F59E0B',
                backgroundColor: 'transparent',
                borderWidth: 2.5,
                tension: 0.3
              },
              {
                label: 'Вода (л)',
                data: list.map(i => i.water),
                borderColor: '#38BDF8',
                backgroundColor: 'transparent',
                borderWidth: 2,
                tension: 0.3
              },
              {
                label: 'Вес (кг)',
                data: list.map(i => i.weight),
                borderColor: '#A855F7',
                backgroundColor: 'transparent',
                borderWidth: 2,
                tension: 0.3
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { labels: { color: '#FFFFFF', boxWidth: 12, font: { size: 10 } } } },
            scales: {
              x: { ticks: { color: '#8B949E' }, grid: { color: '#30363D44' } },
              y: { ticks: { color: '#8B949E' }, grid: { color: '#30363D44' } }
            }
          }
        });
      }
    }

    // П.13: Очистка таббара тренера (чистые подписи «Расписание» и «Подопечные» без «1.» и «2.»)
    function renderBottomTabBar() {
      const nav = document.getElementById('app-tabbar');
      if (!appData.current_role || (appData.current_role === 'student' && uiState.workoutEditorOpen)) {
        nav.classList.add('hidden');
        nav.innerHTML = '';
        return;
      }
      nav.classList.remove('hidden');

      if (appData.current_role === 'student') {
        const tabs = [
          { id: 'booking', label: 'Бронирование', icon: 'calendar-clock' },
          { id: 'workouts', label: 'Тренировки', icon: 'dumbbell' },
          { id: 'reports', label: 'Отчёты', icon: 'line-chart' },
          { id: 'profile', label: 'Профиль', icon: 'user' }
        ];
        nav.innerHTML = `
          <div class="grid grid-cols-4 gap-1 px-2 py-2">
            ${tabs.map(t => {
              const active = uiState.studentTab === t.id;
              return `
                <button onclick="setStudentTab('${t.id}')" class="py-1.5 rounded-xl flex flex-col items-center justify-center gap-1 transition ${
                  active ? 'text-[#00E676] bg-[#1F242C] border border-[#10B981]/40 shadow-neon' : 'text-[#8B949E] hover:text-white'
                }">
                  <i data-lucide="${t.icon}" class="w-4 h-4"></i>
                  <span class="text-[10px] font-bold">${t.label}</span>
                </button>
              `;
            }).join('')}
          </div>
        `;
      } else if (appData.current_role === 'trainer') {
        const tabs = [
          { id: 'schedule', label: 'Расписание', icon: 'calendar-range' },
          { id: 'students', label: 'Подопечные', icon: 'users' }
        ];
        nav.innerHTML = `
          <div class="grid grid-cols-2 gap-2 px-3 py-2">
            ${tabs.map(t => {
              const active = uiState.trainerTab === t.id;
              return `
                <button onclick="setTrainerTab('${t.id}')" class="py-2 rounded-xl flex items-center justify-center gap-2 transition ${
                  active ? 'text-[#090C10] bg-gradient-to-r from-[#10B981] to-[#00E676] font-extrabold shadow-neon' : 'text-[#8B949E] bg-[#0D1117] border border-[#30363D] hover:text-white font-bold'
                }">
                  <i data-lucide="${t.icon}" class="w-4 h-4"></i>
                  <span class="text-xs">${t.label}</span>
                </button>
              `;
            }).join('')}
          </div>
        `;
      }
    }

    function renderHeader() {
      const badge = document.getElementById('header-role-badge');
      const subtitle = document.getElementById('header-subtitle');
      if (!badge) return;

      if (!appData.current_role) {
        badge.textContent = 'АВТОРИЗАЦИЯ';
        if (subtitle) {
          subtitle.textContent = '';
          subtitle.classList.add('hidden');
        }
      } else if (appData.current_role === 'student') {
        const st = getCurrentStudent();
        badge.textContent = 'ПОДОПЕЧНЫЙ';
        if (subtitle) {
          subtitle.textContent = st ? st.full_name : 'Личный кабинет';
          subtitle.classList.remove('hidden');
        }
      } else {
        badge.textContent = 'ТРЕНЕР';
        if (subtitle) {
          subtitle.textContent = '';
          subtitle.classList.add('hidden');
        }
      }
    }
    const updateHeaderBadge = renderHeader;

    function renderApp() {
      destroyAllCharts();
      updateHeaderBadge();
      renderBottomTabBar();

      const main = document.getElementById('app-main');
      if (!appData.current_role) {
        main.innerHTML = renderOnboardingScreen();
      } else if (appData.current_role === 'student') {
        if (uiState.studentTab === 'booking') main.innerHTML = renderStudentBookingTab();
        else if (uiState.studentTab === 'workouts') main.innerHTML = renderStudentWorkoutsTab();
        else if (uiState.studentTab === 'reports') main.innerHTML = renderStudentReportsTab();
        else if (uiState.studentTab === 'profile') main.innerHTML = renderStudentProfileTab();
      } else if (appData.current_role === 'trainer') {
        if (uiState.trainerTab === 'schedule') main.innerHTML = renderTrainerScheduleTab();
        else main.innerHTML = renderTrainerStudentsTab();
      }

      if (window.lucide) {
        if (main) lucide.createIcons({ root: main });
        const nav = document.getElementById('app-tabbar');
        if (nav && !nav.classList.contains('hidden')) lucide.createIcons({ root: nav });
      }
      initReportChartsIfNeeded();
    }

    window.addEventListener('DOMContentLoaded', async () => {
      initTelegramSDK();
      initTapToDismissKeyboard();
      ensureSupabaseClient();
      if (!appData) {
        appData = buildInitialSeedData();
        appState = appData;
      }

      try {
        if (typeof localStorage !== 'undefined') {
          localStorage.removeItem('sv_cached_students');
          localStorage.removeItem('sv_cached_schedule');
        }
      } catch (e) {}

      const headerEl = document.getElementById('app-header');
      if (window.lucide && headerEl) {
        lucide.createIcons({ root: headerEl });
      }

      // 1. Восстанавливаем только токены сессии (sv_role, sv_student_id, sv_access_code)
      await restoreSessionFromTelegram();
      renderApp();

      // 2. Запрашиваем актуальные данные строго из Supabase для тренера и ученика
      try {
        await syncAllStudentsFromSupabase();
      } catch (err) {
        console.warn('Ошибка загрузки из Supabase при старте:', err);
      }
    });
  </script>
</body>
</html>
